м^3$ (до сотых):", "opts": ["0,94", "1,88", "0,47", "3,77"], "expl": "$\\pi\\cdot 0{,}25\\cdot 1{,}2=0{,}942$.", "sol": "$V=\\pi R^2h=3{,}14\\cdot 0{,}25\\cdot 1{,}2=0{,}942\\approx 0{,}94\\ м^3$."}, {"q": "Сколько литров вмещает бак ($1\\ м^3=1000$ л)?", "opts": ["942 л", "94,2 л", "1884 л", "471 л"], "expl": "$0{,}942\\cdot 1000$.", "sol": "$0{,}942\\ м^3\\cdot 1000=942$ л."}, {"q": "Площадь боковой поверхности ($м^2$):", "opts": ["3,768", "1,884", "4,553", "7,536"], "expl": "$2\\pi Rh=2\\cdot 3{,}14\\cdot 0{,}5\\cdot 1{,}2$.", "sol": "$S_{бок}=2\\pi Rh=2\\cdot 3{,}14\\cdot 0{,}5\\cdot 1{,}2=3{,}768\\ м^2$."}, {"q": "Площадь поверхности бака без крышки ($м^2$):", "opts": ["4,553", "5,338", "3,768", "4,082"], "expl": "$2\\pi Rh+\\pi R^2$.", "sol": "Без крышки: боковая поверхность + одно дно. $3{,}768+\\pi R^2=3{,}768+0{,}785=4{,}553\\ м^2$."}, {"q": "Во сколько раз увеличится объём, если радиус увеличить в 2 раза?", "opts": ["в 4 раза", "в 2 раза", "в 8 раз", "в 6 раз"], "expl": "$V\\sim R^2$.", "sol": "$V=\\pi R^2h$: при $R\\to 2R$ объём умножается на $2^2=4$."}]}, {"id": "mc6", "topic": "m6", "title": "Рост бактерий", "kind": "Модель", "text": "Число бактерий удваивается каждый час. В начале было 500 бактерий: $N(t)=500\\cdot 2^t$.", "code": null, "qs": [{"q": "Сколько бактерий будет через 3 часа?", "opts": ["4000", "1500", "3000", "8000"], "expl": "$500\\cdot 2^3$.", "sol": "$N(3)=500\\cdot 2^3=500\\cdot 8=4000$."}, {"q": "Через сколько часов их станет 16 000?", "opts": ["5", "4", "6", "32"], "expl": "$2^t=32$.", "sol": "$500\\cdot 2^t=16\\,000$ → $2^t=32=2^5$ → $t=5$ ч."}, {"q": "Во сколько раз число бактерий увеличится за 10 часов?", "opts": ["1024", "20", "100", "512"], "expl": "$2^{10}$.", "sol": "$\\frac{N(t+10)}{N(t)}=2^{10}=1024$."}, {"q": "Через сколько часов станет 1 000 000?", "opts": ["$\\log_2 2000$", "$\\log_2 1\\,000\\,000$", "1000", "$\\lg 2000$"], "expl": "$2^t=2000$.", "sol": "$500\\cdot 2^t=1\\,000\\,000$ → $2^t=2000$ → $t=\\log_2 2000$ (≈ 11 ч const ET=[
{id:'e1',per:'IELTS',name:'Формат IELTS и как считаются баллы',html:`
<h3>Что такое IELTS</h3>
<p>IELTS — международный экзамен по английскому. Есть два вида: <b>Academic</b> (для учёбы в университете) и <b>General Training</b> (для работы и переезда). <b>Listening и Speaking</b> у них одинаковые, а <b>Reading и Writing</b> отличаются.</p>
<table><thead><tr><th>Часть</th><th>Время</th><th>Задания</th></tr></thead><tbody>
<tr><td><b>Listening</b></td><td>около 30 мин (на бумаге +10 мин на перенос ответов; на компьютере 2 мин на проверку)</td><td>40 вопросов, 4 части: 2 диалога и 2 монолога</td></tr>
<tr><td><b>Reading</b></td><td>60 мин (дополнительного времени на перенос нет)</td><td>40 вопросов, 3 текста (Academic: всего 2150–2750 слов)</td></tr>
<tr><td><b>Writing</b></td><td>60 мин</td><td>2 задания: Task 1 (≥150 слов, ~20 мин) и Task 2 (≥250 слов, ~40 мин)</td></tr>
<tr><td><b>Speaking</b></td><td>11–14 мин</td><td>3 части, разговор с экзаменатором</td></tr>
</tbody></table>
<p>Listening, Reading и Writing сдаются в один день и <b>без перерывов</b>. Speaking — в тот же день или в пределах 7 дней до или после. Всего около 2 ч 45 мин.</p>
<h3>Изменения 2026 года</h3>
<ul><li>С середины 2026 года IELTS на бумаге больше не проводится: <b>все тесты сдаются на компьютере</b> (сроки зависят от страны).</li>
<li>Появилась опция <b>Writing on Paper</b>: Listening и Reading на компьютере, а Writing от руки.</li>
<li><b>One Skill Retake</b> — можно пересдать одну часть, не сдавая весь экзамен заново (доступно не везде, уточняй в своём центре).</li></ul>
<h3>Баллы (band score)</h3>
<p>Каждая часть оценивается от 0 до 9 с шагом 0,5. <b>Итоговый балл</b> — среднее четырёх частей, округлённое до ближайшего целого или половины. Пример: 8,5 + 9 + 8 + 8,5 = 34, 34 : 4 = 8,5. А 9 + 9 + 8 + 8,5 = 34,5 : 4 = 8,625 → <b>8,5</b>. Если среднее заканчивается на 0,25 или 0,75, его округляют вверх: 8,25 → 8,5; 8,75 → 9.</p>
<p>Чтобы получить <b>9,0 overall</b>, нужно в среднем минимум 8,75: например 9 / 9 / 8,5 / 8,5.</p>
<h3>Перевод баллов Listening и Academic Reading</h3>
<p>Один правильный ответ — 1 балл, всего 40. Средние значения (в каждом варианте теста могут чуть отличаться):</p>
<table><thead><tr><th>Верных из 40</th><th>Band</th></tr></thead><tbody>
<tr><td>39–40</td><td><b>9</b></td></tr><tr><td>37–38</td><td>8,5</td></tr><tr><td>35–36</td><td>8</td></tr><tr><td>32–34</td><td>7,5</td></tr><tr><td>30–31</td><td>7</td></tr><tr><td>26–29</td><td>6,5</td></tr><tr><td>23–25</td><td>6</td></tr><tr><td>18–22</td><td>5,5</td></tr><tr><td>16–17</td><td>5</td></tr></tbody></table>
<p>В <b>General Training Reading</b> для того же балла нужно больше верных ответов: тексты там проще.</p>
<p><b>Вывод для 9,0:</b> в Listening и Reading можно ошибиться не больше чем в 1 вопросе. Пустой ответ = 0, за ошибку баллы не снимают, поэтому <b>отвечай на всё</b>.</p>
<h3>План подготовки к 9,0</h3>
<ol><li>Грамматика (разделы этого приложения) — до полной точности: ошибки снижают балл за GRA в Writing и Speaking.</li>
<li>Каждый день: 20–30 слов из «Словаря» + чтение статей (The Guardian, BBC, The Economist, National Geographic).</li>
<li>Listening: подкасты и лекции без субтитров (BBC 6 Minute English → BBC Radio 4 → TED), диктант по 1–2 минуты.</li>
<li>Тесты: официальные сборники Cambridge IELTS (Cambridge University Press) и бесплатные пробники на ielts.org, takeielts.britishcouncil.org, ielts.idp.com.</li>
<li>Writing: 2–3 эссе в неделю на время, разбор по 4 критериям. <b>Присылай свои эссе мне в чат</b> — разберу по критериям IELTS.</li>
<li>Speaking: записывай ответы на телефон и слушай: паузы, повторы, произношение.</li></ol>`},

{id:'e2',per:'IELTS',name:'Listening: задания и стратегии',html:`
<h3>Четыре части</h3>
<ul><li><b>Part 1</b> — бытовой диалог (бронирование, запись на курс). Обычно заполнение формы: имена по буквам, номера телефонов, даты, цены.</li>
<li><b>Part 2</b> — бытовой монолог (экскурсия, объявление, рассказ о местном объекте). Часто карта или план.</li>
<li><b>Part 3</b> — учебный диалог 2–4 человек (студенты обсуждают проект с преподавателем).</li>
<li><b>Part 4</b> — академическая лекция-монолог. Части 4 перерывов нет, обычно 10 пропусков в конспекте.</li></ul>
<p>Запись звучит <b>один раз</b>. Акценты разные: британский, австралийский, американский, новозеландский, канадский.</p>
<h3>Типы заданий</h3>
<p>Multiple choice, matching, plan/map/diagram labelling, form/note/table/flow-chart/summary completion, sentence completion, short-answer questions.</p>
<h3>Главные ловушки</h3>
<ul><li><b>Исправления:</b> «It's on the 14th — oh no, sorry, the 15th». Верно последнее.</li>
<li><b>Дистракторы:</b> в записи звучат все варианты ответа, но верный — тот, что подтверждён, а не тот, что прозвучал первым.</li>
<li><b>Синонимы:</b> в вопросе «cheap», в записи «it won't cost much». Ответ редко звучит теми же словами, что в задании.</li>
<li><b>Лимит слов:</b> «NO MORE THAN TWO WORDS AND/OR A NUMBER». Три слова = ответ неверный, даже если смысл правильный.</li>
<li><b>Орфография:</b> ошибка в слове = 0 баллов. Допускаются британский и американский варианты (colour/color).</li>
<li><b>Числа и даты:</b> «fifteen» ≠ «fifty» (ударение: fif<b>TEEN</b> — FIF-ty). Даты можно писать 15 March или March 15.</li>
<li><b>Буквы:</b> путают <b>A/E/I</b>, <b>G/J</b>, <b>B/V</b>. «Double L» = LL. Ноль часто читают как «oh».</li></ul>
<h3>Стратегия</h3>
<ol><li>Пока есть время перед частью — прочитай вопросы, подчеркни ключевые слова и <b>предскажи тип ответа</b> (число? имя? существительное?).</li>
<li>Следи за <b>сигнальными словами</b>: «however», «actually», «the main reason», «finally», «moving on to».</li>
<li>Пропустил ответ — сразу переходи к следующему вопросу, не застревай.</li>
<li>Проверь грамматику: слово должно подходить в предложение (единственное/множественное число).</li></ol>
<h3>Как тренироваться до 9</h3>
<ul><li><b>Диктант:</b> 1 минута записи → записать дословно → сверить со скриптом.</li>
<li><b>Shadowing:</b> повторяй за диктором с отставанием в полсекунды — помогает и в Listening, и в Speaking.</li>
<li>После каждого теста разбирай <b>каждую</b> ошибку по скрипту: почему ты услышал не то?</li>
<li>В этом приложении есть тренировка аудирования: тексты озвучиваются голосом браузера (раздел «Тесты» → контексты «Listening»).</li></ul>`},

{id:'e3',per:'IELTS',name:'Reading: задания и стратегии',html:`
<h3>Что в Reading</h3>
<p><b>Academic:</b> 3 длинных текста из книг, журналов и газет, последний — самый сложный. <b>General Training:</b> короткие объявления и рекламные тексты, тексты о работе и один длинный текст общего характера.</p>
<p>60 минут = около <b>20 минут на текст</b>. На компьютере ответы вводятся сразу, на бумаге времени на перенос не дают.</p>
<h3>TRUE / FALSE / NOT GIVEN — главное задание</h3>
<table><tbody>
<tr><td class="y">TRUE</td><td>Утверждение <b>совпадает</b> с текстом (обычно другими словами).</td></tr>
<tr><td class="y">FALSE</td><td>Текст говорит <b>обратное</b>, утверждение ему противоречит.</td></tr>
<tr><td class="y">NOT GIVEN</td><td>В тексте <b>нет информации</b>, чтобы сказать «да» или «нет».</td></tr></tbody></table>
<p>Для мнений автора — <b>YES / NO / NOT GIVEN</b> (то же самое, только про взгляды автора).</p>
<p><b>Пример.</b> Текст: «The bridge was completed in 1890, two years later than planned.»</p>
<ul><li>«The bridge was finished behind schedule.» — <b>TRUE</b> (two years later than planned).</li>
<li>«The bridge was completed ahead of schedule.» — <b>FALSE</b>.</li>
<li>«The bridge was the longest in Europe.» — <b>NOT GIVEN</b> (о длине ничего нет).</li></ul>
<p><b>Ловушки:</b> слова-ограничители <b>all, always, only, never, most, some, usually</b>. Если в тексте «some scientists believe», а в утверждении «all scientists believe» — это FALSE или NOT GIVEN, но не TRUE. Не используй свои знания: важно только то, что написано.</p>
<h3>Другие типы заданий</h3>
<ul><li><b>Matching headings</b> — заголовок к абзацу. Ищи главную мысль, а не совпадающие слова; часто она в 1–2 предложениях абзаца.</li>
<li><b>Matching information</b> — «в каком абзаце есть…». Абзацы могут повторяться.</li>
<li><b>Matching features</b> — утверждение ↔ учёный или страна.</li>
<li><b>Summary / sentence / table completion</b> — слова только из текста, с лимитом слов.</li>
<li><b>Multiple choice</b>, <b>short-answer questions</b>, <b>diagram labelling</b>.</li></ul>
<h3>Стратегия</h3>
<ol><li><b>Skimming</b> (1–2 мин): быстро прочитай заголовок, первые предложения абзацев — пойми, о чём текст и где что.</li>
<li><b>Scanning:</b> ищи в тексте имена, числа, даты, термины из вопроса.</li>
<li>Ответы на большинство заданий идут <b>по порядку текста</b> (кроме matching headings, matching information и summary).</li>
<li>Читай найденное место <b>внимательно</b>, ищи синонимы: «decline» = «fall», «rise» = «increase», «obsolete» = «no longer used».</li>
<li>Не трать на один вопрос больше 1,5–2 минут: отметь его и вернись.</li></ol>
<h3>Как дойти до 9</h3>
<ul><li>Каждый день 1 длинная статья из The Economist / The Guardian / Scientific American: выписывай слова и перефразирования.</li>
<li>После теста разбирай каждую ошибку: найди в тексте предложение, которое доказывает ответ.</li>
<li>В этом приложении — 6 текстов в формате IELTS (раздел «Тесты» → контексты «Reading»).</li></ul>`},

{id:'e4',per:'IELTS',name:'Writing Task 1: графики и письмо',html:`
<h3>Academic Task 1</h3>
<p>Описать график, таблицу, диаграмму, карту или процесс: <b>минимум 150 слов, около 20 минут</b>. Мнение и причины не нужны — только факты из картинки.</p>
<h3>Структура (4 абзаца)</h3>
<ol><li><b>Introduction</b> — перефразируй задание (своими словами).</li>
<li><b>Overview</b> — 2 главные тенденции без цифр. <b>Без overview выше 5 баллов за Task Achievement не получить.</b></li>
<li><b>Body 1</b> — детали и цифры по первой группе.</li>
<li><b>Body 2</b> — детали и цифры по второй группе, сравнения.</li></ol>
<h3>Язык описания тенденций</h3>
<table><tbody>
<tr><td class="y">Рост</td><td>rise, increase, grow, climb, surge (резкий), soar (взлететь)</td></tr>
<tr><td class="y">Падение</td><td>fall, decrease, decline, drop, plummet (резко), dip (немного)</td></tr>
<tr><td class="y">Без изменений</td><td>remain stable / steady, level off, plateau, stay constant</td></tr>
<tr><td class="y">Колебания</td><td>fluctuate, fluctuation</td></tr>
<tr><td class="y">Пик / минимум</td><td>peak at, reach a peak of, hit a low of, bottom out</td></tr>
<tr><td class="y">Степень</td><td>dramatically, sharply, significantly, steadily, gradually, slightly, marginally</td></tr>
<tr><td class="y">Доли</td><td>a quarter, a third, roughly half, the vast majority, a small minority</td></tr></tbody></table>
<p><b>Две конструкции:</b> «Sales rose <b>sharply</b>» и «There was a <b>sharp rise</b> in sales». Чередуй их.</p>
<p><b>Предлоги:</b> rose <b>from</b> 10% <b>to</b> 25%; rose <b>by</b> 15% (на сколько); peaked <b>at</b> 40%; a rise <b>of</b> 15%.</p>
<h3>Образец ответа (собственный, уровень band 9)</h3>
<p><i>Задание: график показывает долю домохозяйств с доступом к интернету в трёх странах с 2000 по 2020 год.</i></p>
<div class="card">
<p>The line graph compares the proportion of households with internet access in Canada, Mexico and India over a twenty-year period beginning in 2000.</p>
<p>Overall, connectivity rose in all three nations, although Canada consistently had the highest rate. The most dramatic change, however, occurred in India, which started from an almost negligible base.</p>
<p>In 2000, roughly 40% of Canadian homes were online, compared with just 5% in Mexico and under 1% in India. In other words, the Canadian rate was initially eight times that of Mexico. Canada's figure climbed steadily to approximately 80% by 2010 and then levelled off, reaching around 90% at the end of the period.</p>
<p>Mexico followed a similar but slower trajectory, with access more than tripling to 18% in 2010 before accelerating to just over half of all households by 2020. India, by contrast, remained below 10% for the first decade, yet it surged in the final ten years, ending the period at about 45%, not far behind Mexico.</p>
</div>
<p class="small mut">162 слов. Есть overview, все цифры сгруппированы, разные конструкции, точные слова (negligible, trajectory, levelled off).</p>
<h3>Процесс и карта</h3>
<ul><li><b>Процесс:</b> пассив (is heated, are transported) и слова последовательности (first, subsequently, once…, finally). Overview: сколько этапов, с чего начинается и чем заканчивается.</li>
<li><b>Карта:</b> прошедшее время и пассив (was demolished, were replaced by, has been converted into), стороны света (to the north of).</li></ul>
<h3>General Training Task 1 — письмо</h3>
<p>Письмо минимум 150 слов по 3 пунктам задания. Тон: <b>formal</b> (компании, начальнику), <b>semi-formal</b> (соседу, преподавателю), <b>informal</b> (другу).</p>
<ul><li>Formal: «Dear Sir or Madam,» → «Yours faithfully,»; если известно имя: «Dear Mr Smith,» → «Yours sincerely,».</li>
<li>Informal: «Dear Anna,» / «Hi Tom,» → «Best wishes,» / «Take care,». Можно сокращения (I'm, can't).</li>
<li><b>Раскрой все 3 пункта</b>, по абзацу на каждый, — иначе балл за Task Achievement падает.</li></ul>`},

{id:'e5',per:'IELTS',name:'Writing Task 2: эссе на 9',html:`
<h3>Задание</h3>
<p>Эссе <b>минимум 250 слов, около 40 минут</b>. Task 2 весит <b>в два раза больше</b>, чем Task 1. Если написать меньше 250 слов, балл снижают.</p>
<h3>Типы эссе</h3>
<table><tbody>
<tr><td class="y">Opinion</td><td>To what extent do you agree or disagree? — ясная позиция во введении и до конца.</td></tr>
<tr><td class="y">Discussion</td><td>Discuss both views and give your own opinion. — обе стороны + своё мнение.</td></tr>
<tr><td class="y">Advantages / disadvantages</td><td>Do the advantages outweigh the disadvantages? — нужен вывод, чего больше.</td></tr>
<tr><td class="y">Problem / solution</td><td>What are the causes / problems? What solutions…? — ответ на <b>оба</b> вопроса.</td></tr>
<tr><td class="y">Two-part question</td><td>Два разных вопроса — ответь на каждый.</td></tr></tbody></table>
<h3>Структура (4–5 абзацев)</h3>
<ol><li><b>Введение</b> (2–3 предложения): перефразированная тема + <b>thesis</b> (твоя позиция / план).</li>
<li><b>Body 1 и Body 2:</b> topic sentence → объяснение → пример → итог абзаца. Одна главная идея на абзац.</li>
<li><b>Заключение:</b> повтори позицию другими словами. Новых идей не добавляй.</li></ol>
<h3>Чем отличается 9 от 7 (по официальным критериям)</h3>
<table><thead><tr><th>Критерий</th><th>Band 7</th><th>Band 9</th></tr></thead><tbody>
<tr><td><b>Task Response</b></td><td>все части задания раскрыты, позиция ясна, но идеи иногда слишком общие</td><td>все части раскрыты <b>полностью</b>, позиция развита, идеи расширены и подкреплены</td></tr>
<tr><td><b>Coherence & Cohesion</b></td><td>логично, связки иногда используются слишком часто или слишком редко</td><td>связность <b>не привлекает внимания</b>, абзацы безупречны</td></tr>
<tr><td><b>Lexical Resource</b></td><td>есть менее частотные слова, встречаются ошибки в сочетаемости</td><td>широкий словарь, естественное владение, ошибки — только редкие <b>«slips»</b></td></tr>
<tr><td><b>Grammatical Range & Accuracy</b></td><td>сложные структуры есть, часто без ошибок</td><td>широкий диапазон структур, <b>полная</b> гибкость и точность</td></tr></tbody></table>
<h3>Что снижает балл</h3>
<ul><li>Выученные наизусть шаблоны вроде «In this day and age, it is a controversial issue…» — экзаменаторы видят их сразу.</li>
<li>«Механические» связки в начале каждого предложения (Firstly, Moreover, Furthermore, In addition…).</li>
<li>Редкие слова не к месту — естественность важнее «умных» слов.</li>
<li>Позиция меняется в середине эссе или не совпадает с заключением.</li>
<li>Примеры без объяснения, общие фразы («many people think»).</li></ul>
<h3>Образец эссе (собственный, уровень band 9)</h3>
<p><i>Some people believe that university education should be free for everyone, while others think students should pay for it. Discuss both views and give your opinion.</i></p>
<div class="card">
<p>Whether higher education should be funded by the state or by the students who benefit from it is a question that divides policymakers worldwide. While there are reasonable grounds for asking students to contribute, I believe that tuition should be free, because the advantages to society as a whole outweigh the cost.</p>
<p>Those who favour tuition fees argue that graduates are the main beneficiaries of their degrees. Since university qualifications are usually associated with higher lifetime earnings, it seems fair that the individual, rather than every taxpayer, should bear at least part of the expense. Supporters also claim that paying for a course encourages students to take their studies more seriously and discourages them from enrolling in programmes they are not committed to. From this perspective, free tuition is simply a subsidy for people who are already likely to be better off.</p>
<p>However, this view overlooks the wider returns that an educated population generates. Doctors, engineers and teachers trained at public expense go on to provide services on which everyone depends, and higher earners also pay more tax over their careers, effectively repaying their education many times over. More importantly, fees deter talented applicants from low-income families, who are often unwilling to take on large debts. A system that selects students partly by their parents' wealth not only wastes ability but also entrenches inequality from one generation to the next.</p>
<p>In conclusion, although asking students to pay may appear fairer to taxpayers, free university education is a sounder investment, as it widens access to opportunity and ultimately benefits the whole of society rather than only the individual graduate.</p>
</div>
<p class="small mut">268 слов. Обе стороны раскрыты, позиция дана во введении и в заключении, связки естественные (However, More importantly, In conclusion), разнообразная грамматика (пассив, условные и относительные придаточные, not only… but also).</p>
<h3>План на 40 минут</h3>
<ol><li>5 мин — разобрать задание (сколько вопросов?) и составить план.</li><li>30 мин — писать.</li><li>5 мин — проверить: артикли, согласование подлежащего и сказуемого, -s, времена, орфографию.</li></ol>`},

{id:'e6',per:'IELTS',name:'Speaking: части 1–3',html:`
<h3>Формат</h3>
<table><tbody>
<tr><td class="y">Part 1 (4–5 мин)</td><td>Знакомство и вопросы о тебе: учёба/работа, дом, хобби, еда, погода. Отвечай 2–3 предложениями.</td></tr>
<tr><td class="y">Part 2 (3–4 мин)</td><td>Карточка с темой: <b>1 минута на подготовку</b> (можно делать заметки), затем говоришь <b>1–2 минуты</b> без остановки. Потом 1–2 коротких вопроса.</td></tr>
<tr><td class="y">Part 3 (4–5 мин)</td><td>Обсуждение абстрактных вопросов по теме Part 2: общество, причины, будущее, сравнения.</td></tr></tbody></table>
<p>Разговор записывается. Оценивают 4 критерия поровну: <b>Fluency & Coherence, Lexical Resource, Grammatical Range & Accuracy, Pronunciation</b>.</p>
<h3>Что нужно для 9</h3>
<ul><li><b>Fluency:</b> говоришь свободно, повторы и самоисправления редкие, паузы — только чтобы подумать над содержанием, а не над словами.</li>
<li><b>Lexical Resource:</b> идиомы и точные слова используются естественно и к месту.</li>
<li><b>Grammar:</b> полный диапазон структур, ошибки — только случайные оговорки.</li>
<li><b>Pronunciation:</b> весь набор средств (ударение, интонация, связная речь), понимать тебя легко. <b>Акцент разрешён</b> — британский или американский не нужен, нужна понятность.</li></ul>
<h3>Part 1 — пример</h3>
<p><b>Q:</b> Do you enjoy cooking?</p>
<p><b>A:</b> To be honest, I'm not much of a cook, but I do enjoy making simple things at the weekend, like pancakes or a stir-fry. It's quite relaxing after a busy week, and I'd like to learn a few more dishes from my grandmother before I go to university.</p>
<p class="small mut">Ответ + причина + деталь. Не «Yes, I do» и не монолог на 2 минуты.</p>
<h3>Part 2 — как строить рассказ</h3>
<p>Пример карточки: <i>Describe a skill you learned that you are proud of. You should say: what it is, how you learned it, how long it took, and explain why you are proud of it.</i></p>
<ol><li>За минуту подготовки запиши 4–5 ключевых слов на каждый пункт, не предложения.</li>
<li>Говори по пунктам карточки, добавляй историю и чувства.</li>
<li>Используй разные времена: past simple (I started…), past perfect (I had never…), present perfect (I've been…), условные (If I hadn't…, I would never…).</li>
<li>Если остаётся время — расскажи, как это повлияло на тебя сейчас и в будущем.</li></ol>
<div class="card"><p><b>Начало образца:</b> I'd like to talk about learning to swim properly, which I only managed to do when I was fifteen. Growing up in Pavlodar, I'd always splashed around in the Irtysh in summer, but I'd never actually learnt a proper technique, so I signed up for lessons at a local pool…</p></div>
<h3>Part 3 — как отвечать на абстрактные вопросы</h3>
<p><b>Q:</b> Why do some people find it hard to learn new skills as adults?</p>
<p><b>A:</b> I think there are a couple of reasons. The most obvious one is time — most adults are juggling work and family commitments, so practising regularly becomes a real challenge. But there's also a psychological side to it: children aren't embarrassed about making mistakes, whereas adults are often afraid of looking foolish, which can hold them back. That said, I'd argue adults have an advantage in terms of motivation, because they usually choose what they want to learn.</p>
<p class="small mut">Схема: мнение → причина → пример/развитие → другая сторона.</p>
<h3>Полезные фразы</h3>
<ul><li>Время подумать: «That's an interesting question — I've never really thought about it, but…», «Let me think…».</li>
<li>Не понял вопрос: «Sorry, could you repeat the question?» — это разрешено и балл не снижает.</li>
<li>Мнение: «I'd say…», «As far as I'm concerned…», «I'm inclined to think…».</li>
<li>Сравнение: «Compared with my parents' generation…», «whereas…».</li>
<li>Предположения о будущем: «It's likely that…», «I can imagine… will…».</li></ul>
<p><b>Не делай:</b> не учи ответы наизусть (экзаменатор меняет вопрос), не говори односложно, не используй идиомы ради идиом («it's raining cats and dogs» почти никто не говорит).</p>
<p><b>Тренировка:</b> записывай ответы на телефон, слушай и считай «эээ» и повторы. Можно присылать мне текст своего ответа — разберу по критериям.</p>`},

{id:'e7',per:'IELTS',name:'Тайм-менеджмент и день экзамена',html:`
<h3>Время на экзамене</h3>
<table><tbody>
<tr><td class="y">Listening</td><td>Перед каждой частью — читай вопросы следующей части, а не проверяй предыдущую.</td></tr>
<tr><td class="y">Reading</td><td>Текст 1 — 17 мин, текст 2 — 20 мин, текст 3 — 23 мин. На компьютере можно выделять текст (highlight).</td></tr>
<tr><td class="y">Writing</td><td>Начни с Task 2 (он важнее) или пиши по порядку, но строго 20 + 40 минут. На компьютере есть счётчик слов.</td></tr>
<tr><td class="y">Speaking</td><td>В Part 2 говори до тех пор, пока экзаменатор тебя не остановит.</td></tr></tbody></table>
<h3>Правила записи ответов</h3>
<ul><li>Большие или маленькие буквы — не важно (London = LONDON = london).</li>
<li>Числа можно писать цифрами: «twenty-five» или 25 — лучше цифрами, так меньше ошибок.</li>
<li>Дефисное слово (well-known) считается за <b>одно</b> слово; число (25) — за число, а не слово.</li>
<li>Не пиши слова, которые уже есть в предложении задания.</li>
<li>Если в задании «ONE WORD ONLY» — даже артикль «a» лишний.</li></ul>
<h3>Перед экзаменом</h3>
<ul><li>Сделай 3–4 полных пробника <b>на время</b> в формате компьютерного теста (на ielts.org / ielts.idp.com есть демо).</li>
<li>Возьми тот же документ, что указывал при регистрации (обычно паспорт).</li>
<li>Выспись: 2 ч 40 мин без перерыва — тяжело для концентрации.</li></ul>
<h3>Результаты</h3>
<p>Результаты IELTS на компьютере обычно приходят через 1–5 дней, на бумаге — примерно через 13 дней. Сертификат обычно действителен для вузов <b>2 года</b>.</p>`},

{id:'e8',per:'Грамматика',name:'Present: Simple, Continuous, Perfect',html:`
<h3>Present Simple — факты, привычки, расписания</h3>
<p>I <b>work</b>, he <b>works</b> (+ <b>-s/-es</b> для he/she/it). Вопрос: <b>Do</b> you work? <b>Does</b> she work? Отрицание: I <b>don't</b> work, she <b>doesn't</b> work (после does — без -s!).</p>
<p>Маркеры: always, usually, often, sometimes, rarely, never, every day. Расписания: The train <b>leaves</b> at 6.</p>
<h3>Present Continuous — сейчас, временно, планы</h3>
<p>am/is/are + <b>-ing</b>: She <b>is reading</b> now. I'<b>m staying</b> with my aunt this month. We'<b>re meeting</b> at 5 tomorrow (договорённость).</p>
<p>Раздражающая привычка: He <b>is always losing</b> his keys!</p>
<h3>Глаголы состояния (stative) — обычно без -ing</h3>
<p>know, believe, understand, want, need, like, love, hate, prefer, own, belong, seem, mean, contain. ✗ I am knowing → ✓ I <b>know</b>.</p>
<p>Но: think (= считать) — I <b>think</b> it's good; think (= обдумывать) — I'<b>m thinking</b> about it. Have (= владеть) — I <b>have</b> a car; have (= действие) — I'<b>m having</b> lunch.</p>
<h3>Present Perfect — результат к настоящему, опыт</h3>
<p>have/has + <b>V3</b>: I <b>have lost</b> my key (его нет сейчас). <b>Have</b> you ever <b>been</b> to London?</p>
<p>Маркеры: ever, never, already, yet, just, recently, so far, since, for, this week.</p>
<p><b>Главное правило:</b> с точным прошедшим временем (yesterday, in 2020, last week, ago, when I was…) — только <b>Past Simple</b>. ✗ I have seen him yesterday → ✓ I <b>saw</b> him yesterday.</p>
<p><b>since</b> + точка во времени (since 2020, since Monday); <b>for</b> + период (for three years).</p>
<p><b>been</b> vs <b>gone</b>: He has <b>been</b> to Paris (был и вернулся). He has <b>gone</b> to Paris (уехал и сейчас там).</p>
<h3>Present Perfect Continuous — процесс до сейчас</h3>
<p>have/has been + -ing: I'<b>ve been studying</b> for three hours (и до сих пор / только что закончил). Акцент на длительности.</p>
<p>Сравни: I'<b>ve read</b> the book (закончил — результат). I'<b>ve been reading</b> the book (процесс, может, не закончил).</p>`},

{id:'e9',per:'Грамматика',name:'Past: Simple, Continuous, Perfect, used to',html:`
<h3>Past Simple — законченное действие в прошлом</h3>
<p>Правильные глаголы: + <b>-ed</b> (worked, stopped, studied). Неправильные — вторая форма (went, saw, wrote). Вопрос: <b>Did</b> you go? Отрицание: I <b>didn't</b> go (после did — первая форма!).</p>
<h3>Past Continuous — процесс в момент прошлого</h3>
<p>was/were + -ing: At 8 pm I <b>was watching</b> TV. Фон для другого действия: I <b>was walking</b> home when it <b>started</b> to rain.</p>
<p><b>when</b> + короткое действие (Past Simple), <b>while</b> + процесс (Past Continuous): While I was cooking, the phone rang.</p>
<h3>Past Perfect — «предпрошедшее»</h3>
<p>had + V3: When I arrived, the train <b>had</b> already <b>left</b> (поезд ушёл раньше, чем я пришёл).</p>
<p>Past Perfect Continuous: She was tired because she <b>had been working</b> all day.</p>
<h3>used to / would / be used to</h3>
<table><tbody>
<tr><td class="y">used to + V</td><td>привычка или состояние в прошлом, которого больше нет: I <b>used to live</b> in Almaty. Вопрос: Did you <b>use to</b>…?</td></tr>
<tr><td class="y">would + V</td><td>повторяющееся действие в прошлом (не состояние!): Every summer we <b>would go</b> to the lake. ✗ I would live in Almaty.</td></tr>
<tr><td class="y">be used to + -ing / сущ.</td><td>привык (сейчас): I <b>am used to getting up</b> early.</td></tr>
<tr><td class="y">get used to + -ing</td><td>привыкать: You'll <b>get used to driving</b> on the left.</td></tr></tbody></table>
<h3>Неправильные глаголы — самые частые</h3>
<p>be – was/were – been; begin – began – begun; break – broke – broken; bring – brought – brought; buy – bought – bought; catch – caught – caught; choose – chose – chosen; do – did – done; drink – drank – drunk; drive – drove – driven; eat – ate – eaten; fall – fell – fallen; feel – felt – felt; find – found – found; fly – flew – flown; forget – forgot – forgotten; get – got – got; give – gave – given; go – went – gone; grow – grew – grown; know – knew – known; lead – led – led; leave – left – left; lose – lost – lost; make – made – made; meet – met – met; pay – paid – paid; rise – rose – risen; run – ran – run; say – said – said; see – saw – seen; sell – sold – sold; send – sent – sent; speak – spoke – spoken; spend – spent – spent; take – took – taken; teach – taught – taught; think – thought – thought; understand – understood – understood; write – wrote – written.</p>
<p><b>Путаница:</b> <b>rise</b> – rose – risen (подниматься сам, без дополнения): Prices rose. <b>raise</b> – raised – raised (поднимать что-то): They raised prices. <b>lie</b> – lay – lain (лежать), <b>lay</b> – laid – laid (класть).</p>`},

{id:'e10',per:'Грамматика',name:'Future: will, going to, Future Perfect',html:`
<h3>Способы говорить о будущем</h3>
<table><tbody>
<tr><td class="y">will + V</td><td>Решение в момент речи (I'<b>ll get</b> it!), обещание, предсказание по мнению (I think it <b>will</b> rain).</td></tr>
<tr><td class="y">be going to + V</td><td>План, решённый заранее (I'<b>m going to study</b> medicine); предсказание по явным признакам (Look at the clouds — it'<b>s going to</b> rain).</td></tr>
<tr><td class="y">Present Continuous</td><td>Договорённость с временем и местом: I'<b>m meeting</b> Dana at 6.</td></tr>
<tr><td class="y">Present Simple</td><td>Расписание: The exam <b>starts</b> at 9 am.</td></tr>
<tr><td class="y">Future Continuous</td><td>Процесс в момент будущего: This time tomorrow I'<b>ll be flying</b> to London.</td></tr>
<tr><td class="y">Future Perfect</td><td>Будет завершено к моменту: By 2030 I <b>will have graduated</b>. Маркер — <b>by</b> (к).</td></tr>
<tr><td class="y">Future Perfect Continuous</td><td>Длительность к моменту: By June I'<b>ll have been studying</b> English for five years.</td></tr></tbody></table>
<h3>Главное правило: после when, if, as soon as, until, before, after — Present, а не will</h3>
<p>✗ When I will finish, I'll call you. → ✓ When I <b>finish</b>, I'll call you.</p>
<p>✓ I'll wait <b>until</b> you <b>come</b>. ✓ <b>As soon as</b> the results <b>arrive</b>, I'll tell you.</p>
<p>Если важно завершение — Present Perfect: I'll go out when I <b>have finished</b> my homework.</p>
<p>Исключение: <b>if</b> в значении «ли» (косвенный вопрос) — will можно: I don't know <b>if</b> he <b>will come</b>.</p>
<h3>Другие формы</h3>
<ul><li><b>be about to</b> — вот-вот: The film <b>is about to</b> start.</li>
<li><b>be due to</b> — по плану: The report <b>is due to</b> be published in May.</li>
<li><b>be likely to</b> — вероятно (полезно в Writing): Prices <b>are likely to</b> rise further.</li></ul>`},

{id:'e11',per:'Грамматика',name:'Условные предложения и wish',html:`
<h3>Четыре типа</h3>
<table><thead><tr><th>Тип</th><th>If-часть</th><th>Главная часть</th><th>Смысл</th></tr></thead><tbody>
<tr><td><b>Zero</b></td><td>Present</td><td>Present</td><td>Всегда так: If you heat ice, it <b>melts</b>.</td></tr>
<tr><td><b>First</b></td><td>Present</td><td>will + V</td><td>Реальное будущее: If it <b>rains</b>, we <b>will stay</b> home.</td></tr>
<tr><td><b>Second</b></td><td>Past</td><td>would + V</td><td>Нереальное сейчас: If I <b>had</b> more time, I <b>would travel</b>.</td></tr>
<tr><td><b>Third</b></td><td>Past Perfect</td><td>would have + V3</td><td>Нереальное прошлое: If I <b>had studied</b>, I <b>would have passed</b>.</td></tr></tbody></table>
<p>Во втором типе с be — <b>were</b> для всех лиц (формально): If I <b>were</b> you, I would apply. </p>
<h3>Смешанный тип (mixed)</h3>
<ul><li>Прошлое → настоящее: If I <b>had taken</b> the job, I <b>would be</b> rich now.</li>
<li>Настоящее → прошлое: If I <b>were</b> more organised, I <b>wouldn't have missed</b> the deadline.</li></ul>
<h3>unless, provided, as long as, otherwise</h3>
<p><b>unless</b> = if not: You won't pass <b>unless</b> you practise (✗ unless you don't practise). <b>provided (that) / as long as</b> = при условии, что. <b>in case</b> = на случай если: Take an umbrella <b>in case</b> it rains.</p>
<h3>Инверсия (для высокого балла в Writing)</h3>
<ul><li><b>Should</b> you need help, call me. (= If you need…)</li>
<li><b>Were</b> the government to invest more, results would improve. (= If the government invested…)</li>
<li><b>Had</b> I known, I would have helped. (= If I had known…)</li></ul>
<h3>wish / if only</h3>
<table><tbody>
<tr><td class="y">wish + Past</td><td>сожаление о настоящем: I <b>wish</b> I <b>knew</b> the answer (жаль, что не знаю).</td></tr>
<tr><td class="y">wish + Past Perfect</td><td>сожаление о прошлом: I <b>wish</b> I <b>had studied</b> harder (жаль, что не учил).</td></tr>
<tr><td class="y">wish + would</td><td>недовольство чужим поведением: I <b>wish</b> you <b>would</b> stop talking.</td></tr></tbody></table>
<p>Также: It's (high) time we <b>left</b> (пора уходить — Past Simple). I'd rather you <b>didn't</b> tell anyone.</p>`},

{id:'e12',per:'Грамматика',name:'Passive voice и causative',html:`
<h3>Как строится пассив</h3>
<p><b>be (в нужном времени) + V3</b>. Кто делает — через <b>by</b> (если важно).</p>
<table><tbody>
<tr><td class="y">Present Simple</td><td>English <b>is spoken</b> here.</td></tr>
<tr><td class="y">Present Continuous</td><td>The road <b>is being repaired</b>.</td></tr>
<tr><td class="y">Past Simple</td><td>The bridge <b>was built</b> in 1890.</td></tr>
<tr><td class="y">Past Continuous</td><td>The car <b>was being washed</b>.</td></tr>
<tr><td class="y">Present Perfect</td><td>The results <b>have been published</b>.</td></tr>
<tr><td class="y">Past Perfect</td><td>The work <b>had been finished</b>.</td></tr>
<tr><td class="y">Future</td><td>The winner <b>will be announced</b> tomorrow.</td></tr>
<tr><td class="y">Модальные</td><td>The problem <b>must be solved</b>. It <b>should have been done</b> earlier.</td></tr></tbody></table>
<h3>Когда пассив нужен в IELTS</h3>
<ul><li><b>Процесс</b> (Writing Task 1): The grain <b>is harvested</b>, then it <b>is transported</b> to a mill.</li>
<li><b>Безличный академический стиль:</b> <b>It is widely believed that</b>… / <b>It has been suggested that</b>…</li>
<li>Личный вариант: The economy <b>is expected to grow</b>. He <b>is said to be</b> the best.</li></ul>
<h3>Causative: have / get something done</h3>
<p>Действие делает кто-то другой для тебя: I <b>had my hair cut</b> (меня подстригли). We'<b>re getting</b> the roof <b>repaired</b>. Неприятность: She <b>had her phone stolen</b>.</p>
<p>Сравни: <b>have someone do</b> (поручить): I <b>had</b> the mechanic <b>check</b> the brakes. <b>get someone to do</b>: I <b>got</b> my brother <b>to help</b> me.</p>
<h3>Нельзя в пассив</h3>
<p>Непереходные глаголы (без дополнения): happen, occur, arrive, die, rise, appear. ✗ The accident was happened → ✓ The accident <b>happened</b>.</p>`},

{id:'e13',per:'Грамматика',name:'Косвенная речь (reported speech)',html:`
<h3>Сдвиг времён (если вводный глагол в прошедшем)</h3>
<table><tbody>
<tr><td class="y">Present Simple → Past Simple</td><td>"I <b>like</b> it." → She said she <b>liked</b> it.</td></tr>
<tr><td class="y">Present Continuous → Past Continuous</td><td>"I'<b>m working</b>." → He said he <b>was working</b>.</td></tr>
<tr><td class="y">Past Simple / Present Perfect → Past Perfect</td><td>"I <b>saw</b> it / I'<b>ve seen</b> it." → She said she <b>had seen</b> it.</td></tr>
<tr><td class="y">will → would</td><td>"I'<b>ll call</b>." → He said he <b>would call</b>.</td></tr>
<tr><td class="y">can → could, may → might, must → had to</td><td>"I <b>can</b> swim." → She said she <b>could</b> swim.</td></tr></tbody></table>
<p>Не меняются: would, could, should, might, ought to. Если факт всё ещё правда, сдвиг необязателен: He said the Earth <b>is</b> round.</p>
<h3>Слова времени и места</h3>
<p>now → then; today → that day; tomorrow → the next day / the following day; yesterday → the day before / the previous day; ago → before; here → there; this → that.</p>
<h3>Вопросы — прямой порядок слов, без do/did</h3>
<p>"Where <b>do you live</b>?" → She asked me where <b>I lived</b>. ✗ where did I live.</p>
<p>"<b>Are</b> you ready?" → He asked <b>if / whether</b> I <b>was</b> ready.</p>
<h3>Просьбы и приказы — to + V</h3>
<p>"Close the door." → She <b>told me to close</b> the door. "Don't be late." → He <b>told us not to be</b> late.</p>
<h3>say или tell</h3>
<p><b>say</b> (something) / <b>say to</b> someone; <b>tell</b> someone (дополнение обязательно!). ✓ She <b>told me</b> that… ✓ She <b>said</b> that… ✗ She said me…</p>
<p>Другие глаголы: suggest + -ing / that (✗ suggest me to…), advise someone to, warn someone not to, deny + -ing, admit + -ing, promise to, refuse to, apologise for + -ing.</p>`},

{id:'e14',per:'Грамматика',name:'Модальные глаголы',html:`
<h3>Обязанность и отсутствие обязанности</h3>
<table><tbody>
<tr><td class="y">must</td><td>обязанность по мнению говорящего / правило: I <b>must</b> call my mum.</td></tr>
<tr><td class="y">have to</td><td>внешняя необходимость: I <b>have to</b> wear a uniform at school.</td></tr>
<tr><td class="y">mustn't</td><td><b>запрещено</b>: You <b>mustn't</b> smoke here.</td></tr>
<tr><td class="y">don't have to / needn't</td><td><b>не обязательно</b>: You <b>don't have to</b> come (можешь, если хочешь).</td></tr>
<tr><td class="y">should / ought to</td><td>совет: You <b>should</b> revise every day.</td></tr></tbody></table>
<h3>Возможность и способность</h3>
<p><b>can</b> (могу сейчас), <b>could</b> (мог в прошлом вообще), <b>was able to / managed to</b> (смог в конкретной ситуации): Despite the storm, we <b>were able to</b> land. Будущее: <b>will be able to</b>.</p>
<h3>Степень уверенности (deduction)</h3>
<table><tbody>
<tr><td class="y">must</td><td>наверняка (90%): She <b>must</b> be tired — she worked all night.</td></tr>
<tr><td class="y">may / might / could</td><td>возможно (50%): It <b>might</b> rain.</td></tr>
<tr><td class="y">can't</td><td>не может быть: That <b>can't</b> be true. (✗ mustn't be)</td></tr></tbody></table>
<h3>Модальный + have + V3 — о прошлом</h3>
<ul><li><b>must have done</b> — наверняка сделал: He <b>must have forgotten</b>.</li>
<li><b>can't / couldn't have done</b> — не мог сделать: She <b>can't have seen</b> us.</li>
<li><b>might / may / could have done</b> — возможно, сделал.</li>
<li><b>should have done</b> — следовало (но не сделал): You <b>should have told</b> me.</li>
<li><b>needn't have done</b> — сделал, но было не нужно: You <b>needn't have bought</b> milk — we had some.</li>
<li><b>didn't need to do</b> — не нужно было (и, скорее всего, не делал).</li></ul>
<h3>Осторожные формулировки (hedging) для Writing</h3>
<p>It <b>could be argued that</b>… / This <b>may</b> lead to… / Such policies <b>might</b> help to… — экзаменаторы ценят, когда утверждения не слишком категоричны.</p>`},

{id:'e15',per:'Грамматика',name:'Артикли и исчисляемые существительные',html:`
<h3>a / an</h3>
<p>Один из многих, впервые упомянутый, исчисляемый в единственном числе: I saw <b>a</b> film. Профессия: She is <b>an</b> engineer.</p>
<p><b>an</b> — перед гласным <b>звуком</b>: <b>an</b> hour, <b>an</b> honest man, <b>an</b> MBA; но <b>a</b> university, <b>a</b> European, <b>a</b> one-way ticket (звук [j] / [w]).</p>
<h3>the</h3>
<ul><li>Уже известное или единственное: <b>the</b> film I told you about, <b>the</b> sun, <b>the</b> internet.</li>
<li>Превосходная степень и порядковые: <b>the</b> best, <b>the</b> first.</li>
<li>Реки, моря, океаны, горные цепи, группы островов: <b>the</b> Irtysh, <b>the</b> Caspian Sea, <b>the</b> Alps.</li>
<li>Страны с Republic/Kingdom/States и во множественном числе: <b>the</b> UK, <b>the</b> USA, <b>the</b> Netherlands.</li>
<li>Музыкальные инструменты: play <b>the</b> piano. Национальность целиком: <b>the</b> Japanese, <b>the</b> rich, <b>the</b> elderly.</li>
<li>С графиками в Task 1: <b>the</b> number of…, <b>the</b> proportion of…</li></ul>
<h3>Без артикля</h3>
<ul><li>Общее значение: <b>Children</b> need love. <b>Education</b> is important. (✗ The education is important — если в общем.)</li>
<li>Большинство стран, городов, континентов, одиночных гор и озёр: Kazakhstan, Astana, Asia, Everest, Lake Balkhash.</li>
<li>Языки, спорт, приёмы пищи: speak English, play football, have breakfast.</li>
<li>go to school / university / bed / hospital / prison — в основном назначении (учиться, лечиться).</li></ul>
<h3>Неисчисляемые — нет a/an и множественного числа</h3>
<p><b>information, advice, news, research, equipment, furniture, luggage, knowledge, homework, progress, evidence, traffic, accommodation, work</b> (работа как деятельность).</p>
<p>✗ an advice, informations → ✓ <b>a piece of advice</b>, <b>some information</b>. News — глагол в единственном числе: The news <b>is</b> good.</p>
<h3>much / many / few / little</h3>
<table><tbody>
<tr><td class="y">исчисляемые</td><td>many, (a) few, a number of, fewer</td></tr>
<tr><td class="y">неисчисляемые</td><td>much, (a) little, an amount of, less</td></tr>
<tr><td class="y">оба</td><td>a lot of, lots of, some, any, plenty of, most</td></tr></tbody></table>
<p><b>a few / a little</b> — немного (достаточно); <b>few / little</b> — мало (почти нет): I have <b>few</b> friends (грустно). В Task 1: <b>fewer</b> people (✗ less people), <b>the number of</b> cars (✗ the amount of cars).</p>`},

{id:'e16',per:'Грамматика',name:'Относительные придаточные (who, which, that)',html:`
<h3>Местоимения</h3>
<table><tbody>
<tr><td class="y">who</td><td>о людях: The woman <b>who</b> lives next door…</td></tr>
<tr><td class="y">which</td><td>о предметах: The book <b>which</b> I bought…</td></tr>
<tr><td class="y">that</td><td>о людях и предметах — только в ограничивающих придаточных</td></tr>
<tr><td class="y">whose</td><td>чей: The student <b>whose</b> essay won…</td></tr>
<tr><td class="y">where / when</td><td>место / время: the city <b>where</b> I was born; the year <b>when</b> we met</td></tr>
<tr><td class="y">whom</td><td>формально, после предлога: the person <b>to whom</b> I spoke</td></tr></tbody></table>
<h3>Ограничивающие и неограничивающие</h3>
<p><b>Defining</b> (без запятых) — нужно, чтобы понять, о ком речь: Students <b>who</b> study regularly pass easily.</p>
<p><b>Non-defining</b> (с запятыми) — дополнительная информация: My brother, <b>who</b> lives in Almaty, is a doctor. <b>Здесь нельзя that.</b></p>
<p><b>which</b> о целом предложении: He passed the exam, <b>which</b> surprised everyone.</p>
<h3>Когда местоимение можно опустить</h3>
<p>Только если это <b>дополнение</b> в ограничивающем придаточном: The film (that) I watched was great. Если подлежащее — нельзя: The man <b>who</b> called you… (✗ The man called you…)</p>
<h3>Предлоги</h3>
<p>Разговорно: the house (that) I grew up <b>in</b>. Формально (для Writing): the house <b>in which</b> I grew up. После предлога — только <b>which / whom</b>, не that.</p>
<h3>Сокращённые придаточные (для высокого балла)</h3>
<p>The man <b>standing</b> by the door… (= who is standing). Goods <b>made</b> in China… (= which are made). Полезно в Task 1: the amount of energy <b>consumed</b> by households.</p>`},

{id:'e17',per:'Грамматика',name:'Герундий и инфинитив',html:`
<h3>После этих глаголов — -ing</h3>
<p>enjoy, avoid, finish, mind, suggest, consider, deny, admit, risk, keep, miss, imagine, practise, postpone, delay, can't help, can't stand, give up, look forward to, be worth, it's no use.</p>
<p>I <b>enjoy reading</b>. He <b>suggested going</b> by train. I'm <b>looking forward to meeting</b> you (to — предлог!).</p>
<h3>После этих глаголов — to + V</h3>
<p>want, decide, hope, plan, agree, refuse, promise, offer, manage, afford, learn, seem, expect, aim, intend, attempt, fail, threaten, would like.</p>
<p>She <b>decided to apply</b>. We can't <b>afford to buy</b> it.</p>
<h3>После предлогов — всегда -ing</h3>
<p>interested <b>in learning</b>, good <b>at drawing</b>, <b>instead of waiting</b>, <b>before leaving</b>, <b>without saying</b>, <b>by working</b> hard.</p>
<p>Ловушка: <b>to</b> бывает предлогом: look forward <b>to</b>, be used <b>to</b>, object <b>to</b>, be committed <b>to</b>, when it comes <b>to</b> + -ing.</p>
<h3>Без to (bare infinitive)</h3>
<p>После модальных (can go), <b>make / let</b> someone do (They <b>made</b> me <b>wait</b>; ✗ made me to wait), had better, would rather. Но в пассиве: I <b>was made to wait</b>.</p>
<h3>Глаголы, у которых меняется смысл</h3>
<table><tbody>
<tr><td class="y">remember</td><td>remember <b>doing</b> — помнить, что сделал; remember <b>to do</b> — не забыть сделать</td></tr>
<tr><td class="y">forget</td><td>forget <b>doing</b> — забыть, что делал; forget <b>to do</b> — забыть сделать</td></tr>
<tr><td class="y">stop</td><td>stop <b>smoking</b> — бросить курить; stop <b>to smoke</b> — остановиться, чтобы покурить</td></tr>
<tr><td class="y">try</td><td>try <b>doing</b> — попробовать (как эксперимент); try <b>to do</b> — стараться</td></tr>
<tr><td class="y">regret</td><td>regret <b>doing</b> — жалеть о сделанном; regret <b>to inform</b> — с сожалением сообщить</td></tr>
<tr><td class="y">go on</td><td>go on <b>doing</b> — продолжать то же; go on <b>to do</b> — перейти к следующему</td></tr></tbody></table>
<p>Без разницы в смысле: begin, start, continue, like, love, hate, prefer (I like swimming / to swim).</p>`},

{id:'e18',per:'Грамматика',name:'Сравнения и порядок слов',html:`
<h3>Степени сравнения</h3>
<ul><li>Короткие: tall – <b>taller</b> – the <b>tallest</b>; big – bigger (удвоение); happy – happier (y → i).</li>
<li>Длинные: important – <b>more</b> important – the <b>most</b> important.</li>
<li>Неправильные: good – better – best; bad – worse – worst; far – further/farther – furthest; little – less – least; many/much – more – most.</li></ul>
<h3>Конструкции для Writing Task 1</h3>
<ul><li><b>much / far / significantly / slightly</b> + сравнительная: <b>far higher</b>, <b>slightly lower</b> (✗ very higher).</li>
<li><b>twice as … as</b>, <b>three times as many … as</b>: Men spent <b>twice as much</b> time <b>as</b> women.</li>
<li><b>not as … as</b>: Bus travel was <b>not as popular as</b> rail.</li>
<li><b>the + сравн., the + сравн.</b>: <b>The more</b> you read, <b>the better</b> your vocabulary becomes.</li>
<li><b>by far the</b> + превосх.: Coal was <b>by far the largest</b> source.</li></ul>
<h3>Порядок слов</h3>
<ul><li>Наречия частоты — <b>перед</b> смысловым глаголом, но <b>после</b> be: I <b>often</b> read; She <b>is always</b> late.</li>
<li>Порядок прилагательных: мнение → размер → возраст → форма → цвет → происхождение → материал → назначение: a <b>beautiful old Italian</b> car.</li>
<li>Косвенные вопросы — прямой порядок: Could you tell me where <b>the station is</b>? (✗ where is the station)</li>
<li><b>enough</b> — после прилагательного, но перед существительным: old <b>enough</b>; <b>enough</b> money.</li></ul>
<h3>Инверсия для акцента (band 8–9)</h3>
<p><b>Not only did</b> prices rise, <b>but</b> wages also fell. <b>Rarely have</b> we seen such growth. <b>Never before has</b> technology changed so fast. <b>Only by</b> investing in education <b>can</b> we… <b>Hardly had</b> I arrived <b>when</b> it began to rain.</p>
<h3>Cleft-предложения (акцент)</h3>
<p><b>It is</b> education <b>that</b> shapes a country's future. <b>What</b> worries me most <b>is</b> the cost.</p>`},

{id:'e19',per:'Лексика',name:'Предлоги и фразовые глаголы',html:`
<h3>Предлоги времени</h3>
<p><b>at</b> + точное время, праздники, at night, at the weekend (брит.); <b>on</b> + дни и даты (on Monday, on 15 May, on my birthday); <b>in</b> + месяцы, годы, века, времена года, части дня (in July, in 2026, in the morning). <b>by</b> = не позднее; <b>until</b> = до (продолжается); <b>during</b> + существительное, <b>while</b> + предложение.</p>
<h3>Прилагательное + предлог</h3>
<p>interested <b>in</b>, good <b>at</b>, afraid <b>of</b>, aware <b>of</b>, capable <b>of</b>, responsible <b>for</b>, famous <b>for</b>, similar <b>to</b>, different <b>from</b>, dependent <b>on</b>, keen <b>on</b>, proud <b>of</b>, worried <b>about</b>, married <b>to</b>.</p>
<h3>Глагол / существительное + предлог</h3>
<p>depend <b>on</b>, rely <b>on</b>, focus <b>on</b>, concentrate <b>on</b>, insist <b>on</b>, consist <b>of</b>, belong <b>to</b>, apply <b>for</b> (a job) / <b>to</b> (a university), cope <b>with</b>, deal <b>with</b>, result <b>in</b> (приводить к), result <b>from</b> (происходить от), contribute <b>to</b>, invest <b>in</b>, succeed <b>in</b>; increase <b>in</b> sales, demand <b>for</b>, impact <b>on</b> / effect <b>on</b>, reason <b>for</b>, solution <b>to</b>, access <b>to</b>.</p>
<p>Без предлога: discuss <b>something</b> (✗ discuss about), enter a room (✗ enter into), reach a goal, emphasise a point.</p>
<h3>Фразовые глаголы (полезны для Speaking)</h3>
<table><tbody>
<tr><td class="y">bring up</td><td>воспитывать; поднимать тему</td></tr>
<tr><td class="y">carry out</td><td>проводить (исследование, опыт)</td></tr>
<tr><td class="y">come up with</td><td>придумать (идею, решение)</td></tr>
<tr><td class="y">cut down on</td><td>сократить потребление</td></tr>
<tr><td class="y">figure out</td><td>понять, разобраться</td></tr>
<tr><td class="y">get on with</td><td>ладить с кем-то</td></tr>
<tr><td class="y">give up</td><td>бросить, сдаться</td></tr>
<tr><td class="y">look into</td><td>изучать, расследовать</td></tr>
<tr><td class="y">look up to</td><td>уважать, равняться на</td></tr>
<tr><td class="y">put off</td><td>откладывать</td></tr>
<tr><td class="y">run out of</td><td>закончиться (о запасе)</td></tr>
<tr><td class="y">set up</td><td>основать, организовать</td></tr>
<tr><td class="y">take up</td><td>начать заниматься (хобби); занимать (место, время)</td></tr>
<tr><td class="y">turn down</td><td>отклонить (предложение)</td></tr>
<tr><td class="y">phase out</td><td>постепенно отказаться</td></tr></tbody></table>
<p>В <b>Writing</b> лучше однословные синонимы: put off → postpone, find out → discover, cut down → reduce.</p>`},

{id:'e20',per:'Лексика',name:'Связки (linking words) и связность',html:`
<h3>Связки по смыслу</h3>
<table><tbody>
<tr><td class="y">Добавление</td><td>In addition, Moreover, Furthermore, Besides, not only… but also, as well as</td></tr>
<tr><td class="y">Противопоставление</td><td>However, Nevertheless, Nonetheless, On the other hand, whereas, while, although, even though, despite / in spite of + сущ. / -ing</td></tr>
<tr><td class="y">Причина</td><td>because, since, as, due to / owing to + сущ., because of + сущ.</td></tr>
<tr><td class="y">Следствие</td><td>Therefore, Consequently, As a result, Thus, Hence, so, which means that</td></tr>
<tr><td class="y">Пример</td><td>For example, For instance, such as, a case in point is, notably</td></tr>
<tr><td class="y">Уступка</td><td>Admittedly, Granted, It is true that… but</td></tr>
<tr><td class="y">Вывод</td><td>In conclusion, To sum up, Overall, On balance</td></tr></tbody></table>
<h3>Грамматика связок — частые ошибки</h3>
<ul><li><b>despite / in spite of</b> + существительное или -ing: <b>Despite</b> the rain / <b>Despite</b> being tired. С предложением — <b>despite the fact that</b>. ✗ Despite it was raining.</li>
<li><b>although / even though</b> + предложение: <b>Although</b> it was raining, we went out.</li>
<li><b>However</b> — обычно в начале предложения с запятой, а не как «хотя» внутри: ✗ I like it, however it's expensive. → ✓ I like it. <b>However,</b> it's expensive.</li>
<li><b>because of / due to</b> + существительное: <b>due to</b> the high cost. <b>because</b> + предложение.</li>
<li><b>On the contrary</b> ≠ On the other hand. On the contrary = «наоборот» (опровергает сказанное). On the other hand = «с другой стороны».</li></ul>
<h3>Связность без связок (это и есть 9 по Coherence)</h3>
<ul><li><b>Местоимения и отсылки:</b> this, these, such, the former / the latter: «…rising rents. <b>This trend</b>…».</li>
<li><b>Синонимы</b> вместо повторов: students → learners → young people → undergraduates.</li>
<li><b>Замещение:</b> «Some people prefer cities; <b>others</b> choose the countryside.»</li>
<li><b>Topic sentence</b> в начале каждого абзаца.</li></ul>
<p>Правило: на 9 баллов связность «не привлекает внимания» — не начинай каждое предложение со связки.</p>`},

{id:'e21',per:'Лексика',name:'Академическая лексика и collocations',html:`
<h3>Что такое collocations</h3>
<p>Слова, которые естественно сочетаются. Экзаменаторы проверяют именно это в Lexical Resource. ✗ do a mistake → ✓ <b>make a mistake</b>.</p>
<h3>make / do / take / have</h3>
<table><tbody>
<tr><td class="y">make</td><td>a mistake, a decision, progress, an effort, money, a difference, a contribution, an impact, a profit</td></tr>
<tr><td class="y">do</td><td>homework, research, business, damage, harm, your best, a favour, exercise</td></tr>
<tr><td class="y">take</td><td>a risk, action, measures, steps, responsibility, part in, advantage of, place, into account</td></tr>
<tr><td class="y">have</td><td>an effect on, an impact on, an influence on, access to, a right to</td></tr></tbody></table>
<h3>Сильные сочетания для Writing</h3>
<p>a <b>growing</b> concern; a <b>pressing</b> issue; <b>play a crucial role</b> in; <b>pose</b> a threat to; <b>raise</b> awareness; <b>meet</b> demand / needs; <b>reach</b> a consensus; <b>address</b> a problem; <b>tackle</b> unemployment; <b>widen</b> the gap; <b>bridge</b> the gap; <b>a heavy</b> burden; <b>heavy</b> traffic; <b>strong</b> evidence; <b>conduct</b> research; <b>a key</b> factor; <b>severe</b> consequences; <b>sustainable</b> development; <b>long-term</b> benefits; <b>allocate</b> resources; <b>impose</b> a tax; <b>enforce</b> laws.</p>
<h3>Словарь по частым темам IELTS</h3>
<ul><li><b>Education:</b> curriculum, tuition fees, rote learning, critical thinking, vocational training, lifelong learning, academic performance.</li>
<li><b>Environment:</b> carbon emissions, renewable energy, deforestation, biodiversity, fossil fuels, landfill, global warming, carbon footprint.</li>
<li><b>Technology:</b> artificial intelligence, automation, digital literacy, screen time, privacy concerns, cutting-edge.</li>
<li><b>Health:</b> sedentary lifestyle, obesity, life expectancy, preventive medicine, mental well-being, balanced diet.</li>
<li><b>Work:</b> job satisfaction, work-life balance, remote working, unemployment rate, labour market, career prospects.</li>
<li><b>Society:</b> urbanisation, ageing population, cost of living, social inequality, cultural diversity, globalisation.</li>
<li><b>Crime:</b> deterrent, rehabilitation, law enforcement, juvenile offenders, re-offend.</li></ul>
<h3>Нейтральное → академичное</h3>
<p>get → obtain / acquire; show → demonstrate / illustrate; big → substantial / considerable; a lot of → a significant number of; help → assist / facilitate; think → consider / argue; bad → detrimental / harmful; important → crucial / vital / essential; problem → issue / challenge; start → commence / launch; end → terminate / conclude.</p>
<p>Весь словарь — в разделе «Словарь» с карточками.</p>`},

{id:'e22',per:'Лексика',name:'Частые ошибки, орфография, пунктуация',html:`
<h3>Путаница слов</h3>
<table><tbody>
<tr><td class="y">affect / effect</td><td><b>affect</b> — глагол (влиять), <b>effect</b> — существительное (эффект): Stress <b>affects</b> sleep. It has an <b>effect</b> on sleep.</td></tr>
<tr><td class="y">economic / economical</td><td><b>economic</b> — экономический (economic growth); <b>economical</b> — экономный (an economical car)</td></tr>
<tr><td class="y">historic / historical</td><td><b>historic</b> — исторически важный (a historic moment); <b>historical</b> — относящийся к истории (historical records)</td></tr>
<tr><td class="y">fun / funny</td><td><b>fun</b> — весёлый, приятный; <b>funny</b> — смешной</td></tr>
<tr><td class="y">lose / loose</td><td><b>lose</b> — терять; <b>loose</b> — свободный, болтающийся</td></tr>
<tr><td class="y">its / it's</td><td><b>its</b> — его (принадлежность); <b>it's</b> = it is / it has</td></tr>
<tr><td class="y">their / there / they're</td><td>их / там / они (they are)</td></tr>
<tr><td class="y">than / then</td><td>чем (сравнение) / потом</td></tr>
<tr><td class="y">advice / advise</td><td>совет (сущ.) / советовать (гл.)</td></tr>
<tr><td class="y">principal / principle</td><td>главный, директор / принцип</td></tr>
<tr><td class="y">rise / raise</td><td>подниматься (сам) / поднимать (что-то)</td></tr></tbody></table>
<h3>Типичные ошибки русскоязычных</h3>
<ul><li>✗ people <b>is</b> → ✓ people <b>are</b>; ✗ the police <b>is</b> → ✓ the police <b>are</b>.</li>
<li>✗ He go → ✓ He <b>goes</b> (третье лицо!).</li>
<li>✗ I agree with this opinion → лучше I agree with this <b>view</b>; ✗ I am agree → ✓ I <b>agree</b>.</li>
<li>✗ explain me → ✓ explain <b>to me</b>; ✗ discuss about → ✓ discuss.</li>
<li>✗ In my opinion, I think… → двойное мнение: выбери одно.</li>
<li>✗ more better → ✓ better; ✗ the most biggest → ✓ the biggest.</li>
<li>✗ a big amount of people → ✓ a large <b>number</b> of people.</li>
<li>✗ It depends of → ✓ It depends <b>on</b>.</li>
<li>✗ Every people → ✓ <b>Everyone</b> / Every <b>person</b>.</li></ul>
<h3>Орфография — слова, в которых часто ошибаются</h3>
<p>accommodation, necessary, government, environment, separate, definitely, beginning, receive, believe, occurred, recommend, embarrass, Wednesday, February, library, business, committee, address, achievement, argument, opportunity, technology, university.</p>
<p>Британский / американский: colour/color, centre/center, organise/organize, travelled/traveled, programme/program. <b>Выбери один вариант и не смешивай.</b></p>
<h3>Пунктуация</h3>
<ul><li>Запятая после вводного слова: <b>However,</b> … / <b>In addition,</b> …</li>
<li>Запятая перед <b>which</b> в неограничивающем придаточном; перед <b>that</b> — никогда.</li>
<li>Comma splice: ✗ It was late, I went home. → ✓ It was late, <b>so</b> I went home. / It was late<b>;</b> I went home.</li>
<li>Не используй сокращения в академическом Writing: don't → do not.</li></ul>`}
];
