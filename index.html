 $2^4=16$.\n$-3+2=-1$."}, {"t": "s", "topic": "m1", "q": "Упростите $a^{\\frac{1}{2}}\\cdot a^{\\frac{1}{3}}$.", "code": null, "opts": ["$a^{\\frac{5}{6}}$", "$a^{\\frac{1}{6}}$", "$a^{\\frac{1}{5}}$", "$a^{\\frac{2}{5}}$"], "expl": "$\\frac{1}{2}+\\frac{1}{3}=\\frac{5}{6}$.", "sol": "При умножении степеней показатели складываются: $\\frac{1}{2}+\\frac{1}{3}=\\frac{3}{6}+\\frac{2}{6}=\\frac{5}{6}$.\nОтвет: $a^{\\frac{5}{6}}$."}, {"t": "s", "topic": "m1", "q": "Вычислите $(\\sqrt{7}-\\sqrt{2})(\\sqrt{7}+\\sqrt{2})$.", "code": null, "opts": ["5", "9", "$\\sqrt{5}$", "3"], "expl": "$7-2=5$.", "sol": "Это разность квадратов: $(a-b)(a+b)=a^2-b^2$.\n$(\\sqrt{7})^2-(\\sqrt{2})^2=7-2=5$."}, {"t": "s", "topic": "m1", "q": "Вычислите $5^{-2}\\cdot 25^2$.", "code": null, "opts": ["25", "1", "5", "625"], "expl": "$\\frac{625}{25}=25$.", "sol": "$25=5^2$, поэтому $25^2=5^4$.\n$5^{-2}\\cdot 5^4=5^{2}=25$."}, {"t": "s", "topic": "m1", "q": "Найдите значение $3^{\\log_3 7}$.", "code": null, "opts": ["7", "3", "21", "$\\lg 7$"], "expl": "$a^{\\log_a b}=b$.", "sol": "Основное логарифмическое тождество: $a^{\\log_a b}=b$.\n$3^{\\log_3 7}=7$ — по определению: $\\log_3 7$ — это степень, в которую надо возвести 3, чтобы получить 7."}, {"t": "s", "topic": "m1", "q": "Сравните $\\sqrt{10}$ и $3{,}2$.", "code": null, "opts": ["$\\sqrt{10}\\lt 3{,}2$", "$\\sqrt{10}\\gt 3{,}2$", "$\\sqrt{10}=3{,}2$", "сравнить нельзя"], "expl": "$3{,}2^2=10{,}24\\gt 10$.", "sol": "Сравним квадраты положительных чисел: $(\\sqrt{10})^2=10$, $3{,}2^2=10{,}24$.\n$10\\lt 10{,}24$, значит $\\sqrt{10}\\lt 3{,}2$."}, {"t": "s", "topic": "m2", "q": "$\\sin\\alpha=\\frac{3}{5}$, $\\alpha$ — угол I четверти. Найдите $\\cos\\alpha$.", "code": null, "opts": ["$\\frac{4}{5}$", "$\\frac{3}{4}$", "$\\frac{2}{5}$", "$\\frac{5}{4}$"], "expl": "$\\cos\\alpha=\\sqrt{1-\\frac{9}{25}}=\\frac{4}{5}$.", "sol": "Основное тождество: $\\sin^2\\alpha+\\cos^2\\alpha=1$.\n$\\cos^2\\alpha=1-\\frac{9}{25}=\\frac{16}{25}$, $\\cos\\alpha=\\pm\\frac{4}{5}$.\nВ I четверти косинус положителен: $\\cos\\alpha=\\frac{4}{5}$."}, {"t": "s", "topic": "m2", "q": "$\\cos\\alpha=\\frac{5}{13}$, $\\alpha$ в IV четверти. Найдите $\\tg\\alpha$.", "code": null, "opts": ["$-\\frac{12}{5}$", "$\\frac{12}{5}$", "$-\\frac{5}{12}$", "$\\frac{12}{13}$"], "expl": "$\\sin\\alpha=-\\frac{12}{13}$; $\\tg\\alpha=-\\frac{12}{5}$.", "sol": "$\\sin^2\\alpha=1-\\frac{25}{169}=\\frac{144}{169}$, $\\sin\\alpha=\\pm\\frac{12}{13}$.\nВ IV четверти синус отрицателен: $\\sin\\alpha=-\\frac{12}{13}$.\n$\\tg\\alpha=\\frac{\\sin\\alpha}{\\cos\\alpha}=\\frac{-12}{13}:\\frac{5}{13}=-\\frac{12}{5}$."}, {"t": "s", "topic": "m2", "q": "Вычислите $\\sin 15^{\\circ}\\cdot\\cos 15^{\\circ}$.", "code": null, "opts": ["$\\frac{1}{4}$", "$\\frac{1}{2}$", "$\\frac{\\sqrt{3}}{4}$", "$\\frac{\\sqrt{2}}{4}$"], "expl": "$\\frac{1}{2}\\sin 30^{\\circ}=\\frac{1}{4}$.", "sol": "Формула двойного угла: $\\sin 2\\alpha=2\\sin\\alpha\\cos\\alpha$, значит $\\sin\\alpha\\cos\\alpha=\\frac{1}{2}\\sin 2\\alpha$.\n$\\sin 15^{\\circ}\\cos 15^{\\circ}=\\frac{1}{2}\\sin 30^{\\circ}=\\frac{1}{2}\\cdot\\frac{1}{2}=\\frac{1}{4}$."}, {"t": "s", "topic": "m2", "q": "Вычислите $\\cos^2 22{,}5^{\\circ}-\\sin^2 22{,}5^{\\circ}$.", "code": null, "opts": ["$\\frac{\\sqrt{2}}{2}$", "$\\frac{1}{2}$", "$\\frac{\\sqrt{3}}{2}$", "1"], "expl": "$\\cos 45^{\\circ}$.", "sol": "$\\cos^2\\alpha-\\sin^2\\alpha=\\cos 2\\alpha$.\n$\\cos^2 22{,}5^{\\circ}-\\sin^2 22{,}5^{\\circ}=\\cos 45^{\\circ}=\\frac{\\sqrt{2}}{2}$."}, {"t": "s", "topic": "m2", "q": "Вычислите $\\sin 75^{\\circ}$.", "code": null, "opts": ["$\\frac{\\sqrt{6}+\\sqrt{2}}{4}$", "$\\frac{\\sqrt{6}-\\sqrt{2}}{4}$", "$\\frac{\\sqrt{3}}{2}$", "$\\frac{\\sqrt{3}+1}{2}$"], "expl": "$\\sin(45^{\\circ}+30^{\\circ})$.", "sol": "$75^{\\circ}=45^{\\circ}+30^{\\circ}$. Формула: $\\sin(\\alpha+\\beta)=\\sin\\alpha\\cos\\beta+\\cos\\alpha\\sin\\beta$.\n$\\sin 75^{\\circ}=\\frac{\\sqrt{2}}{2}\\cdot\\frac{\\sqrt{3}}{2}+\\frac{\\sqrt{2}}{2}\\cdot\\frac{1}{2}=\\frac{\\sqrt{6}+\\sqrt{2}}{4}$."}, {"t": "s", "topic": "m2", "q": "Вычислите $2\\sin 30^{\\circ}+\\tg 45^{\\circ}-\\cos 60^{\\circ}$.", "code": null, "opts": ["$\\frac{3}{2}$", "1", "2", "$\\frac{5}{2}$"], "expl": "$1+1-\\frac{1}{2}$.", "sol": "Табличные значения: $\\sin 30^{\\circ}=\\frac{1}{2}$, $\\tg 45^{\\circ}=1$, $\\cos 60^{\\circ}=\\frac{1}{2}$.\n$2\\cdot\\frac{1}{2}+1-\\frac{1}{2}=1+1-\\frac{1}{2}=\\frac{3}{2}$."}, {"t": "s", "topic": "m2", "q": "Переведите $150^{\\circ}$ в радианы.", "code": null, "opts": ["$\\frac{5\\pi}{6}$", "$\\frac{3\\pi}{4}$", "$\\frac{2\\pi}{3}$", "$\\frac{5\\pi}{3}$"], "expl": "$\\frac{150\\pi}{180}$.", "sol": "Градусы в радианы: умножить на $\\frac{\\pi}{180^{\\circ}}$.\n$150\\cdot\\frac{\\pi}{180}=\\frac{150\\pi}{180}=\\frac{5\\pi}{6}$ (сократили на 30)."}, {"t": "s", "topic": "m2", "q": "Переведите $\\frac{3\\pi}{4}$ в градусы.", "code": null, "opts": ["$135^{\\circ}$", "$120^{\\circ}$", "$145^{\\circ}$", "$270^{\\circ}$"], "expl": "$\\frac{3\\cdot 180^{\\circ}}{4}$.", "sol": "Радианы в градусы: вместо $\\pi$ подставить $180^{\\circ}$.\n$\\frac{3\\cdot 180^{\\circ}}{4}=\\frac{540^{\\circ}}{4}=135^{\\circ}$."}, {"t": "s", "topic": "m2", "q": "Упростите $\\frac{1-\\cos^2\\alpha}{\\sin\\alpha}$.", "code": null, "opts": ["$\\sin\\alpha$", "$\\cos\\alpha$", "1", "$\\tg\\alpha$"], "expl": "$1-\\cos^2\\alpha=\\sin^2\\alpha$.", "sol": "Из основного тождества: $1-\\cos^2\\alpha=\\sin^2\\alpha$.\n$\\frac{\\sin^2\\alpha}{\\sin\\alpha}=\\sin\\alpha$."}, {"t": "s", "topic": "m2", "q": "Упростите $\\sin(\\pi-\\alpha)+\\cos\\left(\\frac{\\pi}{2}+\\alpha\\right)$.", "code": null, "opts": ["0", "$2\\sin\\alpha$", "$2\\cos\\alpha$", "$\\sin\\alpha-\\cos\\alpha$"], "expl": "$\\sin\\alpha-\\sin\\alpha=0$.", "sol": "Формулы приведения: $\\sin(\\pi-\\alpha)=\\sin\\alpha$ (II четверть, синус +, функция не меняется).\n$\\cos\\left(\\frac{\\pi}{2}+\\alpha\\right)=-\\sin\\alpha$ (II четверть, косинус −, функция меняется на синус).\n$\\sin\\alpha-\\sin\\alpha=0$."}, {"t": "s", "topic": "m2", "q": "Упростите $\\tg\\alpha\\cdot\\ctg\\alpha-\\sin^2\\alpha$.", "code": null, "opts": ["$\\cos^2\\alpha$", "$\\sin^2\\alpha$", "1", "$\\tg^2\\alpha$"], "expl": "$1-\\sin^2\\alpha$.", "sol": "$\\tg\\alpha\\cdot\\ctg\\alpha=1$.\n$1-\\sin^2\\alpha=\\cos^2\\alpha$."}, {"t": "s", "topic": "m2", "q": "Наименьший положительный период функции $y=\\sin 3x$:", "code": null, "opts": ["$\\frac{2\\pi}{3}$", "$3\\pi$", "$\\frac{\\pi}{3}$", "$6\\pi$"], "expl": "$\\frac{2\\pi}{3}$.", "sol": "Период $y=\\sin kx$ равен $\\frac{2\\pi}{|k|}$.\n$k=3$: $T=\\frac{2\\pi}{3}$."}, {"t": "s", "topic": "m2", "q": "Наименьший положительный период функции $y=\\tg\\frac{x}{2}$:", "code": null, "opts": ["$2\\pi$", "$\\pi$", "$\\frac{\\pi}{2}$", "$4\\pi$"], "expl": "$\\pi:\\frac{1}{2}=2\\pi$.", "sol": "Период $y=\\tg kx$ равен $\\frac{\\pi}{|k|}$.\n$k=\\frac{1}{2}$: $T=\\pi:\\frac{1}{2}=2\\pi$.\nОшибка: у тангенса основной период $\\pi$, а не $2\\pi$."}, {"t": "s", "topic": "m2", "q": "Множество значений функции $y=3\\sin x+2$:", "code": null, "opts": ["$[-1;5]$", "$[-3;3]$", "$[2;5]$", "$[-1;3]$"], "expl": "$2\\pm 3$.", "sol": "$-1\\le\\sin x\\le 1$. Умножим на 3: $-3\\le 3\\sin x\\le 3$.\nПрибавим 2: $-1\\le 3\\sin x+2\\le 5$. Ответ: $[-1;5]$."}, {"t": "s", "topic": "m2", "q": "Знак $\\cos 200^{\\circ}$:", "code": null, "opts": ["отрицательный", "положительный", "равен нулю", "не определён"], "expl": "III четверть.", "sol": "$200^{\\circ}$ лежит между $180^{\\circ}$ и $270^{\\circ}$ — это III четверть.\nВ III четверти косинус (координата $x$ на окружности) отрицателен."}, {"t": "s", "topic": "m2", "q": "Вычислите $\\sin^2 17^{\\circ}+\\cos^2 17^{\\circ}+\\tg 45^{\\circ}$.", "code": null, "opts": ["2", "1", "0", "$\\sqrt{2}$"], "expl": "$1+1$.", "sol": "$\\sin^2 17^{\\circ}+\\cos^2 17^{\\circ}=1$ для любого угла. $\\tg 45^{\\circ}=1$.\n$1+1=2$."}, {"t": "s", "topic": "m2", "q": "Вычислите $\\cos(-60^{\\circ})+\\sin(-30^{\\circ})$.", "code": null, "opts": ["0", "1", "$-1$", "$\\sqrt{3}$"], "expl": "$\\frac{1}{2}-\\frac{1}{2}$.", "sol": "Косинус чётный: $\\cos(-60^{\\circ})=\\cos 60^{\\circ}=\\frac{1}{2}$. Синус нечётный: $\\sin(-30^{\\circ})=-\\frac{1}{2}$.\n$\\frac{1}{2}-\\frac{1}{2}=0$."}, {"t": "s", "topic": "m2", "q": "$\\tg\\alpha=2$. Найдите $\\frac{\\sin\\alpha+\\cos\\alpha}{\\sin\\alpha-\\cos\\alpha}$.", "code": null, "opts": ["3", "$-3$", "$\\frac{1}{3}$", "2"], "expl": "Делим на $\\cos\\alpha$: $\\frac{\\tg\\alpha+1}{\\tg\\alpha-1}=3$.", "sol": "Разделим числитель и знаменатель на $\\cos\\alpha$: $\\frac{\\tg\\alpha+1}{\\tg\\alpha-1}$.\n$\\frac{2+1}{2-1}=3$."}, {"t": "s", "topic": "m3", "q": "Сократите дробь $\\frac{x^2-9}{x^2+3x}$.", "code": null, "opts": ["$\\frac{x-3}{x}$", "$\\frac{x+3}{x}$", "$x-3$", "$\\frac{x-3}{x+3}$"], "expl": "$\\frac{(x-3)(x+3)}{x(x+3)}$.", "sol": "Числитель — разность квадратов: $x^2-9=(x-3)(x+3)$.\nЗнаменатель — общий множитель: $x^2+3x=x(x+3)$.\nСокращаем на $(x+3)$: $\\frac{x-3}{x}$."}, {"t": "s", "topic": "m3", "q": "Упростите $(a+2)^2-(a-2)^2$.", "code": null, "opts": ["$8a$", "8", "$4a$", "$2a^2+8$"], "expl": "Разность квадратов.", "sol": "Раскроем скобки: $(a+2)^2=a^2+4a+4$, $(a-2)^2=a^2-4a+4$.\n$a^2+4a+4-a^2+4a-4=8a$.\nИли по разности квадратов: $(a+2-a+2)(a+2+a-2)=4\\cdot 2a=8a$."}, {"t": "s", "topic": "m3", "q": "Разложите на множители $x^2-7x+12$.", "code": null, "opts": ["$(x-3)(x-4)$", "$(x+3)(x+4)$", "$(x-2)(x-6)$", "$(x-12)(x+1)$"], "expl": "Корни 3 и 4.", "sol": "Найдём корни $x^2-7x+12=0$: по Виета $x_1+x_2=7$, $x_1x_2=12$ — это 3 и 4.\n$ax^2+bx+c=a(x-x_1)(x-x_2)=(x-3)(x-4)$."}, {"t": "s", "topic": "m3", "q": "Разложите на множители $8a^3-1$.", "code": null, "opts": ["$(2a-1)(4a^2+2a+1)$", "$(2a-1)(4a^2-2a+1)$", "$(2a+1)(4a^2-2a+1)$", "$(2a-1)^3$"], "expl": "Разность кубов.", "sol": "$8a^3=(2a)^3$, $1=1^3$. Разность кубов: $A^3-B^3=(A-B)(A^2+AB+B^2)$.\n$(2a-1)(4a^2+2a+1)$."}, {"t": "s", "topic": "m3", "q": "Приведите к многочлену $(x-3)(x^2+3x+9)$.", "code": null, "opts": ["$x^3-27$", "$x^3+27$", "$x^3-9x-27$", "$x^3-6x^2+27$"], "expl": "Разность кубов.", "sol": "Это формула разности кубов «наоборот»: $(x-3)(x^2+3x+9)=x^3-3^3$.\n$x^3-27$."}, {"t": "s", "topic": "m3", "q": "Приведите к многочлену $(2x+1)^3$.", "code": null, "opts": ["$8x^3+12x^2+6x+1$", "$8x^3+1$", "$2x^3+6x^2+6x+1$", "$8x^3+6x^2+12x+1$"], "expl": "Куб суммы.", "sol": "Куб суммы: $(A+B)^3=A^3+3A^2B+3AB^2+B^3$, $A=2x$, $B=1$.\n$8x^3+3\\cdot 4x^2\\cdot 1+3\\cdot 2x\\cdot 1+1=8x^3+12x^2+6x+1$."}, {"t": "s", "topic": "m3", "q": "Вычислите $51^2-49^2$.", "code": null, "opts": ["200", "4", "100", "400"], "expl": "$(51-49)(51+49)=2\\cdot 100$.", "sol": "Разность квадратов: $51^2-49^2=(51-49)(51+49)$.\n$2\\cdot 100=200$."}, {"t": "s", "topic": "m3", "q": "Упростите $\\left(\\frac{m}{n}-\\frac{n}{m}\\right):\\left(\\frac{1}{n}+\\frac{1}{m}\\right)$.", "code": null, "opts": ["$m-n$", "$m+n$", "$\\frac{m-n}{mn}$", "1"], "expl": "$\\frac{m^2-n^2}{mn}\\cdot\\frac{mn}{m+n}=m-n$.", "sol": "Первая скобка: $\\frac{m}{n}-\\frac{n}{m}=\\frac{m^2-n^2}{mn}$. Вторая: $\\frac{1}{n}+\\frac{1}{m}=\\frac{m+n}{mn}$.\nДеление = умножение на перевёрнутую: $\\frac{(m-n)(m+n)}{mn}\\cdot\\frac{mn}{m+n}=m-n$."}, {"t": "s", "topic": "m3", "q": "Сократите дробь $\\frac{a^2-4a+4}{a^2-4}$.", "code": null, "opts": ["$\\frac{a-2}{a+2}$", "$\\frac{a+2}{a-2}$", "$a-2$", "$\\frac{1}{a+2}$"], "expl": "$\\frac{(a-2)^2}{(a-2)(a+2)}$.", "sol": "Числитель — квадрат разности: $a^2-4a+4=(a-2)^2$. Знаменатель: $a^2-4=(a-2)(a+2)$.\nСокращаем на $(a-2)$: $\\frac{a-2}{a+2}$."}, {"t": "s", "topic": "m3", "q": "Значение $x^2-2xy+y^2$ при $x=7{,}5$, $y=2{,}5$:", "code": null, "opts": ["25", "5", "50", "100"], "expl": "$(x-y)^2=5^2$.", "sol": "Заметим формулу: $x^2-2xy+y^2=(x-y)^2$.\n$x-y=7{,}5-2{,}5=5$, $5^2=25$."}, {"t": "s", "topic": "m3", "q": "При каком $c$ выражение $x^2+6x+c$ является полным квадратом?", "code": null, "opts": ["9", "3", "36", "6"], "expl": "$(x+3)^2=x^2+6x+9$.", "sol": "Полный квадрат: $(x+b)^2=x^2+2bx+b^2$. Здесь $2b=6$, $b=3$.\n$c=b^2=9$."}, {"t": "s", "topic": "m3", "q": "Упростите $(3a^{-2}b^3)^2\\cdot a^5$.", "code": null, "opts": ["$9ab^6$", "$9a^9b^6$", "$6ab^6$", "$9a^{-4}b^5$"], "expl": "$9a^{-4}b^6\\cdot a^5$.", "sol": "$(3a^{-2}b^3)^2=9a^{-4}b^6$ (каждый множитель в квадрат, показатели умножаем на 2).\n$9a^{-4}b^6\\cdot a^5=9a^{-4+5}b^6=9ab^6$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $x^2-5x+6=0$.", "code": null, "opts": ["$2;\\ 3$", "$-3;\\ -2$", "нет корней", "$3;\\ 4$"], "expl": "$D=1$.", "sol": "$a=1$, $b=-5$, $c=6$. $D=b^2-4ac=25-24=1$.\n$x=\\frac{-b\\pm\\sqrt{D}}{2a}=\\frac{5\\pm 1}{2}$: $x_1=2$, $x_2=3$.\nПроверка по Виета: $2+3=5$, $2\\cdot 3=6$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $x^2+2x-15=0$.", "code": null, "opts": ["$-5;\\ 3$", "$-3;\\ 5$", "нет корней", "$-4;\\ 4$"], "expl": "$D=64$.", "sol": "$D=2^2-4\\cdot 1\\cdot(-15)=4+60=64$, $\\sqrt{D}=8$.\n$x=\\frac{-2\\pm 8}{2}$: $x_1=-5$, $x_2=3$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $2x^2-7x+3=0$.", "code": null, "opts": ["$\\frac{1}{2};\\ 3$", "$-3;\\ -\\frac{1}{2}$", "нет корней", "$\\frac{3}{2};\\ 4$"], "expl": "$D=25$.", "sol": "$D=49-4\\cdot 2\\cdot 3=49-24=25$, $\\sqrt{D}=5$.\n$x=\\frac{7\\pm 5}{4}$: $x_1=\\frac{2}{4}=\\frac{1}{2}$, $x_2=\\frac{12}{4}=3$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $x^2-6x+9=0$.", "code": null, "opts": ["$3$", "$-3$", "нет корней", "$4$"], "expl": "$D=0$.", "sol": "$D=36-36=0$ — один корень.\n$x=\\frac{6}{2}=3$. Или сразу: $x^2-6x+9=(x-3)^2=0$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $3x^2-2x-1=0$.", "code": null, "opts": ["$-\\frac{1}{3};\\ 1$", "$-1;\\ \\frac{1}{3}$", "нет корней", "$\\frac{2}{3};\\ 2$"], "expl": "$D=16$.", "sol": "$D=4-4\\cdot 3\\cdot(-1)=4+12=16$, $\\sqrt{D}=4$.\n$x=\\frac{2\\pm 4}{6}$: $x_1=-\\frac{2}{6}=-\\frac{1}{3}$, $x_2=1$."}, {"t": "s", "topic": "m4", "q": "Уравнение, не имеющее действительных корней:", "code": null, "opts": ["$x^2+x+5=0$", "$x^2-4=0$", "$x^2+4x+4=0$", "$x^2-x-5=0$"], "expl": "$D=1-20\\lt 0$.", "sol": "Корней нет, если $D\\lt 0$. Для $x^2+x+5$: $D=1-20=-19\\lt 0$.\nУ остальных: $x^2-4=0$ — корни $\\pm 2$; $x^2+4x+4=0$ — $D=0$; $x^2-x-5=0$ — $D=21\\gt 0$."}, {"t": "s", "topic": "m4", "q": "Уравнение $|x-2|=-3$ имеет:", "code": null, "opts": ["нет корней", "$x=5$", "$x=-1$", "$x=5;\\ x=-1$"], "expl": "Модуль не бывает отрицательным.", "sol": "Модуль — это расстояние, он всегда $\\ge 0$.\n$|x-2|$ не может равняться $-3$, поэтому корней нет."}, {"t": "s", "topic": "m4", "q": "Решите $|2x-1|=5$.", "code": null, "opts": ["$-2;\\ 3$", "3", "$-3;\\ 2$", "$-2$"], "expl": "$2x-1=\\pm 5$.", "sol": "$|A|=5$ означает $A=5$ или $A=-5$.\n$2x-1=5$ → $x=3$; $2x-1=-5$ → $x=-2$."}, {"t": "s", "topic": "m4", "q": "Сумма корней уравнения $x^2-8x+3=0$:", "code": null, "opts": ["8", "$-8$", "3", "$-3$"], "expl": "По теореме Виета $x_1+x_2=8$.", "sol": "Теорема Виета: $x_1+x_2=-\\frac{b}{a}$.\n$-\\frac{-8}{1}=8$. (Сначала можно проверить $D=64-12\\gt 0$ — корни есть.)"}, {"t": "s", "topic": "m4", "q": "Произведение корней уравнения $2x^2+5x-7=0$:", "code": null, "opts": ["$-\\frac{7}{2}$", "$\\frac{7}{2}$", "$-\\frac{5}{2}$", "$-7$"], "expl": "$\\frac{c}{a}=-\\frac{7}{2}$.", "sol": "Теорема Виета: $x_1x_2=\\frac{c}{a}=\\frac{-7}{2}=-\\frac{7}{2}$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $\\frac{x^2-4}{x-2}=0$.", "code": null, "opts": ["$-2$", "2", "$\\pm 2$", "нет корней"], "expl": "$x\\ne 2$.", "sol": "Дробь равна нулю, когда числитель $=0$, а знаменатель $\\ne 0$.\n$x^2-4=0$ → $x=\\pm 2$. Но при $x=2$ знаменатель $=0$ — этот корень не подходит.\nОтвет: $x=-2$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $3(x-2)=2x+5$.", "code": null, "opts": ["11", "3", "$-1$", "7"], "expl": "$3x-6=2x+5$.", "sol": "Раскроем скобки: $3x-6=2x+5$.\nПеренесём: $3x-2x=5+6$, $x=11$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $\\frac{x}{x-1}=2$.", "code": null, "opts": ["2", "1", "$-2$", "$\\frac{1}{2}$"], "expl": "$x=2x-2$.", "sol": "ОДЗ: $x\\ne 1$. Умножим на $(x-1)$: $x=2(x-1)=2x-2$.\n$x=2$ — подходит."}, {"t": "s", "topic": "m4", "q": "При каком $k\\gt 0$ уравнение $x^2+kx+9=0$ имеет один корень?", "code": null, "opts": ["6", "3", "9", "18"], "expl": "$D=k^2-36=0$.", "sol": "Один корень, когда $D=0$: $k^2-4\\cdot 9=0$, $k^2=36$, $k=\\pm 6$.\nПо условию $k\\gt 0$: $k=6$."}, {"t": "s", "topic": "m4", "q": "Решите уравнение $x^4-5x^2+4=0$.", "code": null, "opts": ["$\\pm 1;\\ \\pm 2$", "$1;\\ 4$", "$\\pm 1$", "$\\pm 2;\\ \\pm 4$"], "expl": "$t=x^2$: $t=1$, $t=4$.", "sol": "Замена $t=x^2\\ge 0$: $t^2-5t+4=0$, $t_1=1$, $t_2=4$.\n$x^2=1$ → $x=\\pm 1$; $x^2=4$ → $x=\\pm 2$. Всего 4 корня."}, {"t": "s", "topic": "m4", "q": "Корень уравнения $\\frac{1}{x+2}=\\frac{1}{2x-1}$:", "code": null, "opts": ["3", "$-3$", "1", "$\\frac{1}{3}$"], "expl": "$x+2=2x-1$.", "sol": "Дроби с равными числителями равны, когда равны знаменатели: $x+2=2x-1$.\n$x=3$. Проверка: $\\frac{1}{5}=\\frac{1}{5}$."}, {"t": "s", "topic": "m5", "q": "Решите уравнение $\\sin x=\\frac{1}{2}$.", "code": null, "opts": ["$(-1)^n\\frac{\\pi}{6}+\\pi n$", "$\\pm\\frac{\\pi}{6}+2\\pi n$", "$\\frac{\\pi}{6}+\\pi n$", "$\\pm\\frac{\\pi}{3}+2\\pi n$"], "expl": "Общая формула для синуса.", "sol": "$\\sin x=a$: $x=(-1)^n\\arcsin a+\\pi n$.\n$\\arcsin\\frac{1}{2}=\\frac{\\pi}{6}$, поэтому $x=(-1)^n\\frac{\\pi}{6}+\\pi n$, $n\\in Z$.\n(Это углы $\\frac{\\pi}{6}$ и $\\frac{5\\pi}{6}$ плюс полные обороты.)"}, {"t": "s", "topic": "m5", "q": "Решите уравнение $\\cos x=0$.", "code": null, "opts": ["$\\frac{\\pi}{2}+\\pi n$", "$\\pi n$", "$2\\pi n$", "$\\frac{\\pi}{2}+2\\pi n$"], "expl": "Частный случай.", "sol": "Косинус — это координата $x$ точки на единичной окружности. $x=0$ в точках $\\frac{\\pi}{2}$ и $\\frac{3\\pi}{2}$.\nОни повторяются через $\\pi$: $x=\\frac{\\pi}{2}+\\pi n$."}, {"t": "s", "topic": "m5", "q": "Решите уравнение $\\tg x=\\sqrt{3}$.", "code": null, "opts": ["$\\frac{\\pi}{3}+\\pi n$", "$\\frac{\\pi}{6}+\\pi n$", "$\\pm\\frac{\\pi}{3}+2\\pi n$", "$\\frac{\\pi}{3}+2\\pi n$"], "expl": "$\\arctg\\sqrt{3}=\\frac{\\pi}{3}$.", "sol": "$\\tg x=a$: $x=\\arctg a+\\pi n$. $\\arctg\\sqrt{3}=\\frac{\\pi}{3}$ (так как $\\tg 60^{\\circ}=\\sqrt{3}$).\n$x=\\frac{\\pi}{3}+\\pi n$."}, {"t": "s", "topic": "m5", "q": "Решите уравнение $\\cos x=-1$.", "code": null, "opts": ["$\\pi+2\\pi n$", "$\\pi n$", "$-\\frac{\\pi}{2}+2\\pi n$", "$2\\pi n$"], "expl": "Частный случай.", "sol": "$\\cos x=-1$ только в точке $\\pi$ на окружности, повтор через $2\\pi$.\n$x=\\pi+2\\pi n$."}, {"t": "s", "topic": "m5", "q": "Уравнение $\\sin x=1{,}5$:", "code": null, "opts": ["не имеет корней", "$x=\\frac{\\pi}{2}+2\\pi n$", "$x=\\arcsin 1{,}5+\\pi n$", "$x=\\frac{\\pi}{3}+2\\pi n$"], "expl": "$|\\sin x|\\le 1$.", "sol": "Синус принимает значения только от $-1$ до $1$.\n$1{,}5\\gt 1$, поэтому решений нет."}, {"t": "s", "topic": "m5", "q": "Решите уравнение $2\\cos x-\\sqrt{2}=0$.", "code": null, "opts": ["$\\pm\\frac{\\pi}{4}+2\\pi n$", "$\\pm\\frac{\\pi}{3}+2\\pi n$", "$(-1)^n\\frac{\\pi}{4}+\\pi n$", "$\\frac{\\pi}{4}+\\pi n$"], "expl": "$\\cos x=\\frac{\\sqrt{2}}{2}$.", "sol": "$2\\cos x=\\sqrt{2}$ → $\\cos x=\\frac{\\sqrt{2}}{2}$.\n$\\cos x=a$: $x=\\pm\\arccos a+2\\pi n$; $\\arccos\\frac{\\sqrt{2}}{2}=\\frac{\\pi}{4}$.\n$x=\\pm\\frac{\\pi}{4}+2\\pi n$."}, {"t": "s", "topic": "m5", "q": "Решите уравнение $\\sin 2x=0$.", "code": null, "opts": ["$\\frac{\\pi n}{2}$", "$\\pi n$", "$2\\pi n$", "$\\frac{\\pi}{2}+\\pi n$"], "expl": "$2x=\\pi n$.", "sol": "$\\sin t=0$ при $t=\\pi n$. Здесь $t=2x$: $2x=\\pi n$.\nДелим на 2: $x=\\frac{\\pi n}{2}$."}, {"t": "s", "topic": "m5", "q": "Решите $\\sqrt{x+7}=x+1$.", "code": null, "opts": ["2", "$2;\\ -3$", "$-3$", "7"], "expl": "Посторонний корень $x=-3$ отбрасываем.", "sol": "Возводим в квадрат: $x+7=(x+1)^2=x^2+2x+1$ → $x^2+x-6=0$ → $x=2$ или $x=-3$.\nПроверка (обязательна!): правая часть $x+1\\ge 0$. При $x=-3$: $-2\\lt 0$ — посторонний корень.\nПри $x=2$: $\\sqrt{9}=3=2+1$ ✓. Ответ: $2$."}, {"t": "s", "topic": "m5", "q": "Решите $\\sqrt{2x-3}=3$.", "code": null, "opts": ["6", "3", "4,5", "12"], "expl": "$2x-3=9$.", "sol": "Возводим в квадрат: $2x-3=9$ → $2x=12$ → $x=6$.\nПроверка: $\\sqrt{9}=3$ ✓."}, {"t": "s", "topic": "m5", "q": "Решите $\\sqrt{x^2-9}=4$.", "code": null, "opts": ["$\\pm 5$", "5", "$\\pm 4$", "$\\sqrt{7}$"], "expl": "$x^2=25$.", "sol": "Возводим в квадрат: $x^2-9=16$ → $x^2=25$ → $x=\\pm 5$.\nПравая часть 4 положительна, оба корня подходят: $\\sqrt{25-9}=4$."}, {"t": "s", "topic": "m5", "q": "Решите $\\sqrt{3x+1}=x-1$.", "code": null, "opts": ["5", "$0;\\ 5$", "0", "1"], "expl": "$x^2-5x=0$; $x=0$ не подходит.", "sol": "Возводим в квадрат: $3x+1=x^2-2x+1$ → $x^2-5x=0$ → $x(x-5)=0$, $x=0$ или $x=5$.\nПроверка: $x-1\\ge 0$. При $x=0$ правая часть $-1$ — не подходит. При $x=5$: $\\sqrt{16}=4$ ✓."}, {"t": "s", "topic": "m5", "q": "Решите уравнение $\\sin^2x-\\sin x=0$.", "code": null, "opts": ["$\\pi n;\\ \\frac{\\pi}{2}+2\\pi n$", "$\\pi n$", "$\\frac{\\pi}{2}+\\pi n$", "$2\\pi n;\\ \\pi+2\\pi n$"], "expl": "$\\sin x(\\sin x-1)=0$.", "sol": "Вынесем $\\sin x$: $\\sin x(\\sin x-1)=0$.\n$\\sin x=0$ → $x=\\pi n$; $\\sin x=1$ → $x=\\frac{\\pi}{2}+2\\pi n$."}, {"t": "s", "topic": "m5", "q": "Сколько корней имеет уравнение $\\cos x=\\frac{1}{2}$ на отрезке $[0;2\\pi]$?", "code": null, "opts": ["2", "1", "3", "4"], "expl": "$\\frac{\\pi}{3}$ и $\\frac{5\\pi}{3}$.", "sol": "$\\cos x=\\frac{1}{2}$: $x=\\pm\\frac{\\pi}{3}+2\\pi n$.\nНа $[0;2\\pi]$ попадают $x=\\frac{\\pi}{3}$ и $x=2\\pi-\\frac{\\pi}{3}=\\frac{5\\pi}{3}$. Всего 2 корня."}, {"t": "s", "topic": "m6", "q": "Решите $2^{x+1}=32$.", "code": null, "opts": ["4", "5", "16", "3"], "expl": "$2^5$: $x+1=5$.", "sol": "Запишем 32 как степень двойки: $32=2^5$.\n$2^{x+1}=2^5$ → $x+1=5$ → $x=4$."}, {"t": "s", "topic": "m6", "q": "Решите $3^{2x-1}=27$.", "code": null, "opts": ["2", "1", "$\\frac{3}{2}$", "4"], "expl": "$2x-1=3$.", "sol": "$27=3^3$: $3^{2x-1}=3^3$ → $2x-1=3$ → $x=2$."}, {"t": "s", "topic": "m6", "q": "Решите $\\left(\\frac{1}{5}\\right)^x=125$.", "code": null, "opts": ["$-3$", "3", "$\\frac{1}{3}$", "$-\\frac{1}{3}$"], "expl": "$125=\\left(\\frac{1}{5}\\right)^{-3}$.", "sol": "$125=5^3=\\left(\\frac{1}{5}\\right)^{-3}$.\n$\\left(\\frac{1}{5}\\right)^x=\\left(\\frac{1}{5}\\right)^{-3}$ → $x=-3$."}, {"t": "s", "topic": "m6", "q": "Решите $4^x-3\\cdot 2^x-4=0$.", "code": null, "opts": ["2", "$-1;\\ 4$", "$2;\\ -1$", "4"], "expl": "$t=2^x=4$.", "sol": "$4^x=(2^x)^2$. Замена $t=2^x\\gt 0$: $t^2-3t-4=0$, $t_1=4$, $t_2=-1$.\n$t=-1$ не подходит ($2^x\\gt 0$). $2^x=4$ → $x=2$."}, {"t": "s", "topic": "m6", "q": "Решите $9^x-4\\cdot 3^x+3=0$.", "code": null, "opts": ["$0;\\ 1$", "$1;\\ 3$", "1", "0"], "expl": "$t=3^x$: $t=1$, $t=3$.", "sol": "$9^x=(3^x)^2$. Замена $t=3^x$: $t^2-4t+3=0$, $t=1$ или $t=3$.\n$3^x=1$ → $x=0$; $3^x=3$ → $x=1$."}, {"t": "s", "topic": "m6", "q": "Решите $\\log_2(x-1)=3$.", "code": null, "opts": ["9", "7", "8", "4"], "expl": "$x-1=8$.", "sol": "По определению логарифма: $x-1=2^3=8$.\n$x=9$. Проверка ОДЗ: $9-1=8\\gt 0$ ✓."}, {"t": "s", "topic": "m6", "q": "Вычислите $\\log_2 32+\\log_3 9$.", "code": null, "opts": ["7", "5", "10", "6"], "expl": "$5+2$.", "sol": "$\\log_2 32=5$ (так как $2^5=32$); $\\log_3 9=2$ ($3^2=9$).\n$5+2=7$."}, {"t": "s", "topic": "m6", "q": "Вычислите $\\log_6 4+\\log_6 9$.", "code": null, "opts": ["2", "13", "$\\log_6 13$", "1"], "expl": "$\\log_6 36=2$.", "sol": "Сумма логарифмов = логарифм произведения: $\\log_6(4\\cdot 9)=\\log_6 36$.\n$6^2=36$ → ответ 2."}, {"t": "s", "topic": "m6", "q": "Вычислите $\\log_5 75-\\log_5 3$.", "code": null, "opts": ["2", "72", "25", "$\\log_5 72$"], "expl": "$\\log_5 25=2$.", "sol": "Разность логарифмов = логарифм частного: $\\log_5\\frac{75}{3}=\\log_5 25=2$."}, {"t": "s", "topic": "m6", "q": "Вычислите $\\lg 0{,}001$.", "code": null, "opts": ["$-3$", "3", "$-2$", "0,001"], "expl": "$10^{-3}$.", "sol": "$0{,}001=10^{-3}$, $\\lg$ — логарифм по основанию 10.\n$\\lg 10^{-3}=-3$."}, {"t": "s", "topic": "m6", "q": "Вычислите $2^{\\log_2 5+1}$.", "code": null, "opts": ["10", "6", "5", "25"], "expl": "$5\\cdot 2$.", "sol": "$2^{\\log_2 5+1}=2^{\\log_2 5}\\cdot 2^1$.\n$2^{\\log_2 5}=5$, поэтому $5\\cdot 2=10$."}, {"t": "s", "topic": "m6", "q": "Вычислите $\\log_4 8$.", "code": null, "opts": ["$\\frac{3}{2}$", "2", "$\\frac{2}{3}$", "$\\frac{1}{2}$"], "expl": "$4^{\\frac{3}{2}}=8$.", "sol": "Приведём к основанию 2: $4=2^2$, $8=2^3$.\n$\\log_4 8=\\frac{\\log_2 8}{\\log_2 4}=\\frac{3}{2}$."}, {"t": "s", "topic": "m6", "q": "Решите $\\log_3(2x+1)=\\log_3(x+4)$.", "code": null, "opts": ["3", "5", "1", "$-3$"], "expl": "$2x+1=x+4$.", "sol": "Логарифмы с одинаковым основанием равны → равны аргументы: $2x+1=x+4$ → $x=3$.\nПроверка ОДЗ: $2\\cdot 3+1=7\\gt 0$, $3+4=7\\gt 0$ ✓."}, {"t": "s", "topic": "m6", "q": "Решите $\\lg x+\\lg(x-3)=1$.", "code": null, "opts": ["5", "$-2;\\ 5$", "$-2$", "10"], "expl": "$x(x-3)=10$, $x\\gt 3$.", "sol": "ОДЗ: $x\\gt 0$ и $x-3\\gt 0$, то есть $x\\gt 3$.\n$\\lg(x(x-3))=1$ → $x^2-3x=10$ → $x^2-3x-10=0$ → $x=5$ или $x=-2$.\n$x=-2$ не входит в ОДЗ. Ответ: 5."}, {"t": "s", "topic": "m6", "q": "Решите $\\log_2^2x-3\\log_2x+2=0$.", "code": null, "opts": ["$2;\\ 4$", "$1;\\ 2$", "4", "$1;\\ 4$"], "expl": "$t=\\log_2 x$: $t=1$, $t=2$.", "sol": "Замена $t=\\log_2 x$: $t^2-3t+2=0$, $t=1$ или $t=2$.\n$\\log_2 x=1$ → $x=2$; $\\log_2 x=2$ → $x=4$."}, {"t": "s", "topic": "m6", "q": "Решите $5^x=7$.", "code": null, "opts": ["$\\log_5 7$", "$\\log_7 5$", "$\\frac{7}{5}$", "$\\lg 2$"], "expl": "По определению логарифма.", "sol": "7 нельзя записать как целую степень 5, поэтому по определению логарифма: $x=\\log_5 7$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $x+y=7$, $x-y=1$.", "code": null, "opts": ["$(4;3)$", "$(3;4)$", "$(5;2)$", "$(4;-3)$"], "expl": "$2x=8$.", "sol": "Сложим уравнения: $2x=8$, $x=4$.\nПодставим: $4+y=7$, $y=3$. Ответ: $(4;3)$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $2x+3y=13$, $x-y=-1$.", "code": null, "opts": ["$(2;3)$", "$(3;2)$", "$(-1;5)$", "$(1;2)$"], "expl": "$x=y-1$.", "sol": "Из второго: $x=y-1$. Подставим в первое: $2(y-1)+3y=13$ → $5y=15$ → $y=3$.\n$x=3-1=2$. Ответ: $(2;3)$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $x+y=5$, $xy=6$.", "code": null, "opts": ["$(2;3),\\ (3;2)$", "$(1;6),\\ (6;1)$", "$(2;3)$", "$(-2;-3)$"], "expl": "Корни $t^2-5t+6=0$.", "sol": "Если $x+y=5$ и $xy=6$, то $x$ и $y$ — корни $t^2-5t+6=0$: $t=2$ и $t=3$.\nРешения: $(2;3)$ и $(3;2)$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $y=x^2$, $y=2x+3$.", "code": null, "opts": ["$(-1;1),\\ (3;9)$", "$(1;1),\\ (3;9)$", "$(-1;1)$", "$(3;9),\\ (-3;9)$"], "expl": "$x^2-2x-3=0$.", "sol": "Приравняем правые части: $x^2=2x+3$ → $x^2-2x-3=0$ → $x=3$ или $x=-1$.\n$y=x^2$: $(3;9)$ и $(-1;1)$."}, {"t": "s", "topic": "m7", "q": "Сколько решений имеет система $2x-y=3$, $4x-2y=5$?", "code": null, "opts": ["ни одного", "одно", "два", "бесконечно много"], "expl": "$\\frac{2}{4}=\\frac{-1}{-2}\\ne\\frac{3}{5}$.", "sol": "Умножим первое уравнение на 2: $4x-2y=6$. А второе: $4x-2y=5$.\nОдно и то же выражение не может равняться и 6, и 5 — решений нет (прямые параллельны)."}, {"t": "s", "topic": "m7", "q": "Сколько решений имеет система $x+2y=4$, $3x+6y=12$?", "code": null, "opts": ["бесконечно много", "одно", "ни одного", "два"], "expl": "Уравнения пропорциональны.", "sol": "Второе уравнение — первое, умноженное на 3: $3(x+2y)=3\\cdot 4$.\nЭто одна и та же прямая — решений бесконечно много."}, {"t": "s", "topic": "m7", "q": "Решите систему: $x^2+y^2=25$, $x+y=7$.", "code": null, "opts": ["$(3;4),\\ (4;3)$", "$(3;4)$", "$(5;2),\\ (2;5)$", "$(-3;-4)$"], "expl": "$xy=12$.", "sol": "$(x+y)^2=x^2+2xy+y^2$: $49=25+2xy$ → $xy=12$.\n$x$ и $y$ — корни $t^2-7t+12=0$: 3 и 4. Ответ: $(3;4)$, $(4;3)$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $2^x\\cdot 2^y=16$, $x-y=2$.", "code": null, "opts": ["$(3;1)$", "$(2;0)$", "$(4;2)$", "$(1;3)$"], "expl": "$x+y=4$.", "sol": "$2^x\\cdot 2^y=2^{x+y}=16=2^4$ → $x+y=4$.\nС $x-y=2$: $2x=6$, $x=3$, $y=1$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $\\lg x+\\lg y=1$, $x-y=3$.", "code": null, "opts": ["$(5;2)$", "$(2;5)$", "$(10;7)$", "$(-2;-5)$"], "expl": "$xy=10$, $x,y\\gt 0$.", "sol": "ОДЗ: $x\\gt 0$, $y\\gt 0$. $\\lg x+\\lg y=\\lg(xy)=1$ → $xy=10$.\n$x=y+3$: $(y+3)y=10$ → $y^2+3y-10=0$ → $y=2$ (или $-5$ — не подходит). $x=5$."}, {"t": "s", "topic": "m7", "q": "Решите систему: $\\sqrt{x}+\\sqrt{y}=5$, $x-y=5$.", "code": null, "opts": ["$(9;4)$", "$(4;9)$", "$(16;11)$", "$(25;20)$"], "expl": "$\\sqrt{x}-\\sqrt{y}=1$.", "sol": "$x-y=(\\sqrt{x}-\\sqrt{y})(\\sqrt{x}+\\sqrt{y})=5$. Так как $\\sqrt{x}+\\sqrt{y}=5$, то $\\sqrt{x}-\\sqrt{y}=1$.\nСкладываем: $2\\sqrt{x}=6$, $\\sqrt{x}=3$, $x=9$; $\\sqrt{y}=2$, $y=4$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $x^2-x-6\\lt 0$.", "code": null, "opts": ["$(-2;3)$", "$(-\\infty;-2)\\cup(3;+\\infty)$", "$[-2;3]$", "$(-3;2)$"], "expl": "Корни −2 и 3, ветви вверх.", "sol": "Корни $x^2-x-6=0$: $x=-2$ и $x=3$. Парабола, ветви вверх.\nНиже нуля (знак $\\lt$) — между корнями: $(-2;3)$. Концы не входят (строгий знак)."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $x^2\\ge 16$.", "code": null, "opts": ["$(-\\infty;-4]\\cup[4;+\\infty)$", "$[-4;4]$", "$[4;+\\infty)$", "$(-\\infty;-4)$"], "expl": "$|x|\\ge 4$.", "sol": "$x^2-16\\ge 0$, корни $\\pm 4$, ветви вверх.\nБольше или равно нулю — снаружи корней: $(-\\infty;-4]\\cup[4;+\\infty)$.\nОшибка: из $x^2\\ge 16$ не следует только $x\\ge 4$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $3-2x\\gt 7$.", "code": null, "opts": ["$x\\lt -2$", "$x\\gt -2$", "$x\\lt 2$", "$x\\gt 5$"], "expl": "$-2x\\gt 4$ — знак меняется.", "sol": "$-2x\\gt 7-3$ → $-2x\\gt 4$.\nДелим на $-2$ — отрицательное число, знак меняется: $x\\lt -2$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $\\frac{x-1}{x+3}\\le 0$.", "code": null, "opts": ["$(-3;1]$", "$[-3;1]$", "$(-\\infty;-3)\\cup[1;+\\infty)$", "$[1;+\\infty)$"], "expl": "$-3$ выколота.", "sol": "Метод интервалов: нуль числителя $x=1$, нуль знаменателя $x=-3$.\nЗнаки: при $x\\gt 1$ дробь $+$, на $(-3;1)$ — $-$, при $x\\lt -3$ — $+$.\nНужно $\\le 0$: $(-3;1]$. Точка $-3$ выколота (на ноль делить нельзя), 1 входит."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $\\left(\\frac{1}{2}\\right)^x\\ge 8$.", "code": null, "opts": ["$x\\le -3$", "$x\\ge -3$", "$x\\ge 3$", "$x\\le 3$"], "expl": "Основание меньше 1 — знак меняется.", "sol": "$8=\\left(\\frac{1}{2}\\right)^{-3}$. Неравенство: $\\left(\\frac{1}{2}\\right)^x\\ge\\left(\\frac{1}{2}\\right)^{-3}$.\nОснование $\\frac{1}{2}\\lt 1$ — функция убывает, знак меняется: $x\\le -3$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $2^x\\lt 16$.", "code": null, "opts": ["$x\\lt 4$", "$x\\gt 4$", "$x\\lt 8$", "$x\\lt 2$"], "expl": "Основание больше 1.", "sol": "$16=2^4$: $2^x\\lt 2^4$. Основание $2\\gt 1$ — знак сохраняется: $x\\lt 4$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $\\log_3(x-2)\\lt 2$.", "code": null, "opts": ["$(2;11)$", "$(-\\infty;11)$", "$(11;+\\infty)$", "$(2;9)$"], "expl": "$0\\lt x-2\\lt 9$.", "sol": "ОДЗ: $x-2\\gt 0$. $2=\\log_3 9$, основание $3\\gt 1$: $x-2\\lt 9$.\n$0\\lt x-2\\lt 9$ → $2\\lt x\\lt 11$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $\\log_{0{,}5}x\\gt 1$.", "code": null, "opts": ["$(0;0{,}5)$", "$(0{,}5;+\\infty)$", "$(-\\infty;0{,}5)$", "$(0;2)$"], "expl": "Основание меньше 1, $x\\gt 0$.", "sol": "ОДЗ: $x\\gt 0$. $1=\\log_{0{,}5}0{,}5$. Основание $0{,}5\\lt 1$ — знак меняется: $x\\lt 0{,}5$.\nС учётом ОДЗ: $(0;0{,}5)$."}, {"t": "s", "topic": "m8", "q": "Наименьшее целое решение неравенства $5x-7\\gt 2x+8$:", "code": null, "opts": ["6", "5", "4", "15"], "expl": "$3x\\gt 15$.", "sol": "$5x-2x\\gt 8+7$ → $3x\\gt 15$ → $x\\gt 5$.\n5 не подходит (знак строгий), наименьшее целое — 6."}, {"t": "s", "topic": "m8", "q": "Решите систему: $x-3\\gt 0$, $x\\lt 7$.", "code": null, "opts": ["$(3;7)$", "$[3;7]$", "$(-\\infty;7)$", "$(3;+\\infty)$"], "expl": "Пересечение.", "sol": "$x-3\\gt 0$ → $x\\gt 3$. Вместе с $x\\lt 7$: $3\\lt x\\lt 7$, то есть $(3;7)$."}, {"t": "s", "topic": "m8", "q": "Решите систему: $2x+1\\ge 5$, $3-x\\gt 0$.", "code": null, "opts": ["$[2;3)$", "$(2;3)$", "$[2;3]$", "$(-\\infty;3)$"], "expl": "$x\\ge 2$ и $x\\lt 3$.", "sol": "$2x+1\\ge 5$ → $x\\ge 2$. $3-x\\gt 0$ → $x\\lt 3$.\nПересечение: $[2;3)$ — 2 входит, 3 нет."}, {"t": "s", "topic": "m8", "q": "Сколько целых решений у неравенства $x^2-5x-6\\le 0$?", "code": null, "opts": ["8", "6", "7", "5"], "expl": "$[-1;6]$.", "sol": "Корни $x^2-5x-6=0$: $x=-1$ и $x=6$. Нужно $\\le 0$ — между корнями, включая концы: $[-1;6]$.\nЦелые: $-1,0,1,2,3,4,5,6$ — всего 8."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $\\sqrt{x-1}\\lt 3$.", "code": null, "opts": ["$[1;10)$", "$(-\\infty;10)$", "$[1;9)$", "$(1;10)$"], "expl": "$0\\le x-1\\lt 9$.", "sol": "Подкоренное выражение $\\ge 0$: $x\\ge 1$. Обе части неотрицательны — возводим в квадрат: $x-1\\lt 9$, $x\\lt 10$.\nОтвет: $[1;10)$."}, {"t": "s", "topic": "m8", "q": "Решите неравенство $\\sin x\\gt\\frac{1}{2}$.", "code": null, "opts": ["$\\left(\\frac{\\pi}{6}+2\\pi n;\\ \\frac{5\\pi}{6}+2\\pi n\\right)$", "$\\left(\\frac{\\pi}{3}+2\\pi n;\\ \\frac{2\\pi}{3}+2\\pi n\\right)$", "$\\left(-\\frac{\\pi}{6}+2\\pi n;\\ \\frac{\\pi}{6}+2\\pi n\\right)$", "$\\left(\\frac{\\pi}{6}+\\pi n;\\ \\frac{5\\pi}{6}+\\pi n\\right)$"], "expl": "По единичной окружности.", "sol": "На единичной окружности $\\sin x=\\frac{1}{2}$ в точках $\\frac{\\pi}{6}$ и $\\frac{5\\pi}{6}$.\nВыше этой высоты — дуга между ними: $\\frac{\\pi}{6}+2\\pi n\\lt x\\lt\\frac{5\\pi}{6}+2\\pi n$."}, {"t": "s", "topic": "m8", "q": "Пара чисел $(x;y)$ — решение неравенства $450x+600y\\le 2000$:", "code": null, "opts": ["$(2;1)$", "$(3;2)$", "$(1;3)$", "$(4;1)$"], "expl": "$900+600=1500\\le 2000$.", "sol": "Подставляем пары: $(2;1)$: $900+600=1500\\le 2000$ ✓.\n$(3;2)$: $1350+1200=2550$ ✗; $(1;3)$: $450+1800=2250$ ✗; $(4;1)$: $1800+600=2400$ ✗."}, {"t": "s", "topic": "m9", "q": "$a_1=3$, $d=4$. Найдите $a_{10}$.", "code": null, "opts": ["39", "43", "40", "30"], "expl": "$3+9\\cdot 4$.", "sol": "$a_n=a_1+(n-1)d$: $a_{10}=3+9\\cdot 4=3+36=39$.\nОшибка: умножать на $n$, а не на $n-1$."}, {"t": "s", "topic": "m9", "q": "$a_1=3$, $d=4$. Найдите $S_{10}$.", "code": null, "opts": ["210", "390", "195", "240"], "expl": "$\\frac{(3+39)\\cdot 10}{2}$.", "sol": "$a_{10}=39$ (см. формулу $a_n=a_1+(n-1)d$).\n$S_n=\\frac{(a_1+a_n)n}{2}=\\frac{(3+39)\\cdot 10}{2}=\\frac{420}{2}=210$."}, {"t": "s", "topic": "m9", "q": "Найдите разность арифметической прогрессии $7;\\ 3;\\ -1;\\ \\ldots$", "code": null, "opts": ["$-4$", "4", "$-3$", "3"], "expl": "$3-7$.", "sol": "$d=a_2-a_1=3-7=-4$. Проверка: $-1-3=-4$ ✓."}, {"t": "s", "topic": "m9", "q": "$a_3=10$, $a_7=22$. Найдите $d$.", "code": null, "opts": ["3", "4", "12", "2"], "expl": "$4d=12$.", "sol": "$a_7-a_3=(a_1+6d)-(a_1+2d)=4d$.\n$22-10=12=4d$ → $d=3$."}, {"t": "s", "topic": "m9", "q": "Сумма первых 20 натуральных чисел:", "code": null, "opts": ["210", "200", "190", "420"], "expl": "$\\frac{20\\cdot 21}{2}$.", "sol": "Это арифметическая прогрессия $1,2,\\ldots,20$: $S=\\frac{(1+20)\\cdot 20}{2}=210$."}, {"t": "s", "topic": "m9", "q": "$b_1=2$, $q=3$. Найдите $b_4$.", "code": null, "opts": ["54", "18", "162", "24"], "expl": "$2\\cdot 3^3$.", "sol": "$b_n=b_1q^{n-1}$: $b_4=2\\cdot 3^3=2\\cdot 27=54$."}, {"t": "s", "topic": "m9", "q": "$b_1=2$, $q=3$. Найдите $S_4$.", "code": null, "opts": ["80", "54", "26", "240"], "expl": "$\\frac{2(81-1)}{2}$.", "sol": "$S_n=\\frac{b_1(q^n-1)}{q-1}=\\frac{2(3^4-1)}{3-1}=\\frac{2\\cdot 80}{2}=80$.\nПроверка: $2+6+18+54=80$."}, {"t": "s", "topic": "m9", "q": "Сумма бесконечно убывающей прогрессии $8;\\ 4;\\ 2;\\ \\ldots$", "code": null, "opts": ["16", "14", "12", "$\\infty$"], "expl": "$\\frac{8}{1-\\frac{1}{2}}$.", "sol": "$q=\\frac{4}{8}=\\frac{1}{2}$, $|q|\\lt 1$ — прогрессия бесконечно убывающая.\n$S=\\frac{b_1}{1-q}=\\frac{8}{1-\\frac{1}{2}}=\\frac{8}{\\frac{1}{2}}=16$."}, {"t": "s", "topic": "m9", "q": "Знаменатель геометрической прогрессии $81;\\ 27;\\ 9;\\ \\ldots$", "code": null, "opts": ["$\\frac{1}{3}$", "3", "$-\\frac{1}{3}$", "$\\frac{1}{9}$"], "expl": "$\\frac{27}{81}$.", "sol": "$q=\\frac{b_2}{b_1}=\\frac{27}{81}=\\frac{1}{3}$."}, {"t": "s", "topic": "m9", "q": "$b_2=6$, $b_4=54$, $q\\gt 0$. Найдите $b_1$.", "code": null, "opts": ["2", "3", "18", "1"], "expl": "$q^2=9$, $q=3$.", "sol": "$\\frac{b_4}{b_2}=\\frac{b_1q^3}{b_1q}=q^2=\\frac{54}{6}=9$, $q=3$ (так как $q\\gt 0$).\n$b_1=\\frac{b_2}{q}=\\frac{6}{3}=2$."}, {"t": "s", "topic": "m9", "q": "Между 4 и 36 вставили одно число так, что получилась геометрическая прогрессия ($q\\gt 0$). Это число:", "code": null, "opts": ["12", "20", "16", "9"], "expl": "$b^2=4\\cdot 36$.", "sol": "В геометрической прогрессии средний член в квадрате равен произведению соседних: $b^2=4\\cdot 36=144$.\n$b=12$ ($q\\gt 0$). Проверка: $4;\\ 12;\\ 36$, $q=3$."}, {"t": "s", "topic": "m9", "q": "Сколько членов прогрессии $5;\\ 9;\\ 13;\\ \\ldots$ меньше 100?", "code": null, "opts": ["24", "23", "25", "95"], "expl": "$5+4(n-1)\\lt 100$.", "sol": "$a_n=5+4(n-1)\\lt 100$ → $4(n-1)\\lt 95$ → $n-1\\lt 23{,}75$ → $n\\lt 24{,}75$.\nНаибольшее $n=24$ ($a_{24}=97$, $a_{25}=101$)."}, {"t": "s", "topic": "m9", "q": "$b_3+b_5=60$, $b_3-b_1=9$. Найдите $b_1$ (одно из значений).", "code": null, "opts": ["3", "4", "5", "2"], "expl": "$q^2=4$, $b_1=3$ (второе решение: $q^2=\\frac{5}{3}$, $b_1=13{,}5$).", "sol": "$b_3+b_5=b_1q^2(1+q^2)=60$, $b_3-b_1=b_1(q^2-1)=9$.\nРазделим: $\\frac{q^2(1+q^2)}{q^2-1}=\\frac{60}{9}$. Замена $t=q^2$: $9t^2+9t=60t-60$ → $3t^2-17t+20=0$ → $t=4$ или $t=\\frac{5}{3}$.\n$t=4$: $b_1=\\frac{9}{4-1}=3$. ($t=\\frac{5}{3}$ даёт $b_1=13{,}5$.)"}, {"t": "s", "topic": "m10", "q": "Найдите производную $f(x)=x^3-3x$.", "code": null, "opts": ["$3x^2-3$", "$3x^2-3x$", "$x^2-3$", "$3x^2$"], "expl": "$(x^n)'=nx^{n-1}$.", "sol": "Производная суммы = сумма производных. $(x^3)'=3x^2$, $(3x)'=3$.\n$f'(x)=3x^2-3$."}, {"t": "s", "topic": "m10", "q": "$f(x)=2x^4-x^2$. Найдите $f'(1)$.", "code": null, "opts": ["6", "8", "7", "4"], "expl": "$8x^3-2x$ при $x=1$.", "sol": "$f'(x)=8x^3-2x$ (по формуле $(x^n)'=nx^{n-1}$).\n$f'(1)=8-2=6$."}, {"t": "s", "topic": "m10", "q": "Найдите производную $f(x)=\\sin 2x$.", "code": null, "opts": ["$2\\cos 2x$", "$\\cos 2x$", "$-2\\cos 2x$", "$2\\sin x$"], "expl": "$(f(kx))'=k\\cdot f'(kx)$.", "sol": "Сложная функция: $(\\sin kx)'=k\\cos kx$.\n$(\\sin 2x)'=2\\cos 2x$. Ошибка: забыть множитель 2."}, {"t": "s", "topic": "m10", "q": "Найдите производную $f(x)=x\\cdot e^x$.", "code": null, "opts": ["$e^x(x+1)$", "$e^x$", "$xe^{x-1}$", "$e^x+x$"], "expl": "$(uv)'=u'v+uv'$.", "sol": "Произведение: $(uv)'=u'v+uv'$, $u=x$, $v=e^x$.\n$1\\cdot e^x+x\\cdot e^x=e^x(x+1)$."}, {"t": "s", "topic": "m10", "q": "Найдите производную $f(x)=\\ln 3x$.", "code": null, "opts": ["$\\frac{1}{x}$", "$\\frac{3}{x}$", "$\\frac{1}{3x}$", "$\\ln 3$"], "expl": "$\\frac{3}{3x}$.", "sol": "$\\ln 3x=\\ln 3+\\ln x$, производная константы $\\ln 3$ равна 0.\n$(\\ln x)'=\\frac{1}{x}$. Или: $(\\ln 3x)'=\\frac{1}{3x}\\cdot 3=\\frac{1}{x}$."}, {"t": "s", "topic": "m10", "q": "Значение производной $f(x)=\\sqrt{x}$ в точке $x=4$:", "code": null, "opts": ["$\\frac{1}{4}$", "$\\frac{1}{2}$", "2", "$\\frac{1}{8}$"], "expl": "$\\frac{1}{2\\sqrt{4}}$.", "sol": "$(\\sqrt{x})'=\\frac{1}{2\\sqrt{x}}$.\n$f'(4)=\\frac{1}{2\\cdot 2}=\\frac{1}{4}$."}, {"t": "s", "topic": "m10", "q": "Точка минимума функции $f(x)=x^3-3x$:", "code": null, "opts": ["1", "$-1$", "0", "3"], "expl": "$f'$ меняет знак с − на + в $x=1$.", "sol": "$f'(x)=3x^2-3=0$ → $x=\\pm 1$.\nЗнаки $f'$: при $x\\lt -1$ «+», на $(-1;1)$ «−», при $x\\gt 1$ «+».\nСмена «−» на «+» — минимум: $x=1$. (В $x=-1$ — максимум.)"}, {"t": "s", "topic": "m10", "q": "Наибольшее значение $f(x)=x^3-3x$ на отрезке $[0;2]$:", "code": null, "opts": ["2", "0", "$-2$", "4"], "expl": "$f(0)=0$, $f(1)=-2$, $f(2)=2$.", "sol": "Критические точки: $f'(x)=3x^2-3=0$, $x=\\pm 1$; на $[0;2]$ только $x=1$.\nЗначения: $f(0)=0$, $f(1)=1-3=-2$, $f(2)=8-6=2$.\nНаибольшее — 2."}, {"t": "s", "topic": "m10", "q": "Уравнение касательной к $y=x^2$ в точке $x_0=3$:", "code": null, "opts": ["$y=6x-9$", "$y=6x+9$", "$y=3x$", "$y=9x-18$"], "expl": "$y=9+6(x-3)$.", "sol": "$f(x_0)=f(3)=9$, $f'(x)=2x$, $f'(3)=6$.\n$y=f(x_0)+f'(x_0)(x-x_0)=9+6(x-3)=6x-9$."}, {"t": "s", "topic": "m10", "q": "Угловой коэффициент касательной к $y=x^3-2x$ в точке $x_0=2$:", "code": null, "opts": ["10", "4", "12", "8"], "expl": "$3x^2-2=10$.", "sol": "Угловой коэффициент касательной $k=f'(x_0)$.\n$f'(x)=3x^2-2$, $f'(2)=12-2=10$."}, {"t": "s", "topic": "m10", "q": "Точка движется по закону $s(t)=t^3-2t$ (м). Скорость при $t=2$ с:", "code": null, "opts": ["10 м/с", "4 м/с", "12 м/с", "6 м/с"], "expl": "$v=3t^2-2$.", "sol": "Скорость — производная пути: $v(t)=s'(t)=3t^2-2$.\n$v(2)=12-2=10$ м/с."}, {"t": "s", "topic": "m10", "q": "Промежуток возрастания функции $f(x)=x^2-4x+1$:", "code": null, "opts": ["$[2;+\\infty)$", "$(-\\infty;2]$", "$[-2;+\\infty)$", "$(-\\infty;+\\infty)$"], "expl": "$f'=2x-4\\ge 0$.", "sol": "$f'(x)=2x-4\\ge 0$ → $x\\ge 2$.\nФункция возрастает на $[2;+\\infty)$ (вершина параболы в $x=2$)."}, {"t": "s", "topic": "m10", "q": "Первообразная функции $f(x)=3x^2$:", "code": null, "opts": ["$x^3+C$", "$6x+C$", "$\\frac{x^3}{3}+C$", "$3x^3+C$"], "expl": "$\\int x^n\\,dx$.", "sol": "Первообразная $F$ — такая, что $F'=f$. $\\int x^n\\,dx=\\frac{x^{n+1}}{n+1}$.\n$\\int 3x^2\\,dx=3\\cdot\\frac{x^3}{3}=x^3+C$. Проверка: $(x^3)'=3x^2$ ✓."}, {"t": "s", "topic": "m10", "q": "Первообразная функции $f(x)=\\cos x-2x$:", "code": null, "opts": ["$\\sin x-x^2+C$", "$-\\sin x-x^2+C$", "$\\sin x-2+C$", "$-\\sin x-2x^2+C$"], "expl": "$\\int\\cos x\\,dx=\\sin x+C$.", "sol": "$\\int\\cos x\\,dx=\\sin x$, $\\int 2x\\,dx=x^2$.\n$F(x)=\\sin x-x^2+C$."}, {"t": "s", "topic": "m10", "q": "Первообразная функции $f(x)=\\frac{1}{\\sqrt{x}}$:", "code": null, "opts": ["$2\\sqrt{x}+C$", "$\\frac{\\sqrt{x}}{2}+C$", "$-\\frac{1}{2x\\sqrt{x}}+C$", "$\\sqrt{x}+C$"], "expl": "$x^{-\\frac{1}{2}}\\to 2x^{\\frac{1}{2}}$.", "sol": "$\\frac{1}{\\sqrt{x}}=x^{-\\frac{1}{2}}$. $\\int x^{-\\frac{1}{2}}\\,dx=\\frac{x^{\\frac{1}{2}}}{\\frac{1}{2}}=2\\sqrt{x}+C$."}, {"t": "s", "topic": "m10", "q": "Вычислите $\\int_{0}^{2}(3x^2+1)\\,dx$.", "code": null, "opts": ["10", "8", "12", "14"], "expl": "$\\left.(x^3+x)\\right|_0^2=10$.", "sol": "Первообразная: $F(x)=x^3+x$.\n$\\int_{0}^{2}=F(2)-F(0)=(8+2)-0=10$."}, {"t": "s", "topic": "m10", "q": "Вычислите $\\int_{1}^{3}2x\\,dx$.", "code": null, "opts": ["8", "9", "4", "6"], "expl": "$\\left.x^2\\right|_1^3=9-1$.", "sol": "$F(x)=x^2$. $F(3)-F(1)=9-1=8$."}, {"t": "s", "topic": "m10", "q": "Вычислите $\\int_{0}^{\\pi}\\sin x\\,dx$.", "code": null, "opts": ["2", "0", "1", "$-2$"], "expl": "$\\left.-\\cos x\\right|_0^{\\pi}=1+1$.", "sol": "$F(x)=-\\cos x$. $F(\\pi)-F(0)=-\\cos\\pi-(-\\cos 0)=-(-1)+1=2$."}, {"t": "s", "topic": "m10", "q": "Площадь фигуры, ограниченной $y=x^2$, $x=0$, $x=3$ и осью $Ox$:", "code": null, "opts": ["9", "27", "3", "6"], "expl": "$\\int_{0}^{3}x^2\\,dx=9$.", "sol": "Площадь под графиком $f\\ge 0$ = интеграл: $S=\\int_{0}^{3}x^2\\,dx=\\left.\\frac{x^3}{3}\\right|_0^3=\\frac{27}{3}=9$."}, {"t": "s", "topic": "m10", "q": "Площадь фигуры, ограниченной $y=4-x^2$ и осью $Ox$:", "code": null, "opts": ["$\\frac{32}{3}$", "$\\frac{16}{3}$", "8", "16"], "expl": "$\\int_{-2}^{2}(4-x^2)\\,dx$.", "sol": "Парабола пересекает ось $Ox$ при $4-x^2=0$, $x=\\pm 2$.\n$S=\\int_{-2}^{2}(4-x^2)\\,dx=\\left.\\left(4x-\\frac{x^3}{3}\\right)\\right|_{-2}^{2}=\\left(8-\\frac{8}{3}\\right)-\\left(-8+\\frac{8}{3}\\right)=\\frac{32}{3}$."}, {"t": "s", "topic": "m10", "q": "Область определения функции $y=\\sqrt{x-2}+\\frac{1}{x-5}$:", "code": null, "opts": ["$[2;5)\\cup(5;+\\infty)$", "$[2;+\\infty)$", "$(2;5)$", "$(5;+\\infty)$"], "expl": "$x\\ge 2$, $x\\ne 5$.", "sol": "Под корнем $\\ge 0$: $x\\ge 2$. Знаменатель $\\ne 0$: $x\\ne 5$.\n$[2;5)\\cup(5;+\\infty)$."}, {"t": "s", "topic": "m10", "q": "Область определения функции $y=\\lg(9-x^2)$:", "code": null, "opts": ["$(-3;3)$", "$[-3;3]$", "$(-\\infty;3)$", "$(-9;9)$"], "expl": "$9-x^2\\gt 0$.", "sol": "Под логарифмом строго больше нуля: $9-x^2\\gt 0$ → $x^2\\lt 9$ → $-3\\lt x\\lt 3$."}, {"t": "s", "topic": "m10", "q": "Абсцисса вершины параболы $y=x^2-6x+5$:", "code": null, "opts": ["3", "$-3$", "6", "5"], "expl": "$-\\frac{b}{2a}$.", "sol": "Абсцисса вершины $x_0=-\\frac{b}{2a}=-\\frac{-6}{2}=3$."}, {"t": "s", "topic": "m11", "q": "Два угла треугольника $47^{\\circ}$ и $68^{\\circ}$. Третий угол:", "code": null, "opts": ["$65^{\\circ}$", "$75^{\\circ}$", "$55^{\\circ}$", "$115^{\\circ}$"], "expl": "$180^{\\circ}-47^{\\circ}-68^{\\circ}$.", "sol": "Сумма углов треугольника $180^{\\circ}$: $180^{\\circ}-47^{\\circ}-68^{\\circ}=65^{\\circ}$."}, {"t": "s", "topic": "m11", "q": "Сумма внутренних углов шестиугольника:", "code": null, "opts": ["$720^{\\circ}$", "$540^{\\circ}$", "$1080^{\\circ}$", "$360^{\\circ}$"], "expl": "$180^{\\circ}(6-2)$.", "sol": "Сумма углов $n$-угольника: $180^{\\circ}(n-2)$.\n$180^{\\circ}\\cdot 4=720^{\\circ}$."}, {"t": "s", "topic": "m11", "q": "Катеты прямоугольного треугольника 6 и 8. Гипотенуза:", "code": null, "opts": ["10", "14", "12", "$\\sqrt{28}$"], "expl": "$\\sqrt{36+64}$.", "sol": "Теорема Пифагора: $c^2=6^2+8^2=36+64=100$, $c=10$."}, {"t": "s", "topic": "m11", "q": "Гипотенуза 13, катет 5. Второй катет:", "code": null, "opts": ["12", "8", "$\\sqrt{194}$", "10"], "expl": "$\\sqrt{169-25}$.", "sol": "$b^2=c^2-a^2=169-25=144$, $b=12$."}, {"t": "s", "topic": "m11", "q": "Гипотенуза 18, острый угол $30^{\\circ}$. Катет против этого угла:", "code": null, "opts": ["9", "$9\\sqrt{3}$", "6", "$18\\sqrt{3}$"], "expl": "Половина гипотенузы.", "sol": "Катет против угла $30^{\\circ}$ равен половине гипотенузы: $\\frac{18}{2}=9$."}, {"t": "s", "topic": "m11", "q": "Основания трапеции 11 и 21. Средняя линия:", "code": null, "opts": ["16", "32", "10", "5"], "expl": "$\\frac{11+21}{2}$.", "sol": "Средняя линия трапеции — полусумма оснований: $\\frac{11+21}{2}=16$."}, {"t": "s", "topic": "m11", "q": "Центральный угол $110^{\\circ}$. Вписанный угол, опирающийся на ту же дугу:", "code": null, "opts": ["$55^{\\circ}$", "$110^{\\circ}$", "$220^{\\circ}$", "$70^{\\circ}$"], "expl": "Половина центрального.", "sol": "Вписанный угол равен половине центрального, опирающегося на ту же дугу: $\\frac{110^{\\circ}}{2}=55^{\\circ}$."}, {"t": "s", "topic": "m11", "q": "Вписанный угол, опирающийся на диаметр, равен:", "code": null, "opts": ["$90^{\\circ}$", "$180^{\\circ}$", "$60^{\\circ}$", "$45^{\\circ}$"], "expl": "Свойство окружности.", "sol": "Диаметр стягивает дугу $180^{\\circ}$, вписанный угол — половина: $90^{\\circ}$."}, {"t": "s", "topic": "m11", "q": "Длина окружности радиуса 7:", "code": null, "opts": ["$14\\pi$", "$49\\pi$", "$7\\pi$", "$28\\pi$"], "expl": "$2\\pi R$.", "sol": "$C=2\\pi R=2\\pi\\cdot 7=14\\pi$."}, {"t": "s", "topic": "m11", "q": "Площадь круга диаметра 10:", "code": null, "opts": ["$25\\pi$", "$100\\pi$", "$10\\pi$", "$50\\pi$"], "expl": "$\\pi\\cdot 5^2$.", "sol": "Радиус — половина диаметра: $R=5$. $S=\\pi R^2=25\\pi$.\nОшибка: подставить диаметр вместо радиуса."}, {"t": "s", "topic": "m11", "q": "В параллелограмме один угол $70^{\\circ}$. Остальные углы:", "code": null, "opts": ["$110^{\\circ},\\ 70^{\\circ},\\ 110^{\\circ}$", "$70^{\\circ},\\ 70^{\\circ},\\ 70^{\\circ}$", "$110^{\\circ},\\ 110^{\\circ},\\ 70^{\\circ}$", "$20^{\\circ},\\ 70^{\\circ},\\ 20^{\\circ}$"], "expl": "Соседние углы в сумме $180^{\\circ}$.", "sol": "Противоположные углы параллелограмма равны, соседние в сумме $180^{\\circ}$.\nСоседний: $180^{\\circ}-70^{\\circ}=110^{\\circ}$. Углы: $70^{\\circ}$, $110^{\\circ}$, $70^{\\circ}$, $110^{\\circ}$."}, {"t": "s", "topic": "m11", "q": "Медиана, проведённая к гипотенузе 20:", "code": null, "opts": ["10", "20", "5", "$10\\sqrt{2}$"], "expl": "$\\frac{c}{2}$.", "sol": "Медиана к гипотенузе равна её половине (это радиус описанной окружности): $\\frac{20}{2}=10$."}, {"t": "s", "topic": "m11", "q": "Треугольник со сторонами 3, 4 и 8:", "code": null, "opts": ["не существует", "прямоугольный", "тупоугольный", "остроугольный"], "expl": "$3+4\\lt 8$.", "sol": "Неравенство треугольника: каждая сторона меньше суммы двух других.\n$3+4=7\\lt 8$ — не выполняется, треугольник не существует."}, {"t": "s", "topic": "m11", "q": "Диагонали ромба 6 и 8. Сторона ромба:", "code": null, "opts": ["5", "7", "10", "14"], "expl": "$\\sqrt{3^2+4^2}$.", "sol": "Диагонали ромба перпендикулярны и делятся пополам: получаем прямоугольный треугольник с катетами 3 и 4.\nСторона $=\\sqrt{3^2+4^2}=5$."}, {"t": "s", "topic": "m11", "q": "Во вписанном четырёхугольнике $\\angle A=75^{\\circ}$. Угол $C$:", "code": null, "opts": ["$105^{\\circ}$", "$75^{\\circ}$", "$115^{\\circ}$", "$285^{\\circ}$"], "expl": "$\\angle A+\\angle C=180^{\\circ}$.", "sol": "Во вписанном четырёхугольнике сумма противоположных углов $180^{\\circ}$: $\\angle C=180^{\\circ}-75^{\\circ}=105^{\\circ}$."}, {"t": "s", "topic": "m12", "q": "Площадь треугольника со сторонами 13, 14, 15:", "code": null, "opts": ["84", "42", "168", "91"], "expl": "Формула Герона, $p=21$.", "sol": "Формула Герона: $p=\\frac{13+14+15}{2}=21$.\n$S=\\sqrt{21\\cdot(21-13)(21-14)(21-15)}=\\sqrt{21\\cdot 8\\cdot 7\\cdot 6}=\\sqrt{7056}=84$."}, {"t": "s", "topic": "m12", "q": "Радиус окружности, описанной около треугольника со сторонами 26, 28, 30 см:", "code": null, "opts": ["16,25 см", "18,25 см", "17,75 см", "14,75 см"], "expl": "$S=336$; $R=\\frac{abc}{4S}$.", "sol": "Сначала площадь по Герону: $p=42$, $S=\\sqrt{42\\cdot 16\\cdot 14\\cdot 12}=\\sqrt{112896}=336$.\n$R=\\frac{abc}{4S}=\\frac{26\\cdot 28\\cdot 30}{4\\cdot 336}=\\frac{21840}{1344}=16{,}25$ см."}, {"t": "s", "topic": "m12", "q": "Радиус окружности, вписанной в треугольник со сторонами 13, 14, 15:", "code": null, "opts": ["4", "8", "6", "3"], "expl": "$r=\\frac{S}{p}=\\frac{84}{21}$.", "sol": "$S=84$, $p=21$ (Герон). Радиус вписанной окружности $r=\\frac{S}{p}=\\frac{84}{21}=4$."}, {"t": "s", "topic": "m12", "q": "Две стороны треугольника 5 и 8, угол между ними $60^{\\circ}$. Третья сторона:", "code": null, "opts": ["7", "$\\sqrt{89}$", "$\\sqrt{39}$", "9"], "expl": "$c^2=25+64-40=49$.", "sol": "Теорема косинусов: $c^2=a^2+b^2-2ab\\cos C=25+64-2\\cdot 5\\cdot 8\\cdot\\frac{1}{2}=89-40=49$.\n$c=7$."}, {"t": "s", "topic": "m12", "q": "Стороны 6 и 10, угол между ними $30^{\\circ}$. Площадь треугольника:", "code": null, "opts": ["15", "30", "$15\\sqrt{3}$", "60"], "expl": "$\\frac{1}{2}\\cdot 6\\cdot 10\\cdot\\frac{1}{2}$.", "sol": "$S=\\frac{1}{2}ab\\sin C=\\frac{1}{2}\\cdot 6\\cdot 10\\cdot\\sin 30^{\\circ}=30\\cdot\\frac{1}{2}=15$."}, {"t": "s", "topic": "m12", "q": "В треугольнике $a=10$, $\\angle A=30^{\\circ}$. Радиус описанной окружности:", "code": null, "opts": ["10", "5", "20", "$5\\sqrt{3}$"], "expl": "$\\frac{a}{\\sin A}=2R=20$.", "sol": "Теорема синусов: $\\frac{a}{\\sin A}=2R$.\n$2R=\\frac{10}{\\frac{1}{2}}=20$, $R=10$."}, {"t": "s", "topic": "m12", "q": "Основания трапеции 6 и 14, высота 5. Площадь:", "code": null, "opts": ["50", "100", "70", "40"], "expl": "$\\frac{6+14}{2}\\cdot 5$.", "sol": "$S=\\frac{a+b}{2}\\cdot h=\\frac{6+14}{2}\\cdot 5=10\\cdot 5=50$."}, {"t": "s", "topic": "m12", "q": "Площадь ромба с диагоналями 12 и 16:", "code": null, "opts": ["96", "192", "48", "28"], "expl": "$\\frac{d_1d_2}{2}$.", "sol": "Площадь ромба — половина произведения диагоналей: $\\frac{12\\cdot 16}{2}=96$."}, {"t": "s", "topic": "m12", "q": "Длина вектора $\\vec{a}(6;-8)$:", "code": null, "opts": ["10", "14", "2", "100"], "expl": "$\\sqrt{36+64}$.", "sol": "$|\\vec{a}|=\\sqrt{x^2+y^2}=\\sqrt{36+64}=\\sqrt{100}=10$."}, {"t": "s", "topic": "m12", "q": "При каком $m$ векторы $\\vec{a}(2;m)$ и $\\vec{b}(3;-6)$ перпендикулярны?", "code": null, "opts": ["1", "$-1$", "4", "$-4$"], "expl": "$6-6m=0$.", "sol": "Векторы перпендикулярны, если скалярное произведение равно 0: $2\\cdot 3+m\\cdot(-6)=0$.\n$6-6m=0$ → $m=1$."}, {"t": "s", "topic": "m12", "q": "При каком $m$ векторы $\\vec{a}(2;m)$ и $\\vec{b}(4;6)$ коллинеарны?", "code": null, "opts": ["3", "12", "$-3$", "$\\frac{4}{3}$"], "expl": "$\\frac{2}{4}=\\frac{m}{6}$.", "sol": "Коллинеарные — координаты пропорциональны: $\\frac{2}{4}=\\frac{m}{6}$.\n$m=\\frac{2\\cdot 6}{4}=3$."}, {"t": "s", "topic": "m12", "q": "Скалярное произведение $\\vec{a}(1;3)$ и $\\vec{b}(4;-2)$:", "code": null, "opts": ["$-2$", "10", "2", "$-10$"], "expl": "$4-6$.", "sol": "$\\vec{a}\\cdot\\vec{b}=x_1x_2+y_1y_2=1\\cdot 4+3\\cdot(-2)=4-6=-2$."}, {"t": "s", "topic": "m12", "q": "Середина отрезка $AB$, $A(2;-4)$, $B(6;8)$:", "code": null, "opts": ["$(4;2)$", "$(8;4)$", "$(2;6)$", "$(4;-6)$"], "expl": "Полусумма координат.", "sol": "Середина: полусумма координат. $x=\\frac{2+6}{2}=4$, $y=\\frac{-4+8}{2}=2$. Ответ $(4;2)$."}, {"t": "s", "topic": "m12", "q": "Угол между векторами $\\vec{a}(1;0)$ и $\\vec{b}(1;1)$:", "code": null, "opts": ["$45^{\\circ}$", "$30^{\\circ}$", "$60^{\\circ}$", "$90^{\\circ}$"], "expl": "$\\cos\\varphi=\\frac{1}{\\sqrt{2}}$.", "sol": "$\\cos\\varphi=\\frac{\\vec{a}\\cdot\\vec{b}}{|\\vec{a}||\\vec{b}|}=\\frac{1\\cdot 1+0\\cdot 1}{1\\cdot\\sqrt{2}}=\\frac{1}{\\sqrt{2}}=\\frac{\\sqrt{2}}{2}$.\n$\\varphi=45^{\\circ}$."}, {"t": "s", "topic": "m12", "q": "Центр и радиус окружности $(x-2)^2+(y+3)^2=16$:", "code": null, "opts": ["$(2;-3),\\ R=4$", "$(-2;3),\\ R=4$", "$(2;-3),\\ R=16$", "$(2;3),\\ R=4$"], "expl": "$(x-a)^2+(y-b)^2=R^2$.", "sol": "Уравнение $(x-a)^2+(y-b)^2=R^2$: центр $(a;b)$, радиус $R$.\n$(y+3)=(y-(-3))$ → $b=-3$. $R^2=16$, $R=4$. Центр $(2;-3)$."}, {"t": "s", "topic": "m12", "q": "Гомотетия с коэффициентом 3 увеличивает площади фигур в:", "code": null, "opts": ["9 раз", "3 раза", "6 раз", "27 раз"], "expl": "$k^2$.", "sol": "При подобии (гомотетии) с коэффициентом $k$ длины умножаются на $k$, площади — на $k^2$.\n$3^2=9$."}, {"t": "s", "topic": "m12", "q": "$AB=1$, $AC=3$. В каком промежутке лежит длина $BC$?", "code": null, "opts": ["$(2;4)$", "$[0;1]$", "$(1;3)$", "$[2;3]$"], "expl": "$3-1\\lt BC\\lt 3+1$.", "sol": "Неравенство треугольника: $|AC-AB|\\lt BC\\lt AC+AB$.\n$3-1\\lt BC\\lt 3+1$ → $BC\\in(2;4)$."}, {"t": "s", "topic": "m13", "q": "Сколько граней у додекаэдра?", "code": null, "opts": ["12", "20", "8", "10"], "expl": "Правильный 12-гранник с пятиугольными гранями.", "sol": "Додекаэдр («додека» = 12) — правильный многогранник из 12 правильных пятиугольников."}, {"t": "s", "topic": "m13", "q": "Сколько рёбер у пятиугольной призмы?", "code": null, "opts": ["15", "10", "12", "20"], "expl": "$5+5+5$.", "sol": "У пятиугольной призмы два основания по 5 рёбер и 5 боковых рёбер: $5+5+5=15$."}, {"t": "s", "topic": "m13", "q": "Сколько вершин у шестиугольной пирамиды?", "code": null, "opts": ["7", "6", "12", "8"], "expl": "$6+1$.", "sol": "6 вершин в основании и 1 вершина сверху: $6+1=7$."}, {"t": "s", "topic": "m13", "q": "Многогранник имеет 8 вершин и 12 рёбер. Число граней по формуле Эйлера:", "code": null, "opts": ["6", "4", "8", "10"], "expl": "$Г=2-8+12$.", "sol": "Формула Эйлера: $В-Р+Г=2$ → $Г=2-В+Р=2-8+12=6$ (например, куб)."}, {"t": "s", "topic": "m13", "q": "Прямые, которые не пересекаются и не лежат в одной плоскости:", "code": null, "opts": ["скрещивающиеся", "параллельные", "перпендикулярные", "совпадающие"], "expl": "Скрещивающиеся прямые.", "sol": "Скрещивающиеся прямые не пересекаются и не параллельны — через них нельзя провести одну плоскость."}, {"t": "s", "topic": "m13", "q": "Высота боковой грани правильной пирамиды называется:", "code": null, "opts": ["апофемой", "медианой", "образующей", "диагональю"], "expl": "Апофема.", "sol": "Апофема — высота боковой грани правильной пирамиды, проведённая из вершины."}, {"t": "s", "topic": "m13", "q": "Тело, полученное вращением прямоугольного треугольника вокруг катета:", "code": null, "opts": ["конус", "цилиндр", "шар", "усечённый конус"], "expl": "Конус.", "sol": "При вращении прямоугольного треугольника вокруг катета второй катет описывает круг (основание), гипотенуза — боковую поверхность. Получается конус."}, {"t": "s", "topic": "m13", "q": "Тело, полученное вращением прямоугольника вокруг стороны:", "code": null, "opts": ["цилиндр", "конус", "призма", "шар"], "expl": "Цилиндр.", "sol": "При вращении прямоугольника вокруг стороны получается цилиндр: сторона — высота, соседняя сторона — радиус."}, {"t": "s", "topic": "m13", "q": "Диагональ куба с ребром 2:", "code": null, "opts": ["$2\\sqrt{3}$", "$2\\sqrt{2}$", "4", "6"], "expl": "$a\\sqrt{3}$.", "sol": "Диагональ куба $d=a\\sqrt{3}$ (из $d^2=a^2+a^2+a^2$): $2\\sqrt{3}$."}, {"t": "s", "topic": "m13", "q": "Диагональ прямоугольного параллелепипеда с измерениями 2, 3, 6:", "code": null, "opts": ["7", "11", "$\\sqrt{13}$", "$\\sqrt{40}$"], "expl": "$\\sqrt{4+9+36}$.", "sol": "$d^2=a^2+b^2+c^2=4+9+36=49$, $d=7$."}, {"t": "s", "topic": "m13", "q": "Сколько существует видов правильных многогранников?", "code": null, "opts": ["5", "4", "6", "бесконечно много"], "expl": "Тетраэдр, куб, октаэдр, додекаэдр, икосаэдр.", "sol": "Правильных многогранников ровно пять: тетраэдр, куб, октаэдр, додекаэдр, икосаэдр."}, {"t": "s", "topic": "m14", "q": "Правильная четырёхугольная пирамида: диагональ основания $2\\sqrt{2}$, высота 3. Объём:", "code": null, "opts": ["4", "2", "3", "1"], "expl": "Сторона 2, $S_{осн}=4$, $V=\\frac{1}{3}\\cdot 4\\cdot 3$.", "sol": "В основании квадрат. Его диагональ $d=a\\sqrt{2}=2\\sqrt{2}$ → сторона $a=2$, $S_{осн}=4$.\n$V=\\frac{1}{3}S_{осн}\\cdot h=\\frac{1}{3}\\cdot 4\\cdot 3=4$."}, {"t": "s", "topic": "m14", "q": "Объём куба с ребром 3:", "code": null, "opts": ["27", "9", "54", "81"], "expl": "$a^3$.", "sol": "$V=a^3=3^3=27$."}, {"t": "s", "topic": "m14", "q": "Площадь полной поверхности куба с ребром 4:", "code": null, "opts": ["96", "64", "16", "48"], "expl": "$6a^2$.", "sol": "У куба 6 одинаковых квадратных граней: $S=6a^2=6\\cdot 16=96$."}, {"t": "s", "topic": "m14", "q": "Объём цилиндра: $R=3$, $h=5$.", "code": null, "opts": ["$45\\pi$", "$15\\pi$", "$30\\pi$", "$75\\pi$"], "expl": "$\\pi R^2h$.", "sol": "$V=\\pi R^2h=\\pi\\cdot 9\\cdot 5=45\\pi$."}, {"t": "s", "topic": "m14", "q": "Площадь боковой поверхности цилиндра: $R=2$, $h=7$.", "code": null, "opts": ["$28\\pi$", "$14\\pi$", "$56\\pi$", "$36\\pi$"], "expl": "$2\\pi Rh$.", "sol": "$S_{бок}=2\\pi Rh=2\\pi\\cdot 2\\cdot 7=28\\pi$."}, {"t": "s", "topic": "m14", "q": "Конус: $R=3$, $h=4$. Площадь боковой поверхности:", "code": null, "opts": ["$15\\pi$", "$12\\pi$", "$24\\pi$", "$9\\pi$"], "expl": "$l=5$, $\\pi Rl$.", "sol": "Образующая: $l=\\sqrt{R^2+h^2}=\\sqrt{9+16}=5$.\n$S_{бок}=\\pi Rl=\\pi\\cdot 3\\cdot 5=15\\pi$."}, {"t": "s", "topic": "m14", "q": "Конус: $R=3$, $h=4$. Объём:", "code": null, "opts": ["$12\\pi$", "$36\\pi$", "$15\\pi$", "$48\\pi$"], "expl": "$\\frac{1}{3}\\pi\\cdot 9\\cdot 4$.", "sol": "$V=\\frac{1}{3}\\pi R^2h=\\frac{1}{3}\\pi\\cdot 9\\cdot 4=12\\pi$."}, {"t": "s", "topic": "m14", "q": "Объём шара радиуса 3:", "code": null, "opts": ["$36\\pi$", "$27\\pi$", "$12\\pi$", "$108\\pi$"], "expl": "$\\frac{4}{3}\\pi\\cdot 27$.", "sol": "$V=\\frac{4}{3}\\pi R^3=\\frac{4}{3}\\pi\\cdot 27=36\\pi$."}, {"t": "s", "topic": "m14", "q": "Площадь сферы радиуса 5:", "code": null, "opts": ["$100\\pi$", "$25\\pi$", "$\\frac{500\\pi}{3}$", "$50\\pi$"], "expl": "$4\\pi R^2$.", "sol": "$S=4\\pi R^2=4\\pi\\cdot 25=100\\pi$."}, {"t": "s", "topic": "m14", "q": "Параллелепипед $2\\times 3\\times 4$. Площадь полной поверхности:", "code": null, "opts": ["52", "24", "26", "48"], "expl": "$2(6+8+12)$.", "sol": "$S=2(ab+bc+ac)=2(2\\cdot 3+3\\cdot 4+2\\cdot 4)=2(6+12+8)=52$."}, {"t": "s", "topic": "m14", "q": "Правильная треугольная призма: сторона основания 4, высота 10. Площадь боковой поверхности:", "code": null, "opts": ["120", "40", "80", "160"], "expl": "$P\\cdot h=12\\cdot 10$.", "sol": "Боковая поверхность прямой призмы: $S=P_{осн}\\cdot h$. Периметр треугольника $3\\cdot 4=12$.\n$12\\cdot 10=120$."}, {"t": "s", "topic": "m14", "q": "Объём пирамиды с площадью основания 18 и высотой 5:", "code": null, "opts": ["30", "90", "45", "15"], "expl": "$\\frac{1}{3}\\cdot 18\\cdot 5$.", "sol": "$V=\\frac{1}{3}S_{осн}\\cdot h=\\frac{1}{3}\\cdot 18\\cdot 5=30$."}, {"t": "s", "topic": "m14", "q": "Радиус шара увеличили в 2 раза. Объём:", "code": null, "opts": ["увеличится в 8 раз", "увеличится в 2 раза", "увеличится в 4 раза", "увеличится в 6 раз"], "expl": "$k^3$.", "sol": "$V=\\frac{4}{3}\\pi R^3$ — объём пропорционален кубу радиуса.\n$2^3=8$ — объём увеличится в 8 раз."}, {"t": "s", "topic": "m14", "q": "Прямая призма: основание — равнобедренная трапеция с боковой стороной 13 и основаниями 11 и 21; площадь диагонального сечения 180. Площадь полной поверхности:", "code": null, "opts": ["906", "768", "624", "1080"], "expl": "Высота трапеции 12, диагональ 20, высота призмы 9; $S=2\\cdot 192+58\\cdot 9$.", "sol": "1) Высота трапеции: $\\frac{21-11}{2}=5$, $h=\\sqrt{13^2-5^2}=12$. $S_{тр}=\\frac{11+21}{2}\\cdot 12=192$.\n2) Диагональ трапеции: $\\sqrt{(11+5)^2+12^2}=\\sqrt{400}=20$.\n3) Диагональное сечение — прямоугольник $20\\times H=180$ → $H=9$.\n4) $S_{полн}=2S_{тр}+P\\cdot H=2\\cdot 192+(11+21+13+13)\\cdot 9=384+522=906$."}, {"t": "s", "topic": "m15", "q": "Длина вектора $\\vec{AB}$, $A(1;2;3)$, $B(4;6;3)$:", "code": null, "opts": ["5", "7", "25", "$\\sqrt{13}$"], "expl": "$\\vec{AB}=(3;4;0)$.", "sol": "$\\vec{AB}=(4-1;\\ 6-2;\\ 3-3)=(3;4;0)$.\n$|\\vec{AB}|=\\sqrt{9+16+0}=5$."}, {"t": "s", "topic": "m15", "q": "Расстояние от точки $(2;-1;2)$ до начала координат:", "code": null, "opts": ["3", "9", "$\\sqrt{5}$", "5"], "expl": "$\\sqrt{4+1+4}$.", "sol": "Расстояние до начала координат — длина вектора: $\\sqrt{2^2+(-1)^2+2^2}=\\sqrt{9}=3$."}, {"t": "s", "topic": "m15", "q": "При каком $m$ векторы $\\vec{a}(1;2;-1)$ и $\\vec{b}(3;m;1)$ перпендикулярны?", "code": null, "opts": ["$-1$", "1", "2", "$-2$"], "expl": "$3+2m-1=0$.", "sol": "Перпендикулярны → скалярное произведение 0: $1\\cdot 3+2\\cdot m+(-1)\\cdot 1=0$.\n$2+2m=0$ → $m=-1$."}, {"t": "s", "topic": "m15", "q": "Скалярное произведение $\\vec{a}(2;-1;3)$ и $\\vec{b}(1;4;2)$:", "code": null, "opts": ["4", "8", "$-4$", "12"], "expl": "$2-4+6$.", "sol": "$\\vec{a}\\cdot\\vec{b}=2\\cdot 1+(-1)\\cdot 4+3\\cdot 2=2-4+6=4$."}, {"t": "s", "topic": "m15", "q": "Середина отрезка $AB$, $A(2;4;-6)$, $B(0;-2;8)$:", "code": null, "opts": ["$(1;1;1)$", "$(2;2;2)$", "$(1;3;-7)$", "$(-1;-3;7)$"], "expl": "Полусумма координат.", "sol": "Полусумма координат: $\\left(\\frac{2+0}{2};\\ \\frac{4-2}{2};\\ \\frac{-6+8}{2}\\right)=(1;1;1)$."}, {"t": "s", "topic": "m15", "q": "Точка, симметричная $A(3;-2;5)$ относительно начала координат:", "code": null, "opts": ["$(-3;2;-5)$", "$(3;2;5)$", "$(-3;-2;-5)$", "$(3;-2;-5)$"], "expl": "Все знаки меняются.", "sol": "Симметрия относительно начала координат меняет знаки всех координат: $(-3;2;-5)$."}, {"t": "s", "topic": "m15", "q": "Точка, симметричная $A(3;-2;5)$ относительно плоскости $Oxy$:", "code": null, "opts": ["$(3;-2;-5)$", "$(-3;2;5)$", "$(3;2;5)$", "$(-3;-2;5)$"], "expl": "Меняется $z$.", "sol": "Симметрия относительно плоскости $Oxy$ меняет только знак $z$: $(3;-2;-5)$."}, {"t": "s", "topic": "m15", "q": "Центр и радиус сферы $(x-1)^2+y^2+(z+2)^2=9$:", "code": null, "opts": ["$(1;0;-2),\\ R=3$", "$(-1;0;2),\\ R=3$", "$(1;0;-2),\\ R=9$", "$(1;0;2),\\ R=3$"], "expl": "Уравнение сферы.", "sol": "$(x-a)^2+(y-b)^2+(z-c)^2=R^2$: $a=1$, $b=0$, $c=-2$ (так как $z+2=z-(-2)$), $R=\\sqrt{9}=3$."}, {"t": "s", "topic": "m15", "q": "При каких $m$ и $n$ векторы $\\vec{a}(2;m;6)$ и $\\vec{b}(1;2;n)$ коллинеарны?", "code": null, "opts": ["$m=4,\\ n=3$", "$m=2,\\ n=6$", "$m=1,\\ n=12$", "$m=4,\\ n=12$"], "expl": "$\\frac{2}{1}=\\frac{m}{2}=\\frac{6}{n}$.", "sol": "Коллинеарные — координаты пропорциональны: $\\frac{2}{1}=\\frac{m}{2}=\\frac{6}{n}$.\n$m=4$, $n=3$."}, {"t": "s", "topic": "m15", "q": "Угол между векторами $\\vec{a}(1;1;0)$ и $\\vec{b}(0;1;1)$:", "code": null, "opts": ["$60^{\\circ}$", "$45^{\\circ}$", "$90^{\\circ}$", "$30^{\\circ}$"], "expl": "$\\cos\\varphi=\\frac{1}{2}$.", "sol": "$\\vec{a}\\cdot\\vec{b}=0+1+0=1$, $|\\vec{a}|=|\\vec{b}|=\\sqrt{2}$.\n$\\cos\\varphi=\\frac{1}{\\sqrt{2}\\cdot\\sqrt{2}}=\\frac{1}{2}$ → $\\varphi=60^{\\circ}$."}, {"t": "m", "topic": "m1", "q": "Выберите выражения, равные 4.", "code": null, "opts": ["$\\sqrt{16}$", "$8^{\\frac{2}{3}}$", "$2^2$", "$16^{\\frac{1}{4}}$", "$4^{-1}$", "$\\sqrt{8}$"], "ans": ["$\\sqrt{16}$", "$8^{\\frac{2}{3}}$", "$2^2$"], "expl": "$16^{\\frac{1}{4}}=2$.", "sol": "$\\sqrt{16}=4$ ✓; $8^{\\frac{2}{3}}=(\\sqrt[3]{8})^2=4$ ✓; $2^2=4$ ✓.\nНеверные: $16^{\\frac{1}{4}}=2$; $4^{-1}=\\frac{1}{4}$; $\\sqrt{8}=2\\sqrt{2}\\approx 2{,}83$."}, {"t": "m", "topic": "m2", "q": "Выберите выражения, равные $\\frac{1}{2}$.", "code": null, "opts": ["$\\sin 30^{\\circ}$", "$\\cos 60^{\\circ}$", "$\\sin 150^{\\circ}$", "$\\cos 30^{\\circ}$", "$\\tg 30^{\\circ}$", "$\\sin 60^{\\circ}$"], "ans": ["$\\sin 30^{\\circ}$", "$\\cos 60^{\\circ}$", "$\\sin 150^{\\circ}$"], "expl": "Табличные значения.", "sol": "$\\sin 30^{\\circ}=\\frac{1}{2}$, $\\cos 60^{\\circ}=\\frac{1}{2}$, $\\sin 150^{\\circ}=\\sin 30^{\\circ}=\\frac{1}{2}$.\nНеверные: $\\cos 30^{\\circ}=\\frac{\\sqrt{3}}{2}$, $\\tg 30^{\\circ}=\\frac{\\sqrt{3}}{3}$, $\\sin 60^{\\circ}=\\frac{\\sqrt{3}}{2}$."}, {"t": "m", "topic": "m2", "q": "Выберите чётные функции.", "code": null, "opts": ["$y=\\cos x$", "$y=x^2$", "$y=\\sin x$", "$y=\\tg x$", "$y=x^3$", "$y=x+1$"], "ans": ["$y=\\cos x$", "$y=x^2$"], "expl": "$f(-x)=f(x)$.", "sol": "Чётная функция: $f(-x)=f(x)$. $\\cos(-x)=\\cos x$ ✓, $(-x)^2=x^2$ ✓.\n$\\sin x$, $\\tg x$, $x^3$ — нечётные; $x+1$ — ни чётная, ни нечётная."}, {"t": "m", "topic": "m3", "q": "Выберите тождества.", "code": null, "opts": ["$a^2-b^2=(a-b)(a+b)$", "$(a-b)^2=a^2-2ab+b^2$", "$a^3+b^3=(a+b)(a^2-ab+b^2)$", "$(a+b)^2=a^2+b^2$", "$a^3-b^3=(a-b)^3$", "$(a-b)^2=a^2-b^2$"], "ans": ["$a^2-b^2=(a-b)(a+b)$", "$(a-b)^2=a^2-2ab+b^2$", "$a^3+b^3=(a+b)(a^2-ab+b^2)$"], "expl": "Формулы сокращённого умножения.", "sol": "Верны формулы разности квадратов, квадрата разности и суммы кубов.\nОшибки: $(a+b)^2=a^2+2ab+b^2$, а не $a^2+b^2$; $a^3-b^3\\ne(a-b)^3$; $(a-b)^2\\ne a^2-b^2$."}, {"t": "m", "topic": "m4", "q": "Выберите корни уравнения $x^3-x^2-6x=0$.", "code": null, "opts": ["0", "3", "$-2$", "2", "$-3$", "6"], "ans": ["0", "3", "$-2$"], "expl": "$x(x^2-x-6)=0$.", "sol": "Вынесем $x$: $x(x^2-x-6)=0$. $x=0$ или $x^2-x-6=0$ → $x=3$, $x=-2$."}, {"t": "m", "topic": "m5", "q": "Выберите корни уравнения $\\cos 2x=1$ на отрезке $[0;2\\pi]$.", "code": null, "opts": ["0", "$\\pi$", "$2\\pi$", "$\\frac{\\pi}{2}$", "$\\frac{3\\pi}{2}$", "$\\frac{\\pi}{4}$"], "ans": ["0", "$\\pi$", "$2\\pi$"], "expl": "$x=\\pi n$.", "sol": "$\\cos 2x=1$ → $2x=2\\pi n$ → $x=\\pi n$.\nНа $[0;2\\pi]$: $0$, $\\pi$, $2\\pi$."}, {"t": "m", "topic": "m6", "q": "Выберите выражения, равные 3.", "code": null, "opts": ["$\\log_2 8$", "$\\lg 1000$", "$\\log_3 27$", "$\\log_3 9$", "$\\ln e^2$", "$\\log_2 9$"], "ans": ["$\\log_2 8$", "$\\lg 1000$", "$\\log_3 27$"], "expl": "$2^3$, $10^3$, $3^3$.", "sol": "$\\log_2 8=3$ ($2^3=8$), $\\lg 1000=3$, $\\log_3 27=3$.\nНеверные: $\\log_3 9=2$, $\\ln e^2=2$, $\\log_2 9\\approx 3{,}17$."}, {"t": "m", "topic": "m7", "q": "Выберите решения системы $x^2-y^2=16$, $x+y=8$.", "code": null, "opts": ["$(5;3)$", "$(3;5)$", "$(4;0)$", "$(6;2)$", "$(-5;-3)$", "$(8;0)$"], "ans": ["$(5;3)$"], "expl": "$x-y=2$.", "sol": "$x^2-y^2=(x-y)(x+y)=16$, $x+y=8$ → $x-y=2$.\n$x=5$, $y=3$ — единственное решение."}, {"t": "m", "topic": "m8", "q": "Выберите целые решения неравенства $(x+2)(x-3)\\lt 0$.", "code": null, "opts": ["$-1$", "0", "2", "$-2$", "3", "4"], "ans": ["$-1$", "0", "2"], "expl": "$(-2;3)$.", "sol": "$(x+2)(x-3)\\lt 0$ между корнями: $-2\\lt x\\lt 3$.\nЦелые: $-1,0,1,2$. Из вариантов: $-1$, $0$, $2$. Числа $-2$ и $3$ дают 0 — не подходят (знак строгий)."}, {"t": "m", "topic": "m9", "q": "Арифметическая прогрессия: $a_2=18$, $a_5=39$. Найдите $a_1$, $a_3$, $a_4$.", "code": null, "opts": ["11", "25", "32", "12", "33", "24"], "ans": ["11", "25", "32"], "expl": "$d=7$.", "sol": "$a_5-a_2=3d=39-18=21$ → $d=7$.\n$a_1=18-7=11$, $a_3=25$, $a_4=32$."}, {"t": "m", "topic": "m10", "q": "Выберите первообразные функции $f(x)=2x$.", "code": null, "opts": ["$x^2+5$", "$x^2$", "$x^2-1$", "2", "$2x^2$", "$\\frac{x^2}{2}$"], "ans": ["$x^2+5$", "$x^2$", "$x^2-1$"], "expl": "$(x^2+C)'=2x$.", "sol": "Первообразная $2x$: $x^2+C$ при любом $C$. Подходят $x^2+5$, $x^2$, $x^2-1$.\n$(2x^2)'=4x$, $\\left(\\frac{x^2}{2}\\right)'=x$, $2'=0$ — не подходят."}, {"t": "m", "topic": "m11", "q": "Выберите верные свойства прямоугольника.", "code": null, "opts": ["диагонали равны", "все углы прямые", "диагонали делятся точкой пересечения пополам", "диагонали всегда перпендикулярны", "все стороны всегда равны", "диагонали — биссектрисы углов"], "ans": ["диагонали равны", "все углы прямые", "диагонали делятся точкой пересечения пополам"], "expl": "Перпендикулярность — у ромба.", "sol": "У прямоугольника все углы прямые, диагонали равны и делятся пополам.\nПерпендикулярные диагонали и равные стороны — признаки ромба/квадрата, а не любого прямоугольника."}, {"t": "m", "topic": "m12", "q": "Выберите векторы, перпендикулярные вектору $\\vec{a}(3;4)$.", "code": null, "opts": ["$(4;-3)$", "$(-8;6)$", "$(3;4)$", "$(4;3)$", "$(-3;-4)$", "$(1;1)$"], "ans": ["$(4;-3)$", "$(-8;6)$"], "expl": "Скалярное произведение равно 0.", "sol": "Перпендикулярность: $3x+4y=0$. $(4;-3)$: $12-12=0$ ✓; $(-8;6)$: $-24+24=0$ ✓.\nОстальные дают ненулевое произведение."}, {"t": "m", "topic": "m13", "q": "Выберите правильные многогранники.", "code": null, "opts": ["тетраэдр", "октаэдр", "икосаэдр", "пятиугольная призма", "конус", "четырёхугольная пирамида"], "ans": ["тетраэдр", "октаэдр", "икосаэдр"], "expl": "Все грани — равные правильные многоугольники.", "sol": "Правильные многогранники: тетраэдр, куб, октаэдр, додекаэдр, икосаэдр.\nПризма и пирамида в общем случае не правильные; конус — не многогранник."}, {"t": "m", "topic": "m14", "q": "Конус: образующая 10, высота 8. Выберите верные значения.", "code": null, "opts": ["$R=6$", "$S_{бок}=60\\pi$", "$V=96\\pi$", "$R=4$", "$S_{бок}=80\\pi$", "$V=288\\pi$"], "ans": ["$R=6$", "$S_{бок}=60\\pi$", "$V=96\\pi$"], "expl": "$R=\\sqrt{100-64}=6$.", "sol": "$R=\\sqrt{l^2-h^2}=\\sqrt{100-64}=6$.\n$S_{бок}=\\pi Rl=60\\pi$; $V=\\frac{1}{3}\\pi\\cdot 36\\cdot 8=96\\pi$."}, {"t": "m", "topic": "m15", "q": "Выберите векторы длины 3.", "code": null, "opts": ["$(1;2;2)$", "$(0;3;0)$", "$(2;1;-2)$", "$(1;1;1)$", "$(3;3;3)$", "$(2;2;2)$"], "ans": ["$(1;2;2)$", "$(0;3;0)$", "$(2;1;-2)$"], "expl": "$\\sqrt{9}=3$.", "sol": "Длина $\\sqrt{x^2+y^2+z^2}=3$, то есть $x^2+y^2+z^2=9$.\n$1+4+4=9$ ✓, $0+9+0=9$ ✓, $4+1+4=9$ ✓. Остальные: $3$, $27$, $12$."}, {"t": "x", "topic": "m1", "q": "Установите соответствие между выражением и значением.", "left": ["$\\sqrt{49\\cdot 4}$", "$125^{\\frac{1}{3}}$"], "right": ["14", "5", "28", "25"], "ans": ["14", "5"], "expl": "$\\sqrt{196}=14$; $\\sqrt[3]{125}=5$.", "sol": "$\\sqrt{49\\cdot 4}=7\\cdot 2=14$; $125^{\\frac{1}{3}}=\\sqrt[3]{125}=5$."}, {"t": "x", "topic": "m2", "q": "Функция $y=4\\cos 2x+7$. Установите соответствие.", "left": ["Множество значений", "Наименьший положительный период"], "right": ["$[3;11]$", "$\\pi$", "$2\\pi$", "$[-4;4]$"], "ans": ["$[3;11]$", "$\\pi$"], "expl": "$7\\pm 4$; $\\frac{2\\pi}{2}=\\pi$.", "sol": "$-1\\le\\cos 2x\\le 1$ → $-4\\le 4\\cos 2x\\le 4$ → $3\\le y\\le 11$.\nПериод $\\frac{2\\pi}{k}=\\frac{2\\pi}{2}=\\pi$."}, {"t": "x", "topic": "m2", "q": "Установите соответствие между выражением и значением.", "left": ["$\\sin\\frac{\\pi}{2}$", "$\\cos\\pi$"], "right": ["1", "$-1$", "0", "$\\frac{\\sqrt{2}}{2}$"], "ans": ["1", "$-1$"], "expl": "Табличные значения.", "sol": "$\\sin\\frac{\\pi}{2}=\\sin 90^{\\circ}=1$; $\\cos\\pi=\\cos 180^{\\circ}=-1$."}, {"t": "x", "topic": "m3", "q": "Выражение $(a+b)^2-(a-b)^2$ при $a=3$, $b=0{,}5$. Установите соответствие.", "left": ["Упрощённый вид", "Значение"], "right": ["$4ab$", "6", "$2a^2+2b^2$", "9"], "ans": ["$4ab$", "6"], "expl": "$4\\cdot 3\\cdot 0{,}5=6$.", "sol": "$(a+b)^2-(a-b)^2=4ab$ (разность квадратов: $2b\\cdot 2a$).\nПри $a=3$, $b=0{,}5$: $4\\cdot 3\\cdot 0{,}5=6$."}, {"t": "x", "topic": "m4", "q": "Уравнение $|x-3|=17$. Установите соответствие.", "left": ["Сумма корней", "Произведение корней"], "right": ["6", "$-280$", "20", "$-14$"], "ans": ["6", "$-280$"], "expl": "$x=20$ и $x=-14$.", "sol": "$x-3=17$ → $x=20$; $x-3=-17$ → $x=-14$.\nСумма $20+(-14)=6$, произведение $20\\cdot(-14)=-280$."}, {"t": "x", "topic": "m5", "q": "Установите соответствие между уравнением и решением.", "left": ["$\\sin x=0$", "$\\cos x=1$"], "right": ["$\\pi n$", "$2\\pi n$", "$\\frac{\\pi}{2}+\\pi n$", "$\\pi+2\\pi n$"], "ans": ["$\\pi n$", "$2\\pi n$"], "expl": "Частные случаи.", "sol": "$\\sin x=0$ → $x=\\pi n$; $\\cos x=1$ → $x=2\\pi n$."}, {"t": "x", "topic": "m6", "q": "Установите соответствие между выражением и значением.", "left": ["$\\log_2\\frac{1}{8}$", "$\\log_9 3$"], "right": ["$-3$", "$\\frac{1}{2}$", "3", "2"], "ans": ["$-3$", "$\\frac{1}{2}$"], "expl": "$2^{-3}$; $9^{\\frac{1}{2}}$.", "sol": "$\\frac{1}{8}=2^{-3}$ → $\\log_2\\frac{1}{8}=-3$. $3=9^{\\frac{1}{2}}$ → $\\log_9 3=\\frac{1}{2}$."}, {"t": "x", "topic": "m7", "q": "Система $x-y=1$, $xy=12$. Установите соответствие.", "left": ["Наибольшее значение x", "Наименьшее значение y"], "right": ["4", "$-4$", "3", "$-3$"], "ans": ["4", "$-4$"], "expl": "Решения $(4;3)$ и $(-3;-4)$.", "sol": "$x=y+1$: $(y+1)y=12$ → $y^2+y-12=0$ → $y=3$ или $y=-4$.\nРешения $(4;3)$ и $(-3;-4)$: наибольшее $x=4$, наименьшее $y=-4$."}, {"t": "x", "topic": "m8", "q": "Неравенство $x^2-9\\le 0$. Установите соответствие.", "left": ["Множество решений", "Количество целых решений"], "right": ["$[-3;3]$", "7", "$(-3;3)$", "6"], "ans": ["$[-3;3]$", "7"], "expl": "$-3,\\ldots,3$.", "sol": "$x^2\\le 9$ → $-3\\le x\\le 3$.\nЦелые: $-3,-2,-1,0,1,2,3$ — 7 чисел."}, {"t": "x", "topic": "m9", "q": "Бесконечно убывающая геометрическая прогрессия: сумма 4, сумма кубов членов 192. Установите соответствие.", "left": ["Первый член", "Знаменатель"], "right": ["6", "$-0{,}5$", "2", "0,5"], "ans": ["6", "$-0{,}5$"], "expl": "$\\frac{b_1}{1-q}=4$, $\\frac{b_1^3}{1-q^3}=192$.", "sol": "$\\frac{b_1}{1-q}=4$ и $\\frac{b_1^3}{1-q^3}=192$. Возведём первое в куб и разделим на второе:\n$\\frac{1-q^3}{(1-q)^3}=\\frac{64}{192}=\\frac{1}{3}$ → $\\frac{1+q+q^2}{(1-q)^2}=\\frac{1}{3}$ → $2q^2+5q+2=0$ → $q=-\\frac{1}{2}$ ($|q|\\lt 1$).\n$b_1=4(1-q)=4\\cdot 1{,}5=6$."}, {"t": "x", "topic": "m9", "q": "Арифметическая прогрессия: $a_1=5$, $d=3$. Установите соответствие.", "left": ["$a_{11}$", "$S_{10}$"], "right": ["35", "185", "32", "170"], "ans": ["35", "185"], "expl": "$5+30=35$; $\\frac{(5+32)\\cdot 10}{2}=185$.", "sol": "$a_{11}=a_1+10d=5+30=35$.\n$a_{10}=5+27=32$, $S_{10}=\\frac{(5+32)\\cdot 10}{2}=185$."}, {"t": "x", "topic": "m10", "q": "$f(x)=x^2-4x$. Установите соответствие.", "left": ["$f'(3)$", "Точка минимума"], "right": ["2", "$x=2$", "$-4$", "$x=-2$"], "ans": ["2", "$x=2$"], "expl": "$f'=2x-4$.", "sol": "$f'(x)=2x-4$, $f'(3)=2$.\n$f'(x)=0$ при $x=2$; слева $f'\\lt 0$, справа $\\gt 0$ — минимум в $x=2$."}, {"t": "x", "topic": "m10", "q": "Установите соответствие между интегралом и значением.", "left": ["$\\int_{0}^{1}3x^2\\,dx$", "$\\int_{0}^{1}(2x+1)\\,dx$"], "right": ["1", "2", "3", "$\\frac{1}{2}$"], "ans": ["1", "2"], "expl": "$\\left.x^3\\right|_0^1$; $\\left.(x^2+x)\\right|_0^1$.", "sol": "$\\int_{0}^{1}3x^2\\,dx=\\left.x^3\\right|_0^1=1$.\n$\\int_{0}^{1}(2x+1)\\,dx=\\left.(x^2+x)\\right|_0^1=2$."}, {"t": "x", "topic": "m11", "q": "Установите соответствие между многоугольником и суммой внутренних углов.", "left": ["Пятиугольник", "Восьмиугольник"], "right": ["$540^{\\circ}$", "$1080^{\\circ}$", "$720^{\\circ}$", "$900^{\\circ}$"], "ans": ["$540^{\\circ}$", "$1080^{\\circ}$"], "expl": "$180^{\\circ}(n-2)$.", "sol": "$180^{\\circ}(n-2)$: пятиугольник $180^{\\circ}\\cdot 3=540^{\\circ}$, восьмиугольник $180^{\\circ}\\cdot 6=1080^{\\circ}$."}, {"t": "x", "topic": "m12", "q": "Треугольник со сторонами 5, 12, 13. Установите соответствие.", "left": ["Площадь", "Радиус описанной окружности"], "right": ["30", "6,5", "60", "2"], "ans": ["30", "6,5"], "expl": "Прямоугольный: $S=30$, $R=\\frac{13}{2}$.", "sol": "$5^2+12^2=169=13^2$ — треугольник прямоугольный.\n$S=\\frac{1}{2}\\cdot 5\\cdot 12=30$; $R=\\frac{c}{2}=\\frac{13}{2}=6{,}5$."}, {"t": "x", "topic": "m13", "q": "Пятиугольная пирамида. Установите соответствие.", "left": ["Число рёбер", "Число граней"], "right": ["10", "6", "5", "15"], "ans": ["10", "6"], "expl": "5 рёбер основания и 5 боковых; 5 боковых граней и основание.", "sol": "Рёбра: 5 в основании + 5 боковых = 10. Грани: 5 боковых + основание = 6."}, {"t": "x", "topic": "m14", "q": "Цилиндр: $R=4$, $h=6$. Установите соответствие.", "left": ["Объём", "Площадь полной поверхности"], "right": ["$96\\pi$", "$80\\pi$", "$48\\pi$", "$64\\pi$"], "ans": ["$96\\pi$", "$80\\pi$"], "expl": "$\\pi\\cdot 16\\cdot 6$; $2\\pi\\cdot 4\\cdot(4+6)$.", "sol": "$V=\\pi R^2h=\\pi\\cdot 16\\cdot 6=96\\pi$.\n$S_{полн}=2\\pi R(R+h)=2\\pi\\cdot 4\\cdot 10=80\\pi$."}, {"t": "x", "topic": "m15", "q": "$A(1;-2;3)$, $B(3;0;2)$. Установите соответствие.", "left": ["$|\\vec{AB}|$", "Середина AB"], "right": ["3", "$(2;-1;2{,}5)$", "$\\sqrt{17}$", "$(4;-2;5)$"], "ans": ["3", "$(2;-1;2{,}5)$"], "expl": "$\\vec{AB}=(2;2;-1)$.", "sol": "$\\vec{AB}=(2;2;-1)$, $|\\vec{AB}|=\\sqrt{4+4+1}=3$.\nСередина: $\\left(\\frac{1+3}{2};\\ \\frac{-2+0}{2};\\ \\frac{3+2}{2}\\right)=(2;-1;2{,}5)$."}];
const MC=[{"id": "mc1", "topic": "m14", "title": "Алтыбақан", "kind": "Задача из жизни", "text": "Алтыбақан ставят из шести брёвен (по три с каждой стороны), сверху их соединяет перекладина. Все брёвна — цилиндры диаметром 14 см. Длина каждого из шести наклонных брёвен 4 м, перекладины — 3 м. На двух верёвках подвешена доска длиной b = 2,5 м и шириной a = 0,3 м.", "code": null, "qs": [{"q": "Площадь доски:", "opts": ["$0{,}75\\ м^2$", "$0{,}52\\ м^2$", "$0{,}65\\ м^2$", "$2{,}8\\ м^2$"], "expl": "$a\\cdot b=0{,}3\\cdot 2{,}5$.", "sol": "Доска — прямоугольник: $S=a\\cdot b=0{,}3\\cdot 2{,}5=0{,}75\\ м^2$."}, {"q": "Сколько метров брёвен нужно?", "opts": ["27 м", "24 м", "30 м", "21 м"], "expl": "$6\\cdot 4+3$.", "sol": "Шесть наклонных брёвен по 4 м и одна перекладина 3 м: $6\\cdot 4+3=27$ м."}, {"q": "Радиус бревна:", "opts": ["7 см", "14 см", "3,5 см", "28 см"], "expl": "$\\frac{d}{2}$.", "sol": "Радиус — половина диаметра: $\\frac{14}{2}=7$ см."}, {"q": "Объём одного наклонного бревна ($\\pi\\approx 3{,}14$), с округлением до сотых:", "opts": ["$0{,}06\\ м^3$", "$0{,}62\\ м^3$", "$0{,}25\\ м^3$", "$0{,}02\\ м^3$"], "expl": "$\\pi\\cdot 0{,}07^2\\cdot 4\\approx 0{,}0615$.", "sol": "Бревно — цилиндр: $V=\\pi R^2h$, $R=7$ см $=0{,}07$ м, $h=4$ м.\n$V=3{,}14\\cdot 0{,}0049\\cdot 4\\approx 0{,}0615\\approx 0{,}06\\ м^3$. Важно перевести сантиметры в метры."}, {"q": "80 см бревна весят 2 кг. Масса всех брёвен:", "opts": ["67,5 кг", "72,5 кг", "54 кг", "60 кг"], "expl": "$\\frac{2700}{80}\\cdot 2$.", "sol": "Всего 27 м $=2700$ см. На 80 см приходится 2 кг: $\\frac{2700}{80}\\cdot 2=33{,}75\\cdot 2=67{,}5$ кг."}]}, {"id": "mc2", "topic": "m9", "title": "Накопления на ноутбук", "kind": "Задача из жизни", "text": "Айдана в первый месяц отложила 20 000 тенге и каждый следующий месяц откладывает на 5 000 тенге больше. Её брат положил 100 000 тенге на депозит под 10% годовых с ежегодной капитализацией.", "code": null, "qs": [{"q": "Сколько Айдана отложит в 6-й месяц?", "opts":
