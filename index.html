pic": "ml3", "lvl": "A", "q": "Куртка стоила 24 000 тг. Во время распродажи её цену снизили на 25%. Сколько стоит куртка теперь?", "opts": ["18000 тг", "6000 тг", "21600 тг", "19000 тг"], "expl": "24 000 − 6000 = 18 000 тг.", "sol": "25% от 24 000 = 6000 тг.\n24 000 − 6000 = 18 000 тг."}, {"t": "s", "topic": "ml3", "lvl": "B", "q": "Цену товара сначала повысили на 10%, а потом понизили на 10%. Как изменилась цена по сравнению с первоначальной?", "opts": ["уменьшилась на 1%", "не изменилась", "увеличилась на 1%", "уменьшилась на 10%"], "expl": "Цена уменьшилась на 1%.", "sol": "Цена × 1,1 × 0,9 = цена × 0,99.\nЦена уменьшилась на 1%."}, {"t": "s", "topic": "ml3", "lvl": "A", "q": "В классе 25 учеников, 9 из них занимаются спортом. Сколько процентов учеников занимаются спортом?", "opts": ["36%", "9%", "25%", "34%"], "expl": "9 : 25 · 100% = 36%.", "sol": "9 : 25 · 100% = 36%."}, {"t": "s", "topic": "ml3", "lvl": "C", "q": "На депозит положили 200 000 тг под 12% годовых с ежегодным начислением процентов на накопленную сумму. Какая сумма будет через 2 года?", "opts": ["250880 тг", "248000 тг", "224000 тг", "251200 тг"], "expl": "2-й год: 224 000 · 1,12 = 250 880 тг.", "sol": "1-й год: 200 000 · 1,12 = 224 000 тг.\n2-й год: 224 000 · 1,12 = 250 880 тг."}, {"t": "s", "topic": "ml3", "lvl": "B", "q": "На круговой диаграмме расходы семьи: продукты — 40%, жильё — 25%, транспорт — 15%, остальное — 20%. Месячный доход семьи 450 000 тг. Сколько тенге тратится на транспорт?", "opts": ["67500 тг", "90000 тг", "112500 тг", "45000 тг"], "expl": "15% от 450 000 = 0,15 · 450 000 = 67 500 тг.", "sol": "15% от 450 000 = 0,15 · 450 000 = 67 500 тг."}, {"t": "s", "topic": "ml3", "lvl": "B", "q": "На круговой диаграмме сектор «Спорт» занимает 25% круга. Чему равен центральный угол этого сектора?", "opts": ["90°", "25°", "45°", "100°"], "expl": "25% от 360° = 90°.", "sol": "Весь круг — 360°.\n25% от 360° = 90°."}, {"t": "s", "topic": "ml3", "lvl": "A", "q": "По столбчатой диаграмме: в январе продано 120 велосипедов, в феврале — 150. На сколько процентов выросли продажи?", "opts": ["25%", "30%", "20%", "15%"], "expl": "30 : 120 · 100% = 25%.", "sol": "Рост: 150 − 120 = 30.\n30 : 120 · 100% = 25%."}, {"t": "s", "topic": "ml4", "lvl": "A", "q": "Оценки ученика за неделю: 4, 7, 7, 9, 13 (баллы за задания). Найдите среднее арифметическое.", "opts": ["8", "7", "9", "40"], "expl": "(4 + 7 + 7 + 9 + 13) : 5 = 40 : 5 = 8.", "sol": "(4 + 7 + 7 + 9 + 13) : 5 = 40 : 5 = 8."}, {"t": "s", "topic": "ml4", "lvl": "A", "q": "Найдите размах ряда: 12, 5, 9, 15, 7, 9, 20.", "opts": ["15", "9", "20", "12"], "expl": "Размах = наибольшее − наименьшее = 20 − 5 = 15.", "sol": "Размах = наибольшее − наименьшее = 20 − 5 = 15."}, {"t": "s", "topic": "ml4", "lvl": "A", "q": "Найдите моду ряда: 3, 5, 5, 6, 8, 5, 3, 9.", "opts": ["5", "3", "6", "5,5"], "expl": "Чаще всего встречается 5 (три раза).", "sol": "Чаще всего встречается 5 (три раза)."}, {"t": "s", "topic": "ml4", "lvl": "B", "q": "Найдите медиану ряда: 11, 3, 8, 6, 14, 9.", "opts": ["8,5", "8", "9", "6"], "expl": "Чисел чётное количество — медиана равна среднему двух средних: (8 + 9) : 2 = 8,5.", "sol": "Упорядочим: 3, 6, 8, 9, 11, 14.\nЧисел чётное количество — медиана равна среднему двух средних: (8 + 9) : 2 = 8,5."}, {"t": "s", "topic": "ml4", "lvl": "B", "q": "Средний балл четырёх контрольных — 78. Какой балл нужно получить за пятую, чтобы средний балл стал 80?", "opts": ["88", "82", "80", "90"], "expl": "400 − 312 = 88.", "sol": "Сумма четырёх: 4 · 78 = 312. Нужно 5 · 80 = 400.\n400 − 312 = 88."}, {"t": "s", "topic": "ml4", "lvl": "C", "q": "Баллы семи учеников: 62, 70, 70, 75, 81, 90, 98. Ученик с баллом 98 пересдал и получил 105. Что изменится?", "opts": ["среднее и размах увеличатся, медиана не изменится", "изменятся только медиана и мода", "все показатели останутся прежними", "увеличится только мода"], "expl": "Сумма выросла на 7 → среднее увеличилось на 1; размах 98 − 62 = 36 → 105 − 62 = 43.", "sol": "Медиана — 4-е число (75) — не меняется, мода (70) — тоже.\nСумма выросла на 7 → среднее увеличилось на 1; размах 98 − 62 = 36 → 105 − 62 = 43."}, {"t": "s", "topic": "ml5", "lvl": "A", "q": "В коробке 4 красных, 6 синих и 10 зелёных шаров. Какова вероятность наугад вытащить синий шар?", "opts": ["$\\frac{3}{10}$", "$\\frac{1}{6}$", "$\\frac{3}{5}$", "$\\frac{1}{3}$"], "expl": "P = $\\frac{6}{20}$ = $\\frac{3}{10}$.", "sol": "Всего шаров: 4 + 6 + 10 = 20. Синих — 6.\nP = $\\frac{6}{20}$ = $\\frac{3}{10}$."}, {"t": "s", "topic": "ml5", "lvl": "B", "q": "Бросают две игральные кости. Какова вероятность, что сумма очков равна 7?", "opts": ["$\\frac{1}{6}$", "$\\frac{7}{36}$", "$\\frac{1}{12}$", "$\\frac{1}{2}$"], "expl": "P = $\\frac{6}{36}$ = $\\frac{1}{6}$.", "sol": "Всего исходов 6 · 6 = 36. Сумма 7: (1;6), (2;5), (3;4), (4;3), (5;2), (6;1) — 6 исходов.\nP = $\\frac{6}{36}$ = $\\frac{1}{6}$."}, {"t": "s", "topic": "ml5", "lvl": "A", "q": "Сколькими способами можно рассадить 4 человек на 4 стула в ряд?", "opts": ["24", "16", "12", "8"], "expl": "4! = 4 · 3 · 2 · 1 = 24.", "sol": "4! = 4 · 3 · 2 · 1 = 24."}, {"t": "s", "topic": "ml5", "lvl": "B", "q": "В классе 25 учеников. Нужно выбрать старосту и его заместителя. Сколькими способами это можно сделать?", "opts": ["600", "300", "625", "49"], "expl": "25 · 24 = 600.", "sol": "Старосту — 25 способами, заместителя — 24 (из оставшихся).\n25 · 24 = 600."}, {"t": "s", "topic": "ml5", "lvl": "B", "q": "Из 6 учеников нужно выбрать 2 для участия в олимпиаде. Сколько существует способов?", "opts": ["15", "30", "12", "36"], "expl": "Порядок не важен: C(6, 2) = 6 · 5 : 2 = 15.", "sol": "Порядок не важен: C(6, 2) = 6 · 5 : 2 = 15."}, {"t": "s", "topic": "ml5", "lvl": "C", "q": "В классе 30 учеников. 18 ходят в кружок робототехники, 15 — на футбол, 5 не ходят никуда. Сколько учеников ходят и туда, и туда?", "opts": ["8", "3", "13", "0"], "expl": "18 + 15 − 25 = 8 ходят в оба кружка.", "sol": "Ходят хотя бы куда-то: 30 − 5 = 25.\n18 + 15 − 25 = 8 ходят в оба кружка."}, {"t": "s", "topic": "ml5", "lvl": "B", "q": "В таблице частот: оценка «5» — 6 учеников, «4» — 10, «3» — 4. Найдите средний балл.", "opts": ["4,1", "4", "4,3", "3,9"], "expl": "(6 · 5 + 10 · 4 + 4 · 3) : 20 = (30 + 40 + 12) : 20 = 82 : 20 = 4,1.", "sol": "(6 · 5 + 10 · 4 + 4 · 3) : 20 = (30 + 40 + 12) : 20 = 82 : 20 = 4,1."}, {"t": "s", "topic": "ml6", "lvl": "A", "q": "5 кг яблок стоят 3500 тг. Сколько стоят 8 кг таких яблок?", "opts": ["5600 тг", "5000 тг", "4800 тг", "7000 тг"], "expl": "8 кг: 8 · 700 = 5600 тг.", "sol": "1 кг: 3500 : 5 = 700 тг.\n8 кг: 8 · 700 = 5600 тг."}, {"t": "s", "topic": "ml6", "lvl": "B", "q": "6 рабочих выполняют работу за 12 дней. За сколько дней выполнят ту же работу 9 рабочих (с той же производительностью)?", "opts": ["8 дн.", "18 дн.", "6 дн.", "10 дн."], "expl": "72 : 9 = 8 дней.", "sol": "Обратная пропорциональность: 6 · 12 = 72 человеко-дня.\n72 : 9 = 8 дней."}, {"t": "s", "topic": "ml6", "lvl": "B", "q": "Автомобиль расходует 7 л бензина на 100 км. Сколько литров понадобится на 450 км?", "opts": ["31,5 л", "35 л", "30 л", "45 л"], "expl": "450 : 100 · 7 = 4,5 · 7 = 31,5 л.", "sol": "450 : 100 · 7 = 4,5 · 7 = 31,5 л."}, {"t": "s", "topic": "ml6", "lvl": "A", "q": "Карта в масштабе 1 : 200 000. Расстояние на карте 6 см. Каково расстояние на местности?", "opts": ["12 км", "1,2 км", "120 км", "3 км"], "expl": "6 см · 200 000 = 1 200 000 см = 12 км.", "sol": "6 см · 200 000 = 1 200 000 см = 12 км."}, {"t": "s", "topic": "ml6", "lvl": "C", "q": "Стоимость мобильной связи задаётся формулой C = 1990 + 12m, где m — минуты сверх пакета. Сколько минут сверх пакета наговорил абонент, если заплатил 3670 тг?", "opts": ["140", "306", "120", "160"], "expl": "1990 + 12m = 3670 → 12m = 1680 → m = 140.", "sol": "1990 + 12m = 3670 → 12m = 1680 → m = 140."}, {"t": "s", "topic": "ml6", "lvl": "B", "q": "Температура воздуха понижается на 6 °C через каждый километр подъёма. У подножия горы +14 °C. Какая температура на высоте 3,5 км?", "opts": ["-7 °C", "-21 °C", "7 °C", "-5 °C"], "expl": "14 − 6 · 3,5 = 14 − 21 = −7 °C.", "sol": "14 − 6 · 3,5 = 14 − 21 = −7 °C."}, {"t": "s", "topic": "ml7", "lvl": "A", "q": "Найдите следующее число: 3, 7, 11, 15, …", "opts": ["19", "18", "21", "20"], "expl": "Каждое следующее больше на 4: 15 + 4 = 19.", "sol": "Каждое следующее больше на 4: 15 + 4 = 19."}, {"t": "s", "topic": "ml7", "lvl": "B", "q": "Найдите следующее число: 2, 6, 18, 54, …", "opts": ["162", "108", "72", "216"], "expl": "Каждое число умножается на 3: 54 · 3 = 162.", "sol": "Каждое число умножается на 3: 54 · 3 = 162."}, {"t": "s", "topic": "ml7", "lvl": "B", "q": "Найдите следующее число: 1, 4, 9, 16, 25, …", "opts": ["36", "30", "35", "49"], "expl": "Это квадраты: 1², 2², 3², 4², 5², далее 6² = 36.", "sol": "Это квадраты: 1², 2², 3², 4², 5², далее 6² = 36."}, {"t": "s", "topic": "ml7", "lvl": "C", "q": "Аружан откладывает деньги: в первый месяц 500 тг, а каждый следующий — на 50 тг больше, чем в предыдущий. Сколько она накопит за год?", "opts": ["9300 тг", "6600 тг", "9000 тг", "6550 тг"], "expl": "a₁₂ = 500 + 11 · 50 = 1050; S = (500 + 1050) · 12 : 2 = 9300 тг.", "sol": "Арифметическая прогрессия: a₁ = 500, d = 50, n = 12.\na₁₂ = 500 + 11 · 50 = 1050; S = (500 + 1050) · 12 : 2 = 9300 тг."}, {"t": "s", "topic": "ml7", "lvl": "B", "q": "Из спичек выкладывают квадраты в ряд: 1 квадрат — 4 спички, 2 квадрата — 7 спичек, 3 квадрата — 10 спичек. Сколько спичек нужно для 20 квадратов?", "opts": ["61", "80", "60", "64"], "expl": "3 · 20 + 1 = 61.", "sol": "Каждый новый квадрат добавляет 3 спички: 4, 7, 10, … → 3n + 1.\n3 · 20 + 1 = 61."}, {"t": "s", "topic": "ml7", "lvl": "B", "q": "Таблица тарифов: до 5 кг — 1500 тг, от 5 до 10 кг — 2400 тг, больше 10 кг — 2400 тг + 200 тг за каждый кг сверх 10. Сколько стоит доставка посылки 14 кг?", "opts": ["3200 тг", "2800 тг", "4200 тг", "3000 тг"], "expl": "2400 + 800 = 3200 тг.", "sol": "Сверх 10 кг: 14 − 10 = 4 кг; 4 · 200 = 800 тг.\n2400 + 800 = 3200 тг."}, {"t": "s", "topic": "ml8", "lvl": "A", "q": "Лестница длиной 5 м приставлена к стене. Её нижний конец находится в 3 м от стены. На какой высоте верхний конец касается стены?", "opts": ["4 м", "2 м", "8 м", "3,5 м"], "expl": "h = 4 м.", "sol": "По теореме Пифагора: h² = 5² − 3² = 25 − 9 = 16.\nh = 4 м."}, {"t": "s", "topic": "ml8", "lvl": "B", "q": "Тень от столба длиной 6 м. В это же время тень от человека ростом 1,8 м равна 2,4 м. Какова высота столба?", "opts": ["4,5 м", "8 м", "3,6 м", "5,4 м"], "expl": "h = 6 · 0,75 = 4,5 м.", "sol": "Треугольники подобны: h : 6 = 1,8 : 2,4.\nh = 6 · 0,75 = 4,5 м."}, {"t": "s", "topic": "ml8", "lvl": "B", "q": "Сколько всего треугольников на рисунке, если в треугольнике из одной вершины проведены 2 отрезка к противоположной стороне?", "opts": ["6", "3", "4", "5"], "expl": "Каждая пара точек с вершиной даёт треугольник: C(4, 2) = 6.", "sol": "Противоположная сторона делится на 3 части точками — всего 4 точки на ней.\nКаждая пара точек с вершиной даёт треугольник: C(4, 2) = 6."}, {"t": "s", "topic": "ml8", "lvl": "A", "q": "Часовая стрелка проходит полный круг за 12 часов. На сколько градусов она повернётся за 2 часа?", "opts": ["60°", "30°", "120°", "24°"], "expl": "2 · 30° = 60°.", "sol": "360° : 12 = 30° за час.\n2 · 30° = 60°."}, {"t": "s", "topic": "ml8", "lvl": "C", "q": "Колесо велосипеда имеет диаметр 70 см. Сколько полных оборотов сделает колесо на пути 1 км? (π ≈ 3,14)", "opts": ["454", "455", "1428", "227"], "expl": "100 000 : 219,8 ≈ 454,96 → 454 полных оборота.", "sol": "Длина окружности: 3,14 · 70 = 219,8 см. 1 км = 100 000 см.\n100 000 : 219,8 ≈ 454,96 → 454 полных оборота."}, {"t": "s", "topic": "ml9", "lvl": "A", "q": "Комната имеет форму прямоугольника 5 м × 4 м. Сколько квадратных метров ламината нужно, чтобы покрыть пол?", "opts": ["20 м²", "18 м²", "9 м²", "40 м²"], "expl": "S = 5 · 4 = 20 м².", "sol": "S = 5 · 4 = 20 м²."}, {"t": "s", "topic": "ml9", "lvl": "A", "q": "Участок 30 м × 20 м нужно обнести забором. Какова длина забора?", "opts": ["100 м", "600 м", "50 м", "120 м"], "expl": "P = 2 · (30 + 20) = 100 м.", "sol": "P = 2 · (30 + 20) = 100 м."}, {"t": "s", "topic": "ml9", "lvl": "B", "q": "Для пола 5 м × 4 м покупают ламинат в упаковках по 2,2 м². Сколько упаковок нужно купить?", "opts": ["10", "9", "8", "11"], "expl": "Нужно 10 упаковок (9 не хватит).", "sol": "Площадь 20 м². 20 : 2,2 ≈ 9,09.\nНужно 10 упаковок (9 не хватит)."}, {"t": "s", "topic": "ml9", "lvl": "B", "q": "Круглая клумба имеет радиус 3 м. Найдите её площадь (π ≈ 3,14).", "opts": ["28,26 м²", "18,84 м²", "9,42 м²", "113,04 м²"], "expl": "S = πr² = 3,14 · 9 = 28,26 м².", "sol": "S = πr² = 3,14 · 9 = 28,26 м²."}, {"t": "s", "topic": "ml9", "lvl": "C", "q": "Дорожка шириной 1 м проложена вокруг прямоугольного бассейна 8 м × 4 м (снаружи). Найдите площадь дорожки.", "opts": ["28 м²", "24 м²", "32 м²", "12 м²"], "expl": "Дорожка: 60 − 32 = 28 м².", "sol": "Бассейн с дорожкой: 10 м × 6 м = 60 м². Бассейн: 8 · 4 = 32 м².\nДорожка: 60 − 32 = 28 м²."}, {"t": "s", "topic": "ml9", "lvl": "B", "q": "Сторону квадрата увеличили в 3 раза. Во сколько раз увеличилась его площадь?", "opts": ["9 раз", "3 раз", "6 раз", "27 раз"], "expl": "S = a². (3a)² = 9a² — в 9 раз.", "sol": "S = a². (3a)² = 9a² — в 9 раз."}, {"t": "s", "topic": "ml10", "lvl": "A", "q": "Куб имеет ребро 3 см. Найдите площадь его полной поверхности.", "opts": ["54 см²", "27 см²", "36 см²", "9 см²"], "expl": "У куба 6 граней: 6 · 3² = 54 см².", "sol": "У куба 6 граней: 6 · 3² = 54 см²."}, {"t": "s", "topic": "ml10", "lvl": "B", "q": "Коробку 40 см × 30 см × 20 см нужно обклеить бумагой со всех сторон. Сколько см² бумаги понадобится?", "opts": ["5200 см²", "24000 см²", "2600 см²", "4400 см²"], "expl": "S = 2(ab + ac + bc) = 2(1200 + 800 + 600) = 5200 см².", "sol": "S = 2(ab + ac + bc) = 2(1200 + 800 + 600) = 5200 см²."}, {"t": "s", "topic": "ml10", "lvl": "B", "q": "Нужно покрасить стены комнаты 5 м × 4 м высотой 2,5 м (без пола и потолка, окна и двери не учитывать). Какова площадь стен?", "opts": ["45 м²", "50 м²", "20 м²", "65 м²"], "expl": "Площадь стен: 18 · 2,5 = 45 м².", "sol": "Периметр пола 2(5 + 4) = 18 м.\nПлощадь стен: 18 · 2,5 = 45 м²."}, {"t": "s", "topic": "ml10", "lvl": "C", "q": "Банка краски покрывает 12 м². Сколько банок нужно для стен комнаты 6 м × 4 м высотой 3 м, если окна и двери занимают 6 м²?", "opts": ["5", "4", "6", "3"], "expl": "54 : 12 = 4,5 → нужно 5 банок.", "sol": "Стены: 2(6 + 4) · 3 = 60 м²; без окон и дверей: 60 − 6 = 54 м².\n54 : 12 = 4,5 → нужно 5 банок."}, {"t": "s", "topic": "ml10", "lvl": "B", "q": "Цилиндрическую банку радиусом 5 см и высотой 10 см обклеивают этикеткой по боковой поверхности. Найдите площадь этикетки (π ≈ 3,14).", "opts": ["314 см²", "157 см²", "78,5 см²", "392,5 см²"], "expl": "Боковая поверхность: 2πrh = 2 · 3,14 · 5 · 10 = 314 см².", "sol": "Боковая поверхность: 2πrh = 2 · 3,14 · 5 · 10 = 314 см²."}, {"t": "s", "topic": "ml10", "lvl": "B", "q": "Во сколько раз увеличится площадь поверхности куба, если его ребро увеличить в 2 раза?", "opts": ["4 раза", "2 раза", "8 раза", "6 раза"], "expl": "S = 6a². При ребре 2a: 6 · 4a² — в 4 раза.", "sol": "S = 6a². При ребре 2a: 6 · 4a² — в 4 раза."}];
const MLT=[["ml1", "Логические задачи с числовыми выражениями"], ["ml2", "Текстовые задачи: уравнения и буквенные выражения"], ["ml3", "Проценты, круговые и столбчатые диаграммы"], ["ml4", "Среднее, размах, медиана, мода"], ["ml5", "Таблицы, множества, комбинаторика, вероятность"], ["ml6", "Зависимость одной величины от другой"], ["ml7", "Последовательности и анализ таблиц"], ["ml8", "Задачи с геометрическим содержанием"], ["ml9", "Периметр и площадь фигур"], ["ml10", "Площадь поверхности тел"]];

const RLV=[[{"id": "v1t1", "topic": "rl", "title": "Объявление", "kind": "Текст 1", "text": "Уважаемые жители дома № 12 по улице Торайгырова! В субботу, 14 сентября, с 10:00 до 13:00 состоится общий субботник. Мы уберём мусор во дворе, покрасим скамейки и посадим молодые деревья у детской площадки. Перчатки, мешки и краску выдаст управляющая компания. Просим взять с собой удобную одежду и хорошее настроение. После работы всех участников ждёт чаепитие в беседке. Вопросы можно задать председателю совета дома по телефону 8 777 123 45 67.", "code": null, "qs": [{"q": "Какова основная цель текста?", "opts": ["пригласить жителей на субботник", "рассказать об истории улицы", "сообщить о ремонте дома", "объявить о продаже краски"], "expl": "Текст — объявление-приглашение на субботник."}, {"q": "Что жителям НЕ нужно приносить с собой?", "opts": ["перчатки и мешки", "удобную одежду", "хорошее настроение", "все перечисленное нужно взять"], "expl": "Перчатки, мешки и краску выдаст управляющая компания."}]}, {"id": "v1t2", "topic": "rl", "title": "Сайгаки", "kind": "Текст 2", "text": "Сайгак — степная антилопа, которая живёт в Казахстане, России, Узбекистане и Монголии. Его легко узнать по необычному носу, похожему на короткий хобот. Такой нос помогает животному согревать морозный воздух зимой и задерживать пыль во время летней жары. Сайгаки очень выносливы: они могут проходить по степи десятки километров в день в поисках корма и воды.\n\nВ начале 2000-х годов сайгаков почти не осталось: браконьеры охотились на самцов ради рогов. Казахстан создал охраняемые территории и усилил борьбу с браконьерством. Благодаря этим мерам численность сайгаков выросла во много раз, и сейчас их снова можно встретить большими стадами.\n\nОднако учёные предупреждают: сайгаки по-прежнему уязвимы, ведь эпидемия может за несколько недель погубить значительную часть популяции.", "code": null, "qs": [{"q": "Для чего сайгаку необычный нос?", "opts": ["чтобы согревать воздух и задерживать пыль", "чтобы находить воду под землёй", "чтобы защищаться от хищников", "чтобы издавать громкие звуки"], "expl": "Второе предложение первого абзаца."}, {"q": "Почему численность сайгаков резко сократилась?", "opts": ["из-за браконьерства", "из-за суровых зим", "из-за нехватки корма", "из-за строительства городов"], "expl": "Браконьеры охотились на самцов ради рогов."}, {"q": "Какое утверждение соответствует тексту?", "opts": ["сайгаки по-прежнему находятся под угрозой", "сайгаки живут только в Казахстане", "охрана сайгаков не дала результата", "сайгаки — горные животные"], "expl": "Последний абзац: они уязвимы перед эпидемиями."}]}, {"id": "v1t3", "topic": "rl", "title": "Аль-Фараби", "kind": "Текст 3", "text": "Абу Наср аль-Фараби родился около 870 года в Отраре — одном из крупных городов на Великом шёлковом пути, на территории современного Казахстана. С юности он стремился к знаниям: изучал языки, математику, музыку и философию. Позже он переехал в Багдад, который в то время был одним из главных научных центров мира.\n\nАль-Фараби написал более ста трудов. Особенно известны его комментарии к сочинениям Аристотеля. Благодаря им многие идеи древнегреческой философии стали понятны учёным Востока, а затем и Европы. За это аль-Фараби назвали «Вторым учителем» — после самого Аристотеля, которого считали «Первым учителем».\n\nУчёный занимался не только философией. В «Большой книге музыки» он описал устройство музыкальных инструментов и законы звука. В трактате «О взглядах жителей добродетельного города» аль-Фараби рассуждал о том, каким должно быть справедливое общество. По его мнению, главная цель государства — помочь людям достичь счастья, а правитель должен быть мудрым и образованным.\n\nПоследние годы жизни учёный провёл в Дамаске, где и умер около 950 года. Сегодня имя аль-Фараби носит Казахский национальный университет в Алматы, а его наследие изучают во всём мире.", "code": null, "qs": [{"q": "Почему аль-Фараби называют «Вторым учителем»?", "opts": ["его считали самым значительным мыслителем после Аристотеля", "он был вторым учителем в школе Отрара", "он написал вторую книгу о музыке", "он учился у двух учителей"], "expl": "Второй абзац: «Первым учителем» считали Аристотеля."}, {"q": "Где аль-Фараби провёл последние годы жизни?", "opts": ["в Дамаске", "в Отраре", "в Багдаде", "в Алматы"], "expl": "Последний абзац."}, {"q": "О чём, по мнению аль-Фараби, должно заботиться государство?", "opts": ["чтобы люди достигли счастья", "чтобы расширять свои границы", "чтобы собирать больше налогов", "чтобы развивать торговлю"], "expl": "Третий абзац."}, {"q": "К какому стилю относится текст?", "opts": ["научно-популярный", "художественный", "официально-деловой", "разговорный"], "expl": "Текст сообщает факты о жизни учёного доступным языком — научно-популярный стиль."}, {"q": "Какой заголовок лучше всего отражает основную мысль текста?", "opts": ["«Учёный из Отрара, известный всему миру»", "«Путешествие по Шёлковому пути»", "«История музыкальных инструментов»", "«Города Древнего Востока»"], "expl": "Текст о жизни и наследии аль-Фараби."}]}], [{"id": "v2t1", "topic": "rl", "title": "Правила библиотеки", "kind": "Текст 1", "text": "Правила пользования читальным залом. Читальный зал работает с понедельника по субботу с 9:00 до 19:00. Книги из читального зала выдаются только по читательскому билету и на дом не выдаются. В зале необходимо соблюдать тишину и выключать звук на мобильных телефонах. Приносить еду и напитки, кроме воды в закрытой бутылке, запрещено. Пользоваться ноутбуком можно за столами у окна, где есть розетки.", "code": null, "qs": [{"q": "В какой день читальный зал НЕ работает?", "opts": ["в воскресенье", "в понедельник", "в среду", "в субботу"], "expl": "Работает с понедельника по субботу."}, {"q": "Что разрешено приносить в читальный зал?", "opts": ["воду в закрытой бутылке", "бутерброды", "горячий чай", "сок в стакане"], "expl": "Еда и напитки запрещены, кроме воды в закрытой бутылке."}]}, {"id": "v2t2", "topic": "rl", "title": "Почему небо голубое", "kind": "Текст 2", "text": "Многие дети спрашивают родителей, почему небо голубое. Ответ на этот вопрос дала физика. Солнечный свет кажется нам белым, но на самом деле он состоит из лучей разных цветов — от красного до фиолетового.\n\nПроходя через атмосферу, свет сталкивается с крошечными молекулами воздуха. Синие и фиолетовые лучи рассеиваются ими гораздо сильнее, чем красные и жёлтые. Поэтому рассеянный синий свет приходит к нам со всех сторон неба. Фиолетовых лучей в солнечном свете меньше, а наш глаз к ним менее чувствителен, поэтому небо мы видим именно голубым.\n\nНа закате солнечный свет проходит через атмосферу более длинный путь. Синие лучи успевают рассеяться, и до нас доходят красные и оранжевые.", "code": null, "qs": [{"q": "Из чего состоит солнечный свет?", "opts": ["из лучей разных цветов", "только из белых лучей", "только из синих лучей", "из молекул воздуха"], "expl": "Первый абзац."}, {"q": "Почему на закате небо красное?", "opts": ["свет проходит более длинный путь, и синие лучи рассеиваются", "Солнце становится холоднее", "в атмосфере становится больше пыли", "молекулы воздуха окрашиваются в красный цвет"], "expl": "Последний абзац."}, {"q": "Какой тип речи преобладает в тексте?", "opts": ["рассуждение", "повествование", "описание", "диалог"], "expl": "Текст объясняет причины явления — рассуждение."}]}, {"id": "v2t3", "topic": "rl", "title": "Город будущего", "kind": "Текст 3", "text": "Более половины людей на планете сегодня живут в городах, и, по прогнозам ООН, к 2050 году эта доля приблизится к 70 процентам. Быстрый рост городов создаёт серьёзные проблемы: пробки, загрязнение воздуха, нехватку жилья и зелёных зон. Архитекторы и инженеры ищут способы сделать города удобными и безопасными для жизни.\n\nОдна из главных идей — «город пятнадцати минут». Его смысл в том, что школа, поликлиника, магазины, парк и место работы должны находиться не дальше чем в пятнадцати минутах пешком или на велосипеде от дома. Тогда людям реже нужен автомобиль, а улицы становятся тише и чище. Эту концепцию уже пробуют применять в Париже, Мельбурне и других городах.\n\nДругая важная задача — озеленение. Деревья не только украшают улицы, но и снижают температуру воздуха летом, поглощают шум и пыль. В некоторых городах на крышах домов разбивают сады, а стены зданий покрывают вьющимися растениями.\n\nНе менее важен общественный транспорт. Если автобусы и метро ходят часто и стоят недорого, многие жители сами отказываются от поездок на личном автомобиле.\n\nКонечно, перестроить уже существующий город сложно и дорого. Но специалисты уверены: каждое небольшое изменение — новая велодорожка, сквер или удобная остановка — делает жизнь горожан немного лучше.", "code": null, "qs": [{"q": "Что такое «город пятнадцати минут»?", "opts": ["город, где всё необходимое находится в 15 минутах от дома пешком или на велосипеде", "город, который можно пересечь на машине за 15 минут", "город, где транспорт ходит каждые 15 минут", "город с населением не более 15 тысяч человек"], "expl": "Второй абзац."}, {"q": "Какую пользу приносят деревья в городе, по тексту?", "opts": ["снижают температуру, поглощают шум и пыль", "увеличивают количество машин", "заменяют общественный транспорт", "делают жильё дешевле"], "expl": "Третий абзац."}, {"q": "Какая доля людей будет жить в городах к 2050 году по прогнозу ООН?", "opts": ["около 70%", "около 50%", "около 15%", "около 90%"], "expl": "Первый абзац."}, {"q": "Какова основная мысль текста?", "opts": ["города можно сделать удобнее с помощью продуманных решений", "жить в городах стало невозможно", "люди должны переезжать в сёла", "автомобили нужно полностью запретить"], "expl": "Текст рассказывает о способах улучшить города."}, {"q": "К какому стилю относится текст?", "opts": ["публицистический", "художественный", "официально-деловой", "разговорный"], "expl": "Текст обсуждает общественно важную проблему и рассчитан на широкого читателя."}]}], [{"id": "v3t1", "topic": "rl", "title": "Записка", "kind": "Текст 1", "text": "Дана, привет! Я сегодня задержусь на тренировке до восьми, так что ужинайте без меня. Суп в холодильнике, его нужно только разогреть. Пожалуйста, не забудь покормить Барсика: корм лежит на верхней полке в шкафу. И ещё — мама просила полить цветы на балконе, а то они совсем засохли. Если будет что-то срочное, звони, телефон будет со мной. Домашнее задание по математике я уже сделал, проверю твоё вечером. Целую, Арман.", "code": null, "qs": [{"q": "Кем, скорее всего, Арман приходится Дане?", "opts": ["братом", "учителем", "соседом по офису", "врачом"], "expl": "Тон дружеский, упоминается мама и общий дом — скорее всего, брат."}, {"q": "Какой стиль речи у текста?", "opts": ["разговорный", "научный", "официально-деловой", "публицистический"], "expl": "Записка близкому человеку — разговорный стиль."}]}, {"id": "v3t2", "topic": "rl", "title": "Пчёлы", "kind": "Текст 2", "text": "Пчёлы играют огромную роль в жизни человека, хотя многие думают о них только как о производителях мёда. Главная польза пчёл в другом: они опыляют растения. Перелетая с цветка на цветок, пчела переносит пыльцу, и благодаря этому образуются плоды и семена. Одна пчелиная семья за лето может посетить миллионы цветков.\n\nПо оценкам учёных, от опыления насекомыми зависит около трети продуктов, которые мы едим: яблоки, вишня, огурцы, подсолнечник и многие другие.\n\nВ последние десятилетия во многих странах число пчёл сокращается. Причинами называют применение ядохимикатов, болезни и уменьшение количества цветущих растений. Чтобы помочь пчёлам, фермерам советуют осторожнее использовать химикаты, а горожанам — сажать цветы на балконах и в палисадниках.", "code": null, "qs": [{"q": "В чём, по мнению автора, главная польза пчёл?", "opts": ["они опыляют растения", "они производят мёд", "они уничтожают вредителей", "они делают воск"], "expl": "Первый абзац: «Главная польза пчёл в другом»."}, {"q": "Какая доля продуктов зависит от опыления насекомыми?", "opts": ["около трети", "около половины", "почти все", "около десятой части"], "expl": "Второй абзац."}, {"q": "Что НЕ названо причиной сокращения числа пчёл?", "opts": ["холодные зимы", "ядохимикаты", "болезни", "уменьшение цветущих растений"], "expl": "Холодные зимы в тексте не упоминаются."}]}, {"id": "v3t3", "topic": "rl", "title": "Интернет и чтение", "kind": "Текст 3", "text": "В последние годы часто говорят, что молодёжь перестала читать. Действительно, подростки проводят много времени в телефонах, а в библиотеках стало меньше посетителей. Однако исследования показывают, что картина сложнее, чем кажется.\n\nСовременные школьники читают не меньше, а, возможно, даже больше, чем их родители в том же возрасте. Просто читают они иначе: короткие сообщения, посты, новости, комментарии. Такое чтение быстрое и поверхностное. Человек привыкает просматривать текст глазами, выхватывая отдельные слова, и ему становится труднее сосредоточиться на длинной статье или книге.\n\nПсихологи называют это «клиповым мышлением». Оно помогает быстро находить нужную информацию, но мешает глубоко её обдумывать. Между тем именно умение читать вдумчиво — понимать главную мысль, замечать связи, оценивать доводы автора — необходимо в учёбе и работе.\n\nЧто же делать? Специалисты советуют не отказываться от гаджетов, а учиться разным видам чтения. Полезно каждый день находить хотя бы полчаса для чтения книги без отвлечений, обсуждать прочитанное с друзьями, пересказывать главное своими словами. Электронная книга тоже подходит, если во время чтения отключить уведомления.\n\nЧтение — как спорт: если не тренироваться, навык слабеет. Но вернуть его можно в любом возрасте.", "code": null, "qs": [{"q": "Какое утверждение соответствует тексту?", "opts": ["школьники читают много, но в основном короткие тексты", "школьники совсем перестали читать", "родители читают больше, чем дети", "длинные тексты читать легче, чем короткие"], "expl": "Второй абзац."}, {"q": "Что такое «клиповое мышление» по тексту?", "opts": ["привычка быстро просматривать информацию, мешающая глубокому обдумыванию", "умение снимать видеоклипы", "способность запоминать длинные тексты", "привычка читать только бумажные книги"], "expl": "Третий абзац."}, {"q": "Какой совет НЕ даётся в тексте?", "opts": ["полностью отказаться от гаджетов", "читать книгу полчаса в день без отвлечений", "обсуждать прочитанное с друзьями", "пересказывать главное своими словами"], "expl": "Наоборот: «не отказываться от гаджетов»."}, {"q": "Для чего автор сравнивает чтение со спортом?", "opts": ["чтобы показать, что навык нужно постоянно тренировать", "чтобы доказать, что спорт важнее чтения", "чтобы посоветовать читать во время тренировок", "чтобы рассказать о книгах про спорт"], "expl": "Последний абзац."}, {"q": "Какой тип речи преобладает в тексте?", "opts": ["рассуждение", "повествование", "описание", "инструкция"], "expl": "Автор рассуждает о проблеме, приводит доводы и вывод."}]}], [{"id": "v4t1", "topic": "rl", "title": "Прогноз погоды", "kind": "Текст 1", "text": "Завтра в Павлодаре ожидается облачная погода с прояснениями. Днём температура воздуха поднимется до +5 градусов, ночью опустится до −4. Во второй половине дня возможен мокрый снег, на дорогах — гололедица. Ветер северо-западный, 9–14 метров в секунду, с порывами до 18. Синоптики советуют водителям быть особенно внимательными, а пешеходам — выбирать нескользкую обувь. В выходные похолодает до −10, а в понедельник ожидается снегопад и усиление ветра.", "code": null, "qs": [{"q": "Какая опасность ожидается на дорогах?", "opts": ["гололедица", "туман", "наводнение", "сильная жара"], "expl": "Во второй половине дня возможна гололедица."}, {"q": "Какой будет температура ночью?", "opts": ["−4 градуса", "+5 градусов", "−10 градусов", "+4 градуса"], "expl": "Ночью опустится до −4."}]}, {"id": "v4t2", "topic": "rl", "title": "Байконур", "kind": "Текст 2", "text": "Космодром Байконур расположен в Кызылординской области Казахстана. Это первый и крупнейший космодром в мире. Именно отсюда 4 октября 1957 года был запущен первый искусственный спутник Земли, а 12 апреля 1961 года в космос отправился Юрий Гагарин.\n\nМесто для космодрома выбрали не случайно. Здесь мало облачных дней, а большая незаселённая степь позволяла безопасно запускать ракеты. Кроме того, чем ближе стартовая площадка к экватору, тем легче вывести ракету на орбиту.\n\nВ 1991 году на Байконуре стартовал Токтар Аубакиров, а в 2015 году — Айдын Аимбетов. Сегодня с космодрома продолжают запускать ракеты с космонавтами и спутниками. В городе Байконур работает музей, где можно увидеть домик Гагарина и настоящие ракеты.", "code": null, "qs": [{"q": "Какое событие произошло на Байконуре 12 апреля 1961 года?", "opts": ["полёт Юрия Гагарина", "запуск первого спутника", "полёт Токтара Аубакирова", "открытие космодрома"], "expl": "Первый абзац."}, {"q": "Почему место для космодрома выбрали в казахской степи? Укажите причину, названную в тексте.", "opts": ["мало облачных дней и большая незаселённая территория", "рядом проходит железная дорога в Европу", "здесь много полезных ископаемых", "здесь самый тёплый климат в Казахстане"], "expl": "Второй абзац."}, {"q": "Какой заголовок подходит к тексту лучше всего?", "opts": ["«Байконур — первый космодром мира»", "«Климат Кызылординской области»", "«Как стать космонавтом»", "«История ракетостроения в Европе»"], "expl": "Текст о Байконуре и его истории."}]}, {"id": "v4t3", "topic": "rl", "title": "Как учить иностранный язык", "kind": "Текст 3", "text": "Многие начинают учить иностранный язык с энтузиазмом, но через месяц бросают. Причина часто не в отсутствии способностей, а в неправильном подходе. Опыт преподавателей и исследования учёных позволяют дать несколько полезных советов.\n\nВо-первых, заниматься лучше понемногу, но регулярно. Двадцать минут каждый день приносят больше пользы, чем три часа раз в неделю. Мозг лучше запоминает информацию, к которой мы возвращаемся с перерывами.\n\nВо-вторых, слова нужно учить не списками, а в словосочетаниях и примерах. Слово «decision» само по себе запоминается плохо, а выражение «make a decision» — «принять решение» — легче вспомнить и сразу использовать в речи.\n\nВ-третьих, важно много слушать и читать то, что действительно интересно: фильмы, песни, блоги, книги. Так язык становится частью жизни, а не скучной обязанностью.\n\nНаконец, не стоит бояться ошибок. Многие стесняются говорить, пока не будут уверены, что всё скажут правильно. Но речь развивается только в практике. Ошибки — естественная часть обучения, и даже носители языка их допускают.\n\nГлавное — терпение. Изучение языка похоже на марафон, а не на спринт: результат приходит к тем, кто продолжает заниматься, даже когда кажется, что прогресса нет.", "code": null, "qs": [{"q": "Почему, по тексту, многие бросают изучать язык?", "opts": ["из-за неправильного подхода", "из-за отсутствия способностей", "из-за нехватки учебников", "из-за дорогих курсов"], "expl": "Первый абзац."}, {"q": "Какой режим занятий автор считает лучшим?", "opts": ["понемногу, но каждый день", "три часа раз в неделю", "только перед экзаменом", "один раз в месяц по выходным"], "expl": "Второй абзац."}, {"q": "Как, по совету автора, лучше учить слова?", "opts": ["в словосочетаниях и примерах", "длинными списками", "только по словарю", "без перевода"], "expl": "Третий абзац."}, {"q": "Что означает сравнение изучения языка с марафоном?", "opts": ["результат требует долгой и терпеливой работы", "язык нужно учить во время бега", "учить язык нужно очень быстро", "изучение языка — это соревнование"], "expl": "Последний абзац."}, {"q": "Какой тип текста по цели?", "opts": ["текст с советами (рекомендациями)", "художественный рассказ", "официальный документ", "научный отчёт об эксперименте"], "expl": "Автор даёт советы по порядку: во-первых, во-вторых…"}]}]];

 const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

   if(/[a-zA-Z]/.test(c)){t.push({k:'id',v:c});i++;continue}
   if(/[а-яА-ЯёЁ]/.test(c)){let j=i;while(j<s.length&&/[а-яА-ЯёЁ]/.test(s[j]))j++;t.push({k:'txt',v:s.slice(i,j)});i=j;continue}
   t.push({k:'op',v:c});i++}
  return t}
 function parse(t){let p=0;

/* ---------- Движок теста ---------- */
function record(it,ok){if(it.ref)return;const key=k(it),r=S.q[key]||{n:0,ok:0};r.n++;if(ok)r.ok++;r.last=ok?1:0;S.q[key]=r;
 S.wrong=S.wrong.filter(x=>x!==key);if(!ok)S.wrong.push(key)}
function prep(it){if(it.t==='s')return{it,opts:it.tf?it.tf.slice():shuf(it.opts)};if(it.t==='m')return{it,opts:shuf(it.opts)};return{it,right:shuf(it.right)}}
function answered(P,a){if(a===undefined||a===null)return false;if(P.it.t==='m')return a.length>0;if(P.it.t==='x')return a.some(v=>v!==null&&v!==undefined);return true}
function grade(P,a){const it=P.it;if(!answered(P,a))return 0;
 if(it.t==='s')return P.opts[a]===it.opts[0]?1:0;
 if(it.t==='m'){const sel=new Set(a.map(j=>P.opts[j]));const miss=it.ans.filter(x=>!sel.has(x)).length;const extra=[...sel].filter(x=>!it.ans.includes(x)).length;const e=miss+extra;return e===0?2:e===1?1:0}
 const okN=it.left.filter((_,i)=>a[i]!==null&&a[i]!==undefined&&P.right[a[i]]===it.ans[i]).length;return okN===it.left.length?2:okN===it.left.length-1?1:0}
function startQuiz(qs,title,exam){
 let i=0,score=0,maxSoFar=0;const P=qs.map(prep);const ans=[],checked=[];let left=(exam?cur.exam.minutes:0)*60;
 const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
 if(exam){timerId=setInterval(()=>{left--;const el=document.getElementById('tm');if(el)el.textContent=fmt(left);if(left<=0){clearInterval(timerId);finish()}},1000)}
 function body(){const p=P[i],it=p.it,a=ans[i],done=!exam&&checked[i];
  if(it.t==='s')return`<div id="opts">${p.opts.map((o,j)=>{let cl='';if(done){if(o===it.opts[0])cl='ok';else if(a===j)cl='bad'}else if(a===j)cl='sel';return`<button class="opt ${cl}" data-j="${j}" ${done?'disabled':''}>${'ABCD'[j]}) ${F(o)}</button>`}).join('')}</div>`;
  if(it.t==='m'){const sel=new Set(a||[]);return`<p class="small mut" style="margin:4px 0">Выбери все верные варианты (их от 1 до 3).</p><div id="opts">${p.opts.map((o,j)=>{let cl=sel.has(j)?'sel':'';if(done){const right=it.ans.includes(o);cl=right?'ok':(sel.has(j)?'bad':'')}return`<button class="opt ${cl}" data-j="${j}" ${done?'disabled':''}>${sel.has(j)?'☑':'☐'} ${'ABCDEF'[j]}) ${F(o)}</button>`}).join('')}</div>`}
  const aa=a||[];return`<div id="opts">${it.left.map((l,li)=>`<div class="mrow"><div class="ml"><b>${'AB'[li]})</b> ${F(l)}</div>${p.right.map((r,ri)=>{let cl=aa[li]===ri?'sel':'';if(done){if(r===it.ans[li])cl='ok';else if(aa[li]===ri)cl='bad'}return`<button class="opt sm ${cl}" data-l="${li}" data-r="${ri}" ${done?'disabled':''}>${F(r)}</button>`}).join('')}</div>`).join('')}</div>`}
 function draw(){const p=P[i],it=p.it,c=it.ctx&&ctxById(it.ctx),done=!exam&&checked[i],a=ans[i];
  const needCheck=!exam&&it.t!=='s'&&!checked[i];
  app.innerHTML=`<div class="fade"><div class="row" style="justify-content:space-between"><span class="pill">${esc(title)} · ${i+1}/${P.length}</span>${exam?`<span class="timer" id="tm">${fmt(left)}</span>`:`<span class="small mut">баллы: ${score}/${maxSoFar}</span>`}</div>
  <div class="bar" style="margin:10px 0 14px"><i style="width:${i/P.length*100}%"></i></div>
  ${c?CTXH(c):''}
  <div class="card"><div class="small mut">${c?'<span class="pill g">Контекст</span> ':''}${it.t==='m'?'<span class="pill g">2 балла · несколько ответов</span> ':''}${it.t==='x'?'<span class="pill g">2 балла · соответствие</span> ':''}${esc(tn(it.topic))}</div><div class="q">${F(it.q)}</div>
  ${it.code?`<pre class="code">${esc(it.code)}</pre>`:''}${body()}
  ${needCheck?`<button class="btn" id="chk" style="margin-top:8px" ${answered(p,a)?'':'disabled'}>Проверить</button>`:''}
  ${done?`<div class="expl small">${(()=>{const g=grade(p,a),mx=pts(it);return g===mx?'<b style="color:var(--ok)">Верно.</b> ':(g>0?`<b style="color:var(--gold)">Частично: ${g} из ${mx}.</b> `:'<b style="color:var(--bad)">Неверно.</b> ')})()}${it.t==='s'&&p.opts[a]!==it.opts[0]?'Правильно: <b>'+F(it.opts[0])+'</b>. ':''}${it.t!=='s'?'Правильно: <b>'+F(corrText(it))+'</b>. ':''}${grade(p,a)<pts(it)&&it.sol?'':F(it.expl)}</div>${grade(p,a)<pts(it)?SOLH(it):''}`:''}</div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn alt" id="qq">Завершить</button>
   <span class="row">${exam&&i>0?'<button class="btn alt" id="pv">← Назад</button>':''}${(done||exam)?`<button class="btn" id="nx">${i<P.length-1?'Дальше →':'Результат'}</button>`:''}</span></div>
  <div id="cf"></div>
  ${exam?`<div class="navq">${P.map((pp,j)=>`<button data-g="${j}" class="${answered(pp,ans[j])?'a':''} ${j===i?'c':''}" aria-label="Задание ${j+1}">${j+1}</button>`).join('')}</div>`:''}</div>`;
  const opts=document.getElementById('opts');
  opts.onclick=e=>{const b=e.target.closest('.opt');if(!b||b.disabled)return;
   if(it.t==='s'){ans[i]=+b.dataset.j;if(!exam){checked[i]=1;const g=grade(p,ans[i]);score+=g;maxSoFar+=1;record(it,g===1);save()}draw();return}
   if(it.t==='m'){const s=new Set(ans[i]||[]);const j=+b.dataset.j;s.has(j)?s.delete(j):s.add(j);ans[i]=[...s];draw();return}
   const arr=(ans[i]||it.left.map(()=>null)).slice();const li=+b.dataset.l,ri=+b.dataset.r;arr[li]=arr[li]===ri?null:ri;ans[i]=arr;draw()};
  const chk=document.getElementById('chk');if(chk)chk.onclick=()=>{checked[i]=1;const g=grade(p,ans[i]);score+=g;maxSoFar+=pts(it);record(it,g===pts(it));save();draw()};
  const nx=document.getElementById('nx');if(nx)nx.onclick=()=>{if(i<P.length-1){i++;draw()}else finish()};
  const pv=document.getElementById('pv');if(pv)pv.onclick=()=>{i--;draw()};
  app.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{i=+b.dataset.g;draw()});
  document.getElementById('qq').onclick=()=>{const left=P.filter((pp,j)=>!answered(pp,ans[j])).length;if(!exam||left===0)return finish();const box=document.getElementById('cf');box.innerHTML=`<div class="note" style="margin-top:14px"><p style="margin:0 0 10px">Без ответа: <b>${left}</b> из ${P.length}. Они дадут 0 баллов. Завершить?</p><div class="row"><button class="btn alt" id="cfn">Продолжить тест</button><button class="btn" id="cfy">Завершить</button></div></div>`;document.getElementById('cfn').onclick=()=>box.innerHTML='';document.getElementById('cfy').onclick=finish};}
 function finish(){clearInterval(timerId);let total=score,max=maxSoFar;
  if(exam){total=0;max=0;P.forEach((p,j)=>{max+=pts(p.it);if(!answered(p,ans[j]))return;const g=grade(p,ans[j]);total+=g;record(p.it,g===pts(p.it))});
   if(P.some((p,j)=>answered(p,ans[j]))){S.exams.push({d:new Date().toLocaleDateString('ru-RU'),s:total,m:max});S.exams=S.exams.slice(-30)}save()}
  const wrongs=P.map((p,j)=>({p,j})).filter(({p,j})=>(exam||checked[j])&&grade(p,ans[j])<pts(p.it)&&(exam||answered(p,ans[j])));
  app.innerHTML=`<div class="fade"><div class="card" style="text-align:center"><div class="mut">${esc(title)}</div><div class="res">${total}/${max}</div><div class="small mut">баллов</div>
  ${exam&&cur.id==='hist'?`<p>${total>=5?'Порог в 5 баллов пройден.':'Ниже порога в 5 баллов — повтори темы с ошибками.'}</p>`:''}
  <div class="row" style="justify-content:center;margin-top:10px"><button class="btn" id="again">Ещё раз</button><button class="btn alt" id="hm">На главную</button></div></div>
  ${wrongs.length?`<h3 style="margin-top:20px">Разбор ошибок</h3>${wrongs.map(({p})=>`<div class="card" style="margin-bottom:10px"><b>${F(p.it.q)}</b>${p.it.code?`<pre class="code">${esc(p.it.code)}</pre>`:''}<p class="small" style="margin:.4em 0">Верно: <span style="color:var(--ok)">${F(corrText(p.it))}</span></p>${p.it.sol?SOLH(p.it):''}<div class="small mut">${p.it.sol?'':F(p.it.expl)}${p.it.topic?` · <a href="#learn" data-id="${p.it.topic}">${esc(tn(p.it.topic))}</a>`:''}</div></div>`).join('')}`:''}</div>`;
  document.getElementById('again').onclick=()=>startQuiz(exam?makeExam():qs.some(q=>q.ctx)?qs:shuf(qs),title,exam);
  document.getElementById('hm').onclick=()=>go('home');
  app.onclick=e=>{const a=e.target.closest('a[data-id]');if(a){e.preventDefault();go('learn',a.dataset.id)}};}
 app.onclick=null;draw();
}

/* ---------- Практика IELTS: Writing, Speaking, диктант ---------- */
const PCOL=['#2563eb','#059669','#d97706','#db2777'];
const LSG=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const LSS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
function chartSVG(c){
 if(c.type==='table')return`<div class="scroll"><table><thead><tr><th>${esc(c.unit==='%'?'Source / %':'')}</th>${c.series.map(s=>`<th>${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${c.labels.map((l,i)=>`<tr><td><b>${esc(l)}</b></td>${c.series.map(s=>`<td>${s.data[i]}${c.unit==='%'?'%':''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
 if(c.type==='process')return`<div class="proc">${c.labels.map((l,i)=>`<div class="pstep"><span class="pill">Stage ${i+1}</span> ${esc(l)}</div>${i<c.labels.length-1?'<div class="parr">↓</div>':''}`).join('')}</div>`;
 const legend=`<div class="row small" style="gap:12px;margin-top:6px">${c.series.map((s,i)=>`<span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${PCOL[i]};vertical-align:-1px"></i> ${esc(s.name)}</span>`).join('')}</div>`;
 if(c.type==='pie'){const pies=c.series.map(s=>{let a=-Math.PI/2;const tot=s.data.reduce((x,y)=>x+y,0);const PC=['#2563eb','#059669','#d97706','#db2777','#6b7280'];
   const segs=s.data.map((v,i)=>{const a2=a+v/tot*2*Math.PI;const x1=80+70*Math.cos(a),y1=80+70*Math.sin(a),x2=80+70*Math.cos(a2),y2=80+70*Math.sin(a2);const mid=(a+a2)/2;const tx=80+45*Math.cos(mid),ty=80+45*Math.sin(mid);
    const p=`<path d="M80 80 L${x1.toFixed(1)} ${y1.toFixed(1)} A70 70 0 ${a2-a>Math.PI?1:0} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${PC[i]}" stroke="#fff" stroke-width="2"/><text x="${tx.toFixed(1)}" y="${(ty+4).toFixed(1)}" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">${v}%</text>`;a=a2;return p}).join('');
   return`<div style="text-align:center"><svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="${esc(s.name)}">${segs}</svg><div><b>${esc(s.name)}</b></div></div>`}).join('');
  const PC=['#2563eb','#059669','#d97706','#db2777','#6b7280'];
  return`<div class="row" style="justify-content:center;gap:20px">${pies}</div><div class="row small" style="gap:12px;margin-top:6px;justify-content:center">${c.labels.map((l,i)=>`<span><i style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${PC[i]};vertical-align:-1px"></i> ${esc(l)}</span>`).join('')}</div>`}
 const W=340,H=210,L=36,B=30,T=10,R=8,mv=Math.max(...c.series.flatMap(s=>s.data)),stp=[1,2,5,10,20,25,50,100,200,500].find(x=>x*5>=mv)||1000,nt=Math.ceil(mv/stp),max=nt*stp;
 const y=v=>T+(H-T-B)*(1-v/max),grid=Array.from({length:nt+1},(_,k)=>k*stp).map(v=>{return`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e5e7eb"/><text x="${L-4}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="#6b7280">${v}</text>`}).join('');
 let body='';const n=c.labels.length,cw=(W-L-R)/n;
 if(c.type==='line'){const x=i=>L+cw*(i+.5);
  body=c.series.map((s,si)=>`<polyline fill="none" stroke="${PCOL[si]}" stroke-width="2.5" points="${s.data.map((v,i)=>x(i).toFixed(1)+','+y(v).toFixed(1)).join(' ')}"/>${s.data.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3" fill="${PCOL[si]}"/>`).join('')}`).join('');
  body+=c.labels.map((l,i)=>`<text x="${x(i)}" y="${H-B+14}" text-anchor="middle" font-size="10" fill="#374151">${esc(l)}</text>`).join('')}
 else{const k=c.series.length,bw=Math.min(18,(cw-8)/k);
  body=c.labels.map((l,i)=>{const x0=L+cw*i+(cw-bw*k)/2;return c.series.map((s,si)=>`<rect x="${(x0+si*bw).toFixed(1)}" y="${y(s.data[i]).toFixed(1)}" width="${(bw-1).toFixed(1)}" height="${(y(0)-y(s.data[i])).toFixed(1)}" fill="${PCOL[si]}" rx="2"><title>${esc(s.name)}: ${s.data[i]}</title></rect>`).join('')+`<text x="${(L+cw*i+cw/2).toFixed(1)}" y="${H-B+14}" text-anchor="middle" font-size="9" fill="#374151">${esc(l)}</text>`}).join('')}
 return`<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px" role="img" aria-label="${esc(c.title)}"><text x="${L}" y="${T-1}" font-size="9" fill="#6b7280">${esc(c.unit||'')}</text>${grid}<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#9ca3af"/>${body}</svg>${legend}`}

const CHECK={1:['Есть введение — задание перефразировано своими словами','Есть overview: 2 главные тенденции без мелких цифр','Цифры сгруппированы и сравниваются, а не перечисляются подряд','Разные конструкции: rose sharply / a sharp rise / accounted for','Нет личного мнения и причин','150+ слов, проверены предлоги (from / to / by / at)'],
 g:['Тон соответствует адресату (formal / informal)','Раскрыты все 3 пункта задания, по абзацу на каждый','Правильное начало и конец письма (Yours faithfully / sincerely / Best wishes)','Понятна цель письма в первом абзаце','150+ слов'],
 2:['Ответ на ВСЕ части вопроса (тип эссе определён верно)','Ясная позиция во введении и в заключении — одна и та же','Каждый абзац: topic sentence → объяснение → пример','Связки не в каждом предложении; есть this / such / these для связи','Нет повторов одних и тех же слов, есть точная лексика','Разные структуры: условные, пассив, относительные придаточные','250+ слов, проверены артикли, -s, времена, орфография']};
const WC=t=>(t.trim().match(/\S+/g)||[]).length;

function prac(sub,arg){clearInterval(timerId);
 if(sub==='w')return pracWrite(arg);if(sub==='s')return pracSpeak(arg);if(sub==='d')return pracDict();
 const dr=LSG('ent-eng-drafts')||{},nd=Object.values(dr).filter(d=>d&&d.text&&d.text.trim()).length;
 app.innerHTML=`<div class="fade"><h2>Практика IELTS</h2><p class="mut small">Тренажёры для того, что не проверить обычным тестом. Пиши и говори как на экзамене, а эссе и тексты ответов присылай мне в чат — разберу по критериям IELTS.</p>
 <div class="grid">
 <button class="card topic" data-p="w1"><div class="per">Writing · 20 минут</div><h3 style="margin:.3em 0">Task 1 Academic</h3><div class="small mut">${EW1.length} графиков, таблиц и процессов</div></button>
 <button class="card topic" data-p="wg"><div class="per">Writing · 20 минут</div><h3 style="margin:.3em 0">Task 1 General — письмо</h3><div class="small mut">${EWG.length} заданий</div></button>
 <button class="card topic" data-p="w2"><div class="per">Writing · 40 минут</div><h3 style="margin:.3em 0">Task 2 — эссе</h3><div class="small mut">${EW2.length} тем всех типов</div></button>
 <button class="card topic" data-p="s"><div class="per">Speaking · 11–14 минут</div><h3 style="margin:.3em 0">Speaking</h3><div class="small mut">${ESP1.length} тем Part 1 · ${ESP2.length} карточек Part 2 + вопросы Part 3 · запись голоса</div></button>
 <button class="card topic" data-p="d"><div class="per">Listening · орфография</div><h3 style="margin:.3em 0">Диктант</h3><div class="small mut">${ED.length} фраз: числа, имена по буквам, академические предложения</div></button>
 </div>${nd?`<p class="small mut" style="margin-top:12px">Сохранённых черновиков: ${nd}. Они хранятся на этом устройстве.</p>`:''}</div>`;
 app.onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;const p=b.dataset.p;if(p==='s')prac('s');else if(p==='d')prac('d');else prac('w',{kind:p})};
}

function pracWrite(o){const kind=o.kind;const list=kind==='w1'?EW1:kind==='wg'?EWG:EW2;
 let idx=o.i!=null?o.i:Math.floor(Math.random()*list.length);
 const mins=kind==='w2'?40:20,minW=kind==='w2'?250:150,ck=CHECK[kind==='w1'?1:kind==='wg'?'g':2];
 const it=list[idx],id=kind==='w2'?'t2-'+idx:it.id,prompt=kind==='w2'?it[1]:it.prompt;
 const dr=LSG('ent-eng-drafts')||{};let left=mins*60,run=false;
 const label=kind==='w1'?'Writing Task 1 (Academic)':kind==='wg'?'Writing Task 1 (General Training letter)':'Writing Task 2';
 app.innerHTML=`<div class="fade"><button class="btn alt" id="bk">← Практика</button>
 <div class="row" style="justify-content:space-between;margin-top:14px"><span class="pill">${label}${kind==='w2'?' · '+esc(it[0]):''}${kind==='wg'?' · '+esc(it.tone):''}</span><span class="timer" id="tm">${mins}:00</span></div>
 <select id="pick" aria-label="Выбрать тему" style="width:100%;margin:10px 0">${list.map((x,i)=>`<option value="${i}" ${i===idx?'selected':''}>${i+1}. ${esc(kind==='w2'?x[0]+': '+x[1].slice(0,70)+'…':kind==='wg'?x.prompt.slice(0,80)+'…':x.title)}</option>`).join('')}</select>
 <div class="card"><p style="margin-top:0"><b>${esc(prompt)}</b></p>${kind==='w1'?`<p class="small mut">${esc(it.title)}</p>${chartSVG(it)}`:''}<p class="small mut" style="margin-bottom:0">Write at least ${minW} words. ${kind==='wg'?'Begin your letter: Dear …':''}</p></div>
 <textarea id="tx" class="wbox" placeholder="Пиши здесь по-английски…" spellcheck="false" autocapitalize="sentences">${esc((dr[id]&&dr[id].text)||'')}</textarea>
 <div class="row" style="justify-content:space-between"><span id="wc" class="small"></span><span class="row"><button class="btn alt" id="tgo">▶ Таймер</button><button class="btn alt" id="clr">Очистить</button></span></div>
 <div class="row" style="margin-top:10px"><button class="btn gold" id="cp">📋 Скопировать для проверки</button><button class="btn alt" id="nx">Другая тема</button></div>
 <p class="small mut">Скопируй и вставь в чат с Claude — получишь оценку по 4 критериям и разбор ошибок.</p>
 <details class="card" style="margin-top:10px"><summary><b>Самопроверка перед отправкой</b></summary><ul class="small">${ck.map(c=>`<li>☐ ${esc(c)}</li>`).join('')}</ul></details></div>`;
 const tx=document.getElementById('tx'),wc=document.getElementById('wc'),tm=document.getElementById('tm');
 const upd=()=>{const n=WC(tx.value);wc.innerHTML=`Слов: <b style="color:${n>=minW?'var(--ok)':'inherit'}">${n}</b> / ${minW}`;const d=LSG('ent-eng-drafts')||{};d[id]={text:tx.value,t:Date.now()};LSS('ent-eng-drafts',d)};upd();tx.oninput=upd;
 const fmt=s=>Math.floor(Math.abs(s)/60)+':'+String(Math.abs(s)%60).padStart(2,'0');
 document.getElementById('tgo').onclick=e=>{run=!run;e.target.textContent=run?'⏸ Пауза':'▶ Таймер';clearInterval(timerId);if(run)timerId=setInterval(()=>{left--;tm.textContent=(left<0?'+':'')+fmt(left);tm.style.color=left<0?'var(--bad)':'';},1000)};
 document.getElementById('clr').onclick=()=>{if(confirm('Стереть текст?')){tx.value='';upd()}};
 document.getElementById('bk').onclick=()=>prac();
 document.getElementById('pick').onchange=e=>prac('w',{kind,i:+e.target.value});
 document.getElementById('nx').onclick=()=>{let j;do{j=Math.floor(Math.random()*list.length)}while(j===idx&&list.length>1);prac('w',{kind,i:j})};
 document.getElementById('cp').onclick=e=>{let task=prompt;if(kind==='w1')task+='\n\n'+it.title+'\n'+(it.type==='process'?it.labels.map((l,i)=>'Stage '+(i+1)+': '+l).join('\n'):(it.series?it.series.map(s=>s.name+': '+it.labels.map((l,i)=>l+' '+s.data[i]+(it.unit==='%'?'%':' '+it.unit)).join(', ')).join('\n'):''));
  const txt=`Проверь мой ответ IELTS ${label} по 4 критериям, поставь балл и разбери ошибки.\n\nTASK:\n${task}\n\nMY ANSWER (${WC(tx.value)} words):\n${tx.value}`;
  const ok=()=>{e.target.textContent='✓ Скопировано — вставь в чат';setTimeout(()=>e.target.textContent='📋 Скопировать для проверки',2500)};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,()=>{fallback()});else fallback();
  function fallback(){const t=document.createElement('textarea');t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(_){}t.remove()}};
}

/* Speaking */
let REC=null;
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();const o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},250)}catch(e){}}
function sayQ(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';const V=TTS.pick();if(V[0]){u.voice=V[0];u.lang=V[0].lang}u.rate=0.95;speechSynthesis.speak(u)}
function recUI(){const can=!!(navigator.mediaDevices&&window.MediaRecorder);return can?`<div class="card" style="margin-top:12px"><b>Запись голоса</b><p class="small mut" style="margin:.3em 0">Запиши ответ и послушай: паузы, «эээ», повторы, ошибки. Запись остаётся только на телефоне.</p><div class="row"><button class="btn" id="rec">● Записать</button><span id="recst" class="small mut"></span></div><div id="recout"></div></div>`:`<p class="small mut">Запись голоса не поддерживается этим браузером — записывай себя диктофоном телефона.</p>`}
function recBind(){const b=document.getElementById('rec');if(!b)return;const st=document.getElementById('recst'),out=document.getElementById('recout');
 b.onclick=async()=>{if(REC&&REC.state==='recording'){REC.stop();return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const ch=[];REC=new MediaRecorder(s);REC.ondataavailable=e=>ch.push(e.data);
   REC.onstop=()=>{s.getTracks().forEach(t=>t.stop());const bl=new Blob(ch,{type:REC.mimeType||'audio/mp4'});const u=URL.createObjectURL(bl);out.innerHTML=`<audio controls src="${u}" style="width:100%;margin-top:8px"></audio>`;b.textContent='● Записать снова';st.textContent=''};
   REC.start();b.textContent='■ Остановить';st.textContent='идёт запись…'}catch(e){st.textContent='Нет доступа к микрофону — разреши его в настройках.'}}}
function stopRec(){try{if(REC&&REC.state==='recording')REC.stop()}catch(e){}}
function pracSpeak(mode){stopRec();
 if(!mode){app.innerHTML=`<div class="fade"><button class="btn alt" id="bk">← Практика</button><h2 style="margin-top:14px">Speaking</h2>
 <p class="small mut">Вопрос звучит вслух (🔊 — повторить). Отвечай вслух, как экзаменатору. Не учи ответы наизусть.</p>
 <div class="grid"><button class="card topic" data-m="1"><div class="per">4–5 минут</div><h3 style="margin:.3em 0">Part 1</h3><div class="small mut">Вопросы о тебе. Отвечай 2–3 предложениями: ответ + причина + деталь.</div></button>
 <button class="card topic" data-m="2"><div class="per">3–4 минуты</div><h3 style="margin:.3em 0">Part 2 + Part 3</h3><div class="small mut">Карточка: 1 минута подготовки, 2 минуты речи, затем дискуссия.</div></button>
 <button class="card topic" data-m="f"><div class="per">11–14 минут</div><h3 style="margin:.3em 0">Полный Speaking</h3><div class="small mut">Part 1 → Part 2 → Part 3 подряд, как на экзамене.</div></button></div>
 <div class="card" style="margin-top:12px"><b>Как отправить ответ на проверку</b><p class="small" style="margin:.3em 0">Нажми на микрофон на клавиатуре iPhone и надиктуй ответ (или перепиши его с записи), затем пришли текст мне — разберу лексику, грамматику и связность. Произношение по тексту не оценить, его проверяй по записи.</p></div></div>`;
  document.getElementById('bk').onclick=()=>prac();app.onclick=e=>{const b=e.target.closest('[data-m]');if(b)pracSpeak(b.dataset.m)};return}
 const t1=ESP1[Math.floor(Math.random()*ESP1.length)],c2=ESP2[Math.floor(Math.random()*ESP2.length)];
 let steps=[];
 if(mode==='1'||mode==='f'){const t1b=ESP1.filter(x=>x!==t1)[Math.floor(Math.random()*(ESP1.length-1))];
  steps.push(...t1.slice(1).map(q=>({part:1,topic:t1[0],q})));if(mode==='f')steps.push(...t1b.slice(1).map(q=>({part:1,topic:t1b[0],q})))}
 if(mode==='2'||mode==='f'){steps.push({part:2,card:c2});steps.push(...c2[2].map(q=>({part:3,topic:c2[0],q})))}
 let i=0,cd=0;
 function draw(){clearInterval(timerId);const s=steps[i];
  if(!s){app.innerHTML=`<div class="fade"><h2>Готово!</h2><p>Послушай запись и отметь: где были паузы, повторы, ошибки во временах. Потом попробуй ответить на те же вопросы ещё раз — лучше.</p>${recUI()}<div class="row" style="margin-top:12px"><button class="btn gold" id="again">Ещё раз</button><button class="btn alt" id="bk">← Speaking</button></div></div>`;
   recBind();document.getElementById('again').onclick=()=>pracSpeak(mode);document.getElementById('bk').onclick=()=>pracSpeak();return}
  if(s.part===2){const c=s.card;app.innerHTML=`<div class="fade"><div class="row" style="justify-content:space-between"><span class="pill">Part 2 · ${i+1}/${steps.length}</span><span class="timer" id="tm">1:00</span></div>
   <div class="card" style="margin-top:12px"><p style="margin-top:0"><b>${esc(c[0])}</b></p><p class="small" style="margin:.3em 0">You should say:</p><ul>${c[1].map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
   <p class="small mut" id="ph">Подготовка: 1 минута. Запиши 4–5 ключевых слов, не предложения.</p>
   <textarea class="wbox" style="min-height:90px" placeholder="Заметки…"></textarea>

const DNORM=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/£\s*(\d+)/g,'$1 pounds').replace(/(\d)\s*%/g,'$1 percent').replace(/(\d)[:.](\d)/g,'$1$2').replace(/[^a-z0-9' ]+/g,' ').replace(/(\d)\s+(?=\d)/g,'$1').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
function ddiff(a,b){const n=a.length,m=b.length,D=Array.from({length:n+1},()=>Array(m+1).fill(0));for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
 const out=[];let i=0,j=0;while(i<n&&j<m){if(a[i]===b[j]){out.push(['ok',a[i]]);i++;j++}else if(D[i+1][j]>=D[i][j+1]){out.push(['miss',a[i]]);i++}else{out.push(['extra',b[j]]);j++}}
 while(i<n)out.push(['miss',a[i++]]);while(j<m)out.push(['extra',b[j++]]);return{out,ok:D[0][0],n}}

 app.innerHTML=`<div class="fade"><h2>Результат: ${score} из ${max}</h2><p class="mut small">Время: ${min} мин.</p>
 <div class="card scroll" style="padding:6px"><table><thead><tr><th>Предмет</th><th>Баллы</th><th>Порог</th></tr></thead><tbody>${parts.map(p=>{const s=ESUB.find(z=>z.id===p.sid);const ok=p.sc>=s.min;return`<tr><td>${s.name}</td><td><b>${p.sc}</b> / ${p.mx}</td><td style="color:${ok?'var(--ok)':'var(--bad)'}">${ok?'✓':'✗'} ${s.min}</td></tr>`}).join('')}</tbody></table></div>
 ${full?`<div class="card" style="margin-top:12px"><b>Куда хватает баллов</b><ul class="small">${[[50,'порог для поступления в вузы'],[65,'национальные вузы'],[70,'здравоохранение'],[75,'педагогика и право']].map(([v,t])=>`<li style="color:${score>=v&&passSub?'var(--ok)':'inherit'}">${score>=v&&passSub?'✓':'✗'} ${v}+ — ${t}</li>`).join('')}</ul>${passSub?'':'<p class="small" style="color:var(--bad)">Не пройден порог хотя бы по одному предмету — на настоящем ЕНТ это значит, что поступить нельзя, даже если общий балл высокий.</p>'}<p class="small mut">Для гранта нужно больше: проходной балл на грант зависит от специальности и конкурса.</p></div>`:''}
 <div class="row" style="margin-top:12px"><button class="btn gold" id="again">Ещё попытка</button><button class="btn alt" id="hm">К пробному ЕНТ</button></div>
 <h3 style="margin-top:20px">Разбор ошибок</h3><div id="rev"></div></div>`;
 const rev=document.getElementById('rev');let html='';
 R.blocks.forEach((B,b)=>{const s=ESUB.find(z=>z.id===B.sid),Fx=EFMT(B.sid);const wr=B.items.map((P,i)=>({P,i,g:grade(P,R.ans[key(b,i)]),a:R.ans[key(b,i)]})).filter(x=>x.g<EPTS(x.P.it));
  html+=`<details class="card" style="margin-bottom:10px"><summary><b>${s.name}</b> — ошибок и пропусков: ${wr.length}</summary>${wr.map(({P,i,a})=>{const it=P.it;const yours=!answered(P,a)?'нет ответа':it.t==='s'?Fx(P.opts[a]):it.t==='m'?a.map(j=>Fx(P.opts[j])).join('; '):it.left.map((l,li)=>a[li]==null?'—':Fx(P.right[a[li]])).join('; ');
   const corr=it.t==='s'?it.opts[0]:it.t==='m'?it.ans.join('; '):it.left.map((l,li)=>l+' → '+it.ans[li]).join('; ');
   return`<div style="border-top:1px solid var(--line);padding:10px 0"><div class="small mut">№ ${i+1}${it.ctx?' · '+esc(B.ctx[it.ctx].title):''}</div><b>${Fx(it.q)}</b>${it.code?`<pre class="code">${esc(it.code)}</pre>`:''}<p class="small" style="margin:.3em 0">Твой ответ: <span style="color:var(--bad)">${yours}</span><br>Верно: <span style="color:var(--ok)">${Fx(corr)}</span></p>${it.sol?`<div class="sol"><b>Решение</b><div style="margin-top:6px">${Fx(it.sol).replace(/\n/g,'<br>')}</div></div>`:`<div class="small mut">${Fx(it.expl||'')}</div>`}</div>`}).join('')||'<p class="small">Всё верно!</p>'}</details>`});
 rev.innerHTML=html;
 document.getElementById('again').onclick=()=>eStart(R.kind);document.getElementById('hm').onclick=()=>eHome();
 window.scrollTo({top:0});
}

setHeader();
const start=(location.hash||'#home').slice(1);
go(VIEWS.includes(start)?start:'home');
window.addEventListener('hashchange',()=>{if(window.ENTMODE)return;const h=location.hash.slice(1);if(VIEWS.includes(h))go(h)});
try{if(localStorage.getItem('ent-subj')==='ent')eMode()}catch(e){}

}
