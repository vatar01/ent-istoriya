const EC=[{"id": "r1", "topic": "e3", "title": "The Return of the Saiga", "kind": "Reading", "text": "The saiga antelope, with its distinctive bulbous nose, once roamed the steppes of Central Asia in enormous herds. In the early 1990s, the population in Kazakhstan was estimated at around one million animals. Within a decade, however, uncontrolled hunting, driven largely by demand for the horns of males, had reduced the number to fewer than 40,000.\n\nConservation efforts began in earnest in the mid-2000s. A partnership of government agencies and international organisations established protected areas, strengthened anti-poaching patrols and launched education programmes in rural communities. Progress was slow at first, and in 2015 the species suffered a further setback when a bacterial infection, apparently triggered by unusually warm and humid weather, killed more than 200,000 saigas in a matter of weeks.\n\nRemarkably, the population recovered. Saigas reproduce quickly: females can breed in their first year and frequently give birth to twins. By 2023, aerial surveys counted well over one million animals, and the species' status on the international Red List was improved. This recovery, however, has created new tensions. Some farmers complain that large herds damage crops and compete with livestock for grazing, and the authorities have had to consider ways of managing numbers.\n\nScientists caution that the saiga's future is not yet secure. Because the animals gather in vast groups during the calving season, a single outbreak of disease can still wipe out a significant proportion of the population in a short time.", "code": null, "qs": [{"q": "The saiga population in Kazakhstan fell mainly because of hunting.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "«uncontrolled hunting, driven largely by demand for the horns» — главная причина.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Conservation work started in the early 1990s.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Работа началась в mid-2000s.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "The 2015 deaths were caused by hunters.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Причина — бактериальная инфекция, а не охота.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Saiga meat is popular in local restaurants.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "О мясе в тексте ничего нет.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Why does the writer say the saiga's future is not secure?", "opts": ["Large gatherings make the animals vulnerable to disease.", "Hunting has started to increase again.", "Females now breed less often.", "Farmers have destroyed protected areas."], "expl": "Последний абзац: из-за больших скоплений одна вспышка болезни может погубить многих."}]}, {"id": "r2", "topic": "e3", "title": "Why We Forget", "kind": "Reading", "text": "For more than a century, psychologists have tried to explain why memories fade. In the 1880s, the German researcher Hermann Ebbinghaus memorised lists of nonsense syllables and tested himself at intervals. He found that most forgetting happens very soon after learning: within a day, a large part of new material is lost, after which the rate of forgetting slows considerably. This pattern became known as the \"forgetting curve\".\n\nEbbinghaus also discovered that reviewing material at increasing intervals greatly reduces forgetting. Modern researchers call this \"spaced repetition\", and it underlies many popular language-learning apps. Studies consistently show that students who spread their revision over several weeks remember more than those who study the same amount in a single intensive session, a practice often called \"cramming\".\n\nAnother powerful technique is \"retrieval practice\" — actively recalling information rather than simply rereading it. In one well-known experiment, students who tested themselves on a text remembered significantly more a week later than students who read it several times, even though the second group felt more confident about their learning.\n\nNot all forgetting, however, is a failure. Some researchers argue that the brain deliberately discards information it judges to be unimportant, freeing capacity for what matters. From this perspective, forgetting is not a flaw in memory but an essential part of how it works.", "code": null, "qs": [{"q": "According to Ebbinghaus, forgetting is fastest:", "opts": ["shortly after learning", "after about a week", "at a steady rate over time", "only with meaningful material"], "expl": "«most forgetting happens very soon after learning»."}, {"q": "Ebbinghaus used real words in his experiments.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Он учил nonsense syllables — бессмысленные слоги.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Cramming is more effective than spaced revision.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Распределённое повторение даёт лучший результат.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "In the experiment, students who reread the text:", "opts": ["felt more confident but remembered less", "remembered more after a week", "stopped studying early", "used spaced repetition apps"], "expl": "Вторая группа была увереннее, но запомнила меньше."}, {"q": "Most language-learning apps were designed by psychologists.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "Сказано, что идея лежит в основе приложений, но кто их создал — не сказано.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}]}, {"id": "r3", "topic": "e3", "title": "The Four-Day Working Week", "kind": "Reading", "text": "In recent years, a growing number of companies have experimented with a four-day working week, in which employees work around 32 hours for the same pay. The largest trial to date took place in the United Kingdom in 2022, when roughly 60 organisations reduced working hours for six months.\n\nThe results were striking. The majority of participating companies chose to continue with the shorter week after the trial ended, and staff reported lower levels of stress and burnout. Many firms found that productivity was maintained, largely because meetings were shortened and unnecessary tasks were eliminated.\n\nIn my view, however, these findings should be interpreted with caution. The companies that took part volunteered to do so, and it seems likely that they were already well suited to flexible working. Most were relatively small businesses in office-based sectors such as marketing and software. It would be a mistake to assume that a hospital, a school or a factory could cut hours without hiring additional staff.\n\nNone of this means that the idea should be abandoned. Rather, I believe governments should encourage further trials across a wider range of industries before drawing firm conclusions. The four-day week may well be the future of work, but the evidence is not yet strong enough to justify making it compulsory.", "code": null, "qs": [{"q": "The writer thinks the UK trial results can be applied to all industries.", "opts": ["NO", "YES", "NOT GIVEN"], "expl": "Автор считает, что больницы, школы и заводы не смогут так легко сократить часы.", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "The writer believes the participating companies may not be typical.", "opts": ["YES", "NO", "NOT GIVEN"], "expl": "«they were already well suited to flexible working».", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "The writer thinks a four-day week should be made compulsory now.", "opts": ["NO", "YES", "NOT GIVEN"], "expl": "«the evidence is not yet strong enough to justify making it compulsory».", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "The writer has personally worked a four-day week.", "opts": ["NOT GIVEN", "YES", "NO"], "expl": "О личном опыте автора ничего нет.", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "According to the text, productivity was maintained mainly because:", "opts": ["meetings were shorter and unnecessary work was cut", "employees worked longer days", "new staff were hired", "salaries were increased"], "expl": "Второй абзац."}]}, {"id": "r4", "topic": "e3", "title": "Vertical Farming", "kind": "Reading", "text": "A. Vertical farming is the practice of growing crops in stacked layers, usually indoors and under artificial light. Instead of soil, many systems use hydroponics, in which plant roots sit in water enriched with nutrients. Because the environment is fully controlled, crops can be produced all year round, regardless of the weather outside.\n\nB. Supporters point to several advantages. Vertical farms use far less land than conventional agriculture and, because water is recycled, they can reduce water consumption by up to 90 per cent. As there are no insects to control, pesticides are rarely needed. Farms can also be built inside cities, cutting the distance food travels to consumers.\n\nC. Yet the industry faces a serious obstacle: energy. Replacing sunlight with LED lamps requires enormous amounts of electricity, and in many countries that electricity is still generated from fossil fuels. Several well-funded vertical farming companies have gone bankrupt in recent years, largely because energy prices rose faster than they had anticipated.\n\nD. For now, vertical farms are mostly limited to high-value, fast-growing crops such as lettuce, herbs and strawberries. Staple crops like wheat and rice take too long to grow and occupy too much space to be profitable indoors. Experts suggest that vertical farming will complement traditional agriculture rather than replace it.", "code": null, "qs": [{"q": "Which paragraph explains the main financial problem of vertical farming?", "opts": ["Paragraph C", "Paragraph A", "Paragraph B", "Paragraph D"], "expl": "Абзац C — энергия и банкротства."}, {"q": "Which paragraph describes the basic method of vertical farming?", "opts": ["Paragraph A", "Paragraph B", "Paragraph C", "Paragraph D"], "expl": "Абзац A — слои, искусственный свет, гидропоника."}, {"q": "Vertical farms need almost no pesticides.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "«pesticides are rarely needed».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Vertical farming is now widely used for growing rice.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Рис и пшеница невыгодны в помещении.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Experts believe that vertical farming will:", "opts": ["work alongside traditional farming", "completely replace traditional farming", "disappear within ten years", "only be used in deserts"], "expl": "«complement traditional agriculture rather than replace it»."}]}, {"id": "r5", "topic": "e3", "title": "The Silk Road and the Spread of Ideas", "kind": "Reading", "text": "The term \"Silk Road\" was coined in 1877 by the German geographer Ferdinand von Richthofen to describe the network of trade routes that linked China with the Mediterranean world. Despite its name, the network carried far more than silk. Merchants transported spices, paper, glass, horses and precious metals, and few traders travelled the entire distance; instead, goods passed from hand to hand through a chain of cities and markets.\n\nSome of the most important cities on these routes lay in Central Asia. Towns such as Otrar and Taraz, in what is now Kazakhstan, grew wealthy by providing traders with food, shelter and protection. They also became centres of learning, where scholars from different cultures met and exchanged knowledge.\n\nPerhaps the most significant cargo was intangible. Religions, including Buddhism and later Islam, spread along the routes, as did technologies such as papermaking. Historians generally agree that papermaking reached the Islamic world from China in the eighth century, and from there gradually spread to Europe.\n\nThe decline of the overland routes was gradual. From the fifteenth century onwards, European sailors opened sea routes to Asia, which were often cheaper and safer for transporting large quantities of goods. In 2013, China announced the Belt and Road Initiative, a modern infrastructure project which is often described as a \"new Silk Road\".", "code": null, "qs": [{"q": "Who invented the term \"Silk Road\"?", "opts": ["a German geographer in the 19th century", "Chinese merchants", "a historian from Otrar", "European sailors"], "expl": "Ferdinand von Richthofen, 1877."}, {"q": "Most traders travelled the whole route from China to the Mediterranean.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "«few traders travelled the entire distance».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Otrar was the largest city on the Silk Road.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "Сказано, что Отрар был важным и богатым, но не самым большим.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "According to the text, papermaking spread:", "opts": ["from China to the Islamic world and then to Europe", "from Europe to China", "from Otrar to China", "directly from China to Europe by sea"], "expl": "Третий абзац."}, {"q": "Why did the overland routes decline?", "opts": ["Sea routes were often cheaper and safer", "Silk became unfashionable", "Cities in Central Asia were abandoned for no reason", "The Belt and Road Initiative replaced them"], "expl": "Морские пути с XV века."}]}, {"id": "r6", "topic": "e3", "title": "Urban Heat Islands", "kind": "Reading", "text": "On a summer evening, the centre of a large city can be several degrees warmer than the surrounding countryside. This phenomenon, known as the urban heat island effect, occurs because materials such as concrete and asphalt absorb heat during the day and release it slowly at night. The lack of vegetation makes the problem worse, since trees and plants cool the air through a process called evapotranspiration.\n\nThe consequences are more than a matter of comfort. Higher temperatures increase demand for air conditioning, which in turn raises energy consumption and emissions. During heatwaves, heat islands also pose a serious risk to health, particularly for elderly people and those with existing medical conditions.\n\nCities have adopted a range of strategies to tackle the problem. Planting trees along streets is among the most effective, as is the creation of \"green roofs\" covered with plants. Some cities have experimented with \"cool roofs\" and pavements painted with reflective coatings that bounce sunlight back into the atmosphere. In Los Angeles, for example, reflective coatings have been applied to selected streets.\n\nHowever, researchers point out that such measures must be planned carefully. Reflective surfaces, for instance, can increase the amount of heat that pedestrians feel, as sunlight is reflected upwards towards them.", "code": null, "qs": [{"q": "The heat island effect is strongest:", "opts": ["in the evening and at night", "early in the morning only", "in winter", "in rural areas"], "expl": "Материалы отдают тепло медленно ночью."}, {"q": "Plants help to cool the air.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "Evapotranspiration — растения охлаждают воздух.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Heat islands mainly affect young people.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Особенно опасно для пожилых людей.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Green roofs are cheaper than cool roofs.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "О стоимости ничего не сказано.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "What problem with reflective surfaces do researchers mention?", "opts": ["They can make pedestrians feel hotter", "They are too expensive to maintain", "They damage trees", "They increase air conditioning use"], "expl": "Последний абзац."}]}, {"id": "l1", "topic": "e2", "title": "Booking a Language Course", "kind": "Listening · Part 1", "text": "Receptionist: Good morning, Riverside Language School. How can I help you?\nStudent: Hi, I'd like to enrol on one of your evening English courses.\nReceptionist: Of course. Can I take your name, please?\nStudent: Yes, it's Daniyar Seitkali. That's S-E-I-T-K-A-L-I.\nReceptionist: Thank you. And which course are you interested in? We have General English and IELTS Preparation.\nStudent: IELTS Preparation, please. I need band seven point five for university.\nReceptionist: OK. The IELTS course runs on Tuesdays and Thursdays. Classes used to start at six, but from this term they start at half past six and finish at eight thirty.\nStudent: That's fine. How much does it cost?\nReceptionist: The full ten-week course is two hundred and forty pounds, but students get a fifteen per cent discount if they show their student card.\nStudent: Great, I'm a student. When does it begin?\nReceptionist: The next course starts on the fourteenth of January. Oh, sorry — I'm looking at last year's timetable. It's the twenty-first of January.\nStudent: Perfect. And do I need to buy a book?\nReceptionist: No, all materials are provided, but please bring your own headphones for the listening practice.", "code": null, "qs": [{"q": "What is the student's surname?", "opts": ["Seitkali", "Seitkaly", "Saitkali", "Seitkhali"], "expl": "Фамилия продиктована по буквам: S-E-I-T-K-A-L-I."}, {"q": "What time do classes start now?", "opts": ["6:30 pm", "6:00 pm", "8:30 pm", "7:00 pm"], "expl": "«used to start at six, but from this term… half past six»."}, {"q": "What is the full price before the discount?", "opts": ["£240", "£215", "£204", "£150"], "expl": "Two hundred and forty pounds."}, {"q": "When does the course begin?", "opts": ["21 January", "14 January", "24 January", "12 January"], "expl": "Исправление: twenty-first, а не fourteenth."}, {"q": "What must students bring?", "opts": ["headphones", "a textbook", "a laptop", "a dictionary"], "expl": "«bring your own headphones»."}], "audio": true}, {"id": "l2", "topic": "e2", "title": "A Tour of the City Museum", "kind": "Listening · Part 2", "text": "Good afternoon, everyone, and welcome to the City Museum. My name is Sarah, and I'll be your guide today. Before we begin, a few practical points. The tour lasts about ninety minutes, and we'll finish in the main hall. Photography is allowed in most rooms, but please don't use a flash, as it can damage the older paintings.\n\nWe'll start on the ground floor with the natural history collection. The highlight here is the skeleton of a mammoth, which was discovered by a farmer in nineteen fifty-two. Then we'll take the lift to the first floor, where you'll find the costume gallery. Many visitors expect it to be small, but it's actually our largest gallery, with over three thousand items.\n\nPlease note that the second floor is closed this week for repairs to the roof, so unfortunately you won't be able to see the coin collection today.\n\nAt the end of the tour, you're welcome to visit the café, which is next to the gift shop. Today, anyone with a tour ticket gets a free coffee there — just show your ticket at the counter.", "code": null, "qs": [{"q": "How long does the tour last?", "opts": ["about 90 minutes", "about 60 minutes", "about 2 hours", "about 30 minutes"], "expl": "Ninety minutes."}, {"q": "What are visitors asked NOT to do?", "opts": ["use a flash", "take photos", "touch the skeleton", "eat in the main hall"], "expl": "Фотографировать можно, но без вспышки."}, {"q": "When was the mammoth skeleton found?", "opts": ["1952", "1925", "1962", "1953"], "expl": "Nineteen fifty-two."}, {"q": "What is special about the costume gallery?", "opts": ["It is the largest gallery", "It is the smallest gallery", "It is closed today", "It contains coins"], "expl": "«actually our largest gallery»."}, {"q": "What can people with a tour ticket get today?", "opts": ["a free coffee", "a discount in the gift shop", "free entry to the second floor", "a free guidebook"], "expl": "Free coffee in the café."}], "audio": true}, {"id": "l3", "topic": "e2", "title": "Planning a Research Project", "kind": "Listening · Part 3", "text": "Tutor: So, Aigerim and Ben, how is your project on public transport going?\nAigerim: Quite well, I think. We've decided to focus on why young people choose buses over cars.\nBen: Originally we wanted to look at the whole city, but that was too ambitious, so we've limited it to students at our university.\nTutor: Sensible. How are you collecting data?\nAigerim: We considered interviews, but they take too long. So we're going to use an online questionnaire.\nTutor: Good. How many responses are you aiming for?\nBen: We'd hoped for five hundred, but realistically we think two hundred is achievable.\nTutor: That should be enough. What do you think will be the main finding?\nAigerim: Well, I expected cost to be the main reason, but our pilot study suggests it's actually convenience — students don't want to look for parking.\nBen: I'm not so sure. I think environmental concerns matter more than Aigerim believes.\nTutor: That's why you need the data. When is your deadline?\nBen: The draft is due on the third of May, and the final report two weeks later.", "code": null, "qs": [{"q": "What is the focus of the project?", "opts": ["why young people choose buses", "the history of the city's buses", "the cost of cars in the city", "traffic accidents"], "expl": "Первая реплика Aigerim."}, {"q": "Who will take part in the study?", "opts": ["students at their university", "everyone in the city", "bus drivers", "car owners only"], "expl": "«limited it to students at our university»."}, {"q": "How will they collect data?", "opts": ["an online questionnaire", "face-to-face interviews", "phone calls", "observing bus stops"], "expl": "Интервью отвергли — слишком долго."}, {"q": "How many responses do they now expect?", "opts": ["200", "500", "250", "150"], "expl": "«realistically… two hundred»."}, {"q": "According to the pilot study, the main reason is:", "opts": ["convenience", "cost", "environmental concerns", "safety"], "expl": "Aigerim: «it's actually convenience». Мнение Ben — не результат исследования."}], "audio": true}, {"id": "l4", "topic": "e2", "title": "Lecture: The Importance of Sleep", "kind": "Listening · Part 4", "text": "Today I'd like to talk about sleep, and in particular why it matters so much for learning. Most adults need between seven and nine hours a night, while teenagers typically need slightly more — around eight to ten.\n\nSleep is not a single state. It consists of cycles, each lasting roughly ninety minutes, and each cycle includes several stages. The deepest stage, known as slow-wave sleep, appears to be especially important for consolidating facts — what psychologists call declarative memory. REM sleep, on the other hand, seems to play a role in emotional processing and creativity.\n\nOne common belief is that we can \"catch up\" on lost sleep at the weekend. Research suggests this is only partly true. Although extra sleep can reduce tiredness, it does not fully reverse the effects of a week of poor sleep on attention and memory.\n\nSo what practical advice can we give students? First, keep a regular schedule, even at weekends. Second, avoid bright screens in the hour before bed, since blue light delays the release of melatonin, the hormone that signals it is time to sleep. And finally, if you are studying for an exam, remember that a full night's sleep after revising is likely to help you remember more than staying up late to study.", "code": null, "qs": [{"q": "How much sleep do teenagers typically need?", "opts": ["8–10 hours", "7–9 hours", "6–8 hours", "10–12 hours"], "expl": "Teenagers — eight to ten."}, {"q": "How long does one sleep cycle last?", "opts": ["about 90 minutes", "about 60 minutes", "about 2 hours", "about 30 minutes"], "expl": "Roughly ninety minutes."}, {"q": "Slow-wave sleep is especially important for:", "opts": ["remembering facts", "creativity", "emotional processing", "dreaming"], "expl": "Declarative memory = факты. REM — эмоции и креативность."}, {"q": "What does the lecturer say about catching up on sleep at weekends?", "opts": ["It only partly helps", "It completely solves the problem", "It makes tiredness worse", "It improves memory more than regular sleep"], "expl": "«only partly true»."}, {"q": "Why should students avoid screens before bed?", "opts": ["Blue light delays melatonin", "Screens make them hungry", "It damages their eyes permanently", "They forget what they studied"], "expl": "Синий свет задерживает выработку мелатонина."}], "audio": true}, {"id": "l5", "topic": "e2", "title": "Renting a Flat", "kind": "Listening · Part 1", "text": "Agent: Hello, Green Lane Lettings, Mark speaking.\nCaller: Hi, I'm calling about the two-bedroom flat on Station Road that's advertised online.\nAgent: Ah yes, number forty-seven. It's still available.\nCaller: Great. The advert says the rent is nine hundred pounds a month. Does that include bills?\nAgent: It includes water, but not gas or electricity. Internet is included too.\nCaller: OK. Is there any parking?\nAgent: There's no private parking, I'm afraid, but there's a bus stop right outside and the train station is a five-minute walk.\nCaller: And what about the deposit?\nAgent: The deposit is one month's rent, so nine hundred pounds, paid before you move in.\nCaller: When could I view it?\nAgent: I could show you round on Friday at four o'clock — no, wait, I have another viewing then. Saturday morning at ten?\nCaller: Saturday at ten is fine. My name is Laura Bennett — that's B-E-double N-E-double T.\nAgent: Lovely. See you on Saturday, Laura.", "code": null, "qs": [{"q": "What is the house number?", "opts": ["47", "74", "407", "45"], "expl": "Forty-seven."}, {"q": "Which of these is NOT included in the rent?", "opts": ["electricity", "water", "internet", "none of them"], "expl": "Water и internet включены; gas и electricity — нет."}, {"q": "How much is the deposit?", "opts": ["£900", "£450", "£1,800", "£90"], "expl": "Один месяц аренды."}, {"q": "When will the viewing take place?", "opts": ["Saturday at 10 am", "Friday at 4 pm", "Saturday at 4 pm", "Friday at 10 am"], "expl": "Пятница не подошла — суббота в 10."}, {"q": "How is the caller's surname spelled?", "opts": ["Bennett", "Benett", "Bennet", "Benet"], "expl": "B-E-double N-E-double T = Bennett."}], "audio": true}, {"id": "r7", "topic": "e3", "title": "The Science of Bilingualism", "kind": "Reading", "text": "For much of the twentieth century, many educators believed that raising children with two languages would confuse them and slow their development. Early studies seemed to support this view, but they were later criticised for comparing children from very different social backgrounds.\n\nResearch since the 1960s has painted a more positive picture. Bilingual children often perform better on tasks that require them to ignore distracting information or switch between activities. Psychologists suggest that constantly managing two languages exercises the brain's \"executive control\" system, which is responsible for attention and planning.\n\nSome studies have even linked lifelong bilingualism to a later onset of dementia symptoms, by around four to five years on average. However, not all researchers agree. Several large studies have failed to find a clear cognitive advantage, and critics argue that positive results are more likely to be published than negative ones.\n\nWhat is not disputed is that bilingual children do not suffer long-term harm. Although they may initially know fewer words in each individual language than monolingual children, their total vocabulary across both languages is usually similar, and the gap in each language tends to close as they grow older.", "code": null, "qs": [{"q": "Early studies on bilingualism were criticised because:", "opts": ["they compared children from different social backgrounds", "they used too few languages", "they were never published", "they only studied adults"], "expl": "Первый абзац."}, {"q": "The executive control system is responsible for:", "opts": ["attention and planning", "vocabulary size", "pronunciation", "long-term memory of words"], "expl": "Второй абзац."}, {"q": "All researchers agree that bilingualism improves cognitive ability.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "«not all researchers agree».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Bilingual children usually know fewer words in total than monolingual children.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Общий словарь по двум языкам обычно сопоставим.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Bilingual children learn to read earlier than monolingual children.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "О чтении ничего не сказано.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}]}, {"id": "r8", "topic": "e3", "title": "The Story of Coffee", "kind": "Reading", "text": "According to a popular legend, coffee was discovered by an Ethiopian goat herder who noticed that his animals became unusually energetic after eating the red berries of a certain shrub. Historians regard the story as a myth, since it first appears in writing only in the seventeenth century, long after coffee had become widespread.\n\nThe earliest reliable evidence of coffee drinking comes from fifteenth-century Yemen, where members of religious communities drank it to stay awake during night-time prayers. From there, coffee spread to Mecca, Cairo and Istanbul. The first coffee houses quickly became places for conversation, music and the exchange of news, which led some rulers to view them with suspicion and even attempt to close them.\n\nCoffee reached Europe in the seventeenth century through trade with the Ottoman Empire. Within a few decades, London alone had hundreds of coffee houses, some of which developed into important businesses. One famous example, Lloyd's Coffee House, was frequented by ship owners and merchants and eventually gave its name to a major insurance market.\n\nToday, coffee is one of the most widely traded agricultural products in the world. Most of it is grown in a belt of tropical countries, with Brazil the largest producer by a wide margin.", "code": null, "qs": [{"q": "Historians think the goat herder story is untrue because:", "opts": ["it was first written down much later", "goats do not eat berries", "Ethiopia has no coffee plants", "it contradicts religious texts"], "expl": "Впервые записана только в XVII веке."}, {"q": "In Yemen, coffee was first drunk:", "opts": ["to stay awake during prayers", "as a medicine for goats", "at royal banquets", "by sailors"], "expl": "Второй абзац."}, {"q": "Some rulers disliked early coffee houses.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "«view them with suspicion and even attempt to close them».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Lloyd's Coffee House was owned by a ship owner.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "Сказано, что её посещали судовладельцы, а не кто владел.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Brazil produces only slightly more coffee than other countries.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "«the largest producer by a wide margin» — со значительным отрывом.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}]}, {"id": "r9", "topic": "e3", "title": "Should Homework Be Abolished?", "kind": "Reading", "text": "Few school practices provoke as much argument among parents as homework. Some countries, including Finland, are often praised for giving relatively little, while in others pupils may spend several hours a night on assignments.\n\nThe research evidence is more nuanced than either side admits. Studies generally find a modest positive link between homework and achievement for older secondary students, but little or no benefit for young children in primary school. The quality of tasks appears to matter more than their quantity; a short, well-designed exercise that reinforces a lesson is more valuable than hours of repetitive worksheets.\n\nI believe that banning homework altogether would be a mistake. For teenagers preparing for important examinations, independent study is essential, and learning to organise one's own time is a skill that will be needed at university and at work. Nevertheless, I am convinced that schools should drastically reduce the amount given to younger pupils, whose time would be better spent reading for pleasure, playing and sleeping.\n\nWhat is needed, in my view, is not a single national rule but clear guidance for teachers, based on the age of the child and the purpose of each task.", "code": null, "qs": [{"q": "The writer believes homework should be completely banned.", "opts": ["NO", "YES", "NOT GIVEN"], "expl": "«banning homework altogether would be a mistake».", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "The writer thinks younger pupils get too much homework.", "opts": ["YES", "NO", "NOT GIVEN"], "expl": "«schools should drastically reduce the amount given to younger pupils».", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "The writer believes Finland's education system is the best in the world.", "opts": ["NOT GIVEN", "YES", "NO"], "expl": "Финляндия упомянута, но мнения автора о ней нет.", "tf": ["YES", "NO", "NOT GIVEN"]}, {"q": "According to research, homework is most useful for:", "opts": ["older secondary students", "primary school children", "all ages equally", "university students only"], "expl": "Второй абзац."}, {"q": "What does the writer recommend?", "opts": ["guidance for teachers based on age and purpose", "one national rule for all schools", "more worksheets", "longer school days"], "expl": "Последний абзац."}]}, {"id": "r10", "topic": "e3", "title": "Bioluminescence in the Ocean", "kind": "Reading", "text": "A. Bioluminescence is the production of light by living organisms. It occurs through a chemical reaction in which a substance called luciferin reacts with oxygen, usually with the help of an enzyme known as luciferase. The result is light that produces very little heat, which is why it is sometimes called \"cold light\".\n\nB. On land, bioluminescence is relatively rare; fireflies are the best-known example. In the deep ocean, however, it is extremely common. Scientists estimate that around three quarters of animals living in the open ocean between the surface and a depth of about 4,000 metres can produce light.\n\nC. Marine animals use their light for a range of purposes. The anglerfish dangles a glowing lure in front of its mouth to attract prey. Some species of squid release clouds of luminous fluid to confuse predators, much as other squid use ink. Many small animals have light organs on their undersides that match the faint light coming from above, making them less visible to predators looking up from below — a technique known as counter-illumination.\n\nD. Bioluminescence also has practical applications. Genes responsible for producing light have been used in medical research, allowing scientists to track the spread of diseases and the activity of cells inside living organisms.", "code": null, "qs": [{"q": "Which paragraph explains how animals avoid being seen from below?", "opts": ["Paragraph C", "Paragraph A", "Paragraph B", "Paragraph D"], "expl": "Counter-illumination — абзац C."}, {"q": "Which paragraph describes the chemistry of bioluminescence?", "opts": ["Paragraph A", "Paragraph B", "Paragraph C", "Paragraph D"], "expl": "Luciferin и luciferase — абзац A."}, {"q": "Bioluminescence produces a lot of heat.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "«very little heat», «cold light».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "About 75% of open-ocean animals down to 4,000 m can produce light.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "«around three quarters».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "The anglerfish uses its light to:", "opts": ["attract prey", "confuse predators", "communicate with partners", "hide from predators"], "expl": "Glowing lure — приманка."}]}, {"id": "r11", "topic": "e3", "title": "The Rise of Online Shopping", "kind": "Reading", "text": "Online retail has transformed the way people buy goods. In many developed countries, a substantial share of all retail sales now takes place on the internet, and the COVID-19 pandemic accelerated this trend significantly, as physical shops were temporarily closed and consumers became used to ordering everything from groceries to furniture online.\n\nConvenience is the most frequently cited reason for shopping online. Customers can compare prices instantly and have items delivered to their door, often within a day. For people living in remote areas or with limited mobility, online shopping can provide access to products that would otherwise be difficult to obtain.\n\nThe growth of e-commerce has not been without costs, however. Many town centres have seen shops close, and the jobs lost in traditional retail are not always replaced by equivalent positions in warehouses and delivery. Environmental concerns have also been raised: frequent small deliveries increase traffic, and a large proportion of items bought online, particularly clothes, are returned, generating additional transport and packaging waste.\n\nSome retailers have responded by combining online and physical services, for instance by allowing customers to order online and collect items from a store. Experts believe that such \"hybrid\" models are likely to become increasingly common.", "code": null, "qs": [{"q": "According to the text, the pandemic:", "opts": ["speeded up the growth of online shopping", "stopped online shopping", "had no effect on retail", "reduced home deliveries"], "expl": "«accelerated this trend significantly»."}, {"q": "The most common reason people give for shopping online is:", "opts": ["convenience", "lower prices", "better quality", "environmental benefits"], "expl": "«Convenience is the most frequently cited reason»."}, {"q": "Jobs lost in shops are always replaced by jobs in warehouses.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "«not always replaced».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Clothes are returned more often than other items bought online.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "«a large proportion of items… particularly clothes, are returned».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Hybrid shops are cheaper to run than online-only shops.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "О стоимости ничего не сказано.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}]}, {"id": "r12", "topic": "e3", "title": "The Aral Sea Disaster", "kind": "Reading", "text": "Until the 1960s, the Aral Sea, which lies between Kazakhstan and Uzbekistan, was the fourth-largest lake in the world. It was fed by two great rivers, the Amu Darya and the Syr Darya. In the Soviet era, however, much of the water of these rivers was diverted to irrigate vast cotton fields in the surrounding desert.\n\nThe consequences were catastrophic. Deprived of its inflow, the sea began to shrink rapidly. By the early twenty-first century, it had lost the greater part of its surface area and split into separate bodies of water. The fishing industry, which had once employed tens of thousands of people, collapsed, and former port towns such as Aralsk were left many kilometres from the shore. Winds carried salt and dust from the exposed seabed across the region, contributing to health problems among local residents.\n\nIn 2005, Kazakhstan completed the Kokaral Dam, which separates the northern part of the sea, known as the Small Aral, from the southern part. The project, supported by the World Bank, raised the water level of the Small Aral, reduced its salinity and allowed fish stocks to return. Fishing has since resumed on a commercial scale.\n\nThe southern part of the sea, by contrast, has continued to shrink, and scientists consider its full restoration unlikely.", "code": null, "qs": [{"q": "Why did the Aral Sea begin to shrink?", "opts": ["River water was used to irrigate cotton fields", "The climate became much colder", "An earthquake changed the rivers", "Too many fish were caught"], "expl": "Первый абзац."}, {"q": "The Aral Sea was once the largest lake in the world.", "opts": ["FALSE", "TRUE", "NOT GIVEN"], "expl": "Он был четвёртым по величине.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "Dust from the dry seabed affected people's health.", "opts": ["TRUE", "FALSE", "NOT GIVEN"], "expl": "«contributing to health problems among local residents».", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}, {"q": "What was one result of the Kokaral Dam?", "opts": ["Fish returned to the Small Aral", "The southern sea was fully restored", "Cotton farming stopped", "Aralsk became a port again immediately"], "expl": "Рыба вернулась, рыболовство возобновилось."}, {"q": "The Kokaral Dam cost more than any other project in Kazakhstan.", "opts": ["NOT GIVEN", "TRUE", "FALSE"], "expl": "О стоимости в тексте ничего нет.", "tf": ["TRUE", "FALSE", "NOT GIVEN"]}]}, {"id": "l6", "topic": "e2", "title": "Joining a Sports Centre", "kind": "Listening · Part 1", "text": "Receptionist: Good afternoon, Lakeside Sports Centre.\nCaller: Hello, I'd like some information about membership, please.\nReceptionist: Of course. We have two options. Standard membership is thirty-five pounds a month and includes the gym and the swimming pool. Premium is fifty pounds and also includes fitness classes and the sauna.\nCaller: I think standard is enough for me. Is there a joining fee?\nReceptionist: Normally it's twenty pounds, but this month there's no joining fee at all.\nCaller: Great. What are your opening hours?\nReceptionist: Monday to Friday we're open from six in the morning until ten at night. At weekends we open at eight and close at eight.\nCaller: And do I need to bring anything when I come to register?\nReceptionist: Just a photo for your membership card and some proof of address, like a utility bill. Oh, and we'll need your date of birth.\nCaller: Fine. Can I register online?\nReceptionist: Not at the moment, I'm afraid — our website is being updated. You'll need to come in person.\nCaller: OK. My name's Arman Zhunusov, by the way. That's Z-H-U-N-U-S-O-V.\nReceptionist: Thank you, Arman. We look forward to seeing you.", "code": null, "qs": [{"q": "How much is standard membership per month?", "opts": ["£35", "£50", "£20", "£15"], "expl": "Thirty-five pounds."}, {"q": "What is the joining fee this month?", "opts": ["nothing", "£20", "£35", "£10"], "expl": "«this month there's no joining fee at all»."}, {"q": "What time does the centre close on Saturdays?", "opts": ["8 pm", "10 pm", "6 pm", "8 am"], "expl": "At weekends… close at eight."}, {"q": "Why can't the caller register online?", "opts": ["the website is being updated", "he is too young", "online registration costs extra", "the centre is full"], "expl": "Сайт обновляется."}, {"q": "How is the caller's surname spelled?", "opts": ["Zhunusov", "Zhunusof", "Zunusov", "Zhunussov"], "expl": "Z-H-U-N-U-S-O-V."}], "audio": true}, {"id": "l7", "topic": "e2", "title": "Welcome to Greenfield University", "kind": "Listening · Part 2", "text": "Good morning, and welcome to Greenfield University. I'm Dr Patel, and I'm responsible for international students. I'd like to give you some key information for your first week.\n\nFirst, registration. All new students must register by Friday this week. You can do this in the Student Centre, which is the large glass building opposite the main library. Please bring your passport and your offer letter.\n\nSecond, the library. Your student card gives you access to the library twenty-four hours a day during term time. You can borrow up to fifteen books at a time, and each loan lasts three weeks. If you return a book late, there's a fine of fifty pence per day.\n\nThird, support. If you're feeling homesick or stressed, our counselling service is free and confidential. The service used to be in the main building, but it has now moved to the Health Centre, next to the sports hall.\n\nFinally, the welcome party takes place on Thursday evening at seven o'clock in the Great Hall. It's a great chance to meet other students, and there'll be food from around the world.", "code": null, "qs": [{"q": "Where is the Student Centre?", "opts": ["opposite the main library", "next to the sports hall", "in the Great Hall", "behind the Health Centre"], "expl": "«opposite the main library»."}, {"q": "How many books can students borrow at once?", "opts": ["15", "50", "3", "5"], "expl": "Up to fifteen books."}, {"q": "What is the fine for late books?", "opts": ["50p per day", "£5 per day", "15p per day", "£1 per week"], "expl": "Fifty pence per day."}, {"q": "Where is the counselling service now?", "opts": ["in the Health Centre", "in the main building", "in the library", "in the Student Centre"], "expl": "Переехал в Health Centre."}, {"q": "When is the welcome party?", "opts": ["Thursday at 7 pm", "Friday at 7 pm", "Thursday at 11 am", "Friday morning"], "expl": "Thursday evening at seven."}], "audio": true}, {"id": "l8", "topic": "e2", "title": "Discussing a Presentation", "kind": "Listening · Part 3", "text": "Tutor: So, Maria and Tom, you're presenting next week on plastic pollution. How's the preparation going?\nMaria: Pretty well. We've divided the topic into three parts: causes, effects on marine life, and possible solutions.\nTom: I'm doing causes and solutions, and Maria's covering marine life because she did a biology course last year.\nTutor: Good. How long is the presentation?\nMaria: Fifteen minutes, plus five minutes for questions.\nTutor: Have you decided how to present your data?\nTom: We were going to use tables, but they're hard to read on a screen, so we've decided to use bar charts instead.\nTutor: Sensible. What do you see as the most effective solution?\nTom: Personally, I think a tax on plastic bags is the most effective, because it changes people's behaviour quickly.\nMaria: I disagree a bit. The research we read suggests that improving recycling systems has the biggest long-term impact.\nTutor: Interesting — you could present both views and let the audience decide. One more thing: make sure you practise together. Last year several groups ran out of time.\nMaria: We're planning to rehearse on Monday afternoon in the library.", "code": null, "qs": [{"q": "Why is Maria covering marine life?", "opts": ["she did a biology course", "Tom asked her to", "it is the easiest part", "the tutor chose it"], "expl": "Она проходила курс биологии."}, {"q": "How long is the presentation, without questions?", "opts": ["15 minutes", "20 minutes", "5 minutes", "10 minutes"], "expl": "Fifteen minutes plus five for questions."}, {"q": "How will they present data?", "opts": ["bar charts", "tables", "pie charts", "videos"], "expl": "Таблицы отклонили, выбрали bar charts."}, {"q": "According to the research Maria read, the biggest long-term impact comes from:", "opts": ["better recycling systems", "a tax on plastic bags", "banning all plastic", "cleaning beaches"], "expl": "Мнение Тома — налог, но исследование — переработка."}, {"q": "When will they rehearse?", "opts": ["Monday afternoon", "Monday morning", "next Friday", "Sunday evening"], "expl": "Monday afternoon in the library."}], "audio": true}, {"id": "l9", "topic": "e2", "title": "Lecture: How Bees Communicate", "kind": "Listening · Part 4", "text": "Today we're going to look at one of the most remarkable systems of communication in the animal world: the dance of the honeybee.\n\nWhen a worker bee finds a good source of food, she returns to the hive and performs a series of movements on the surface of the honeycomb. This behaviour was first explained in detail by the Austrian scientist Karl von Frisch, who received a Nobel Prize for his work in 1973.\n\nThere are two main types of dance. If the food is close to the hive — generally within about fifty metres — the bee performs a \"round dance\", moving in small circles. This tells other bees that food is nearby, but it does not indicate the direction.\n\nFor more distant food, the bee performs the \"waggle dance\". She moves forward in a straight line while shaking her body from side to side, then circles back and repeats the movement. The angle of the straight run in relation to vertical shows the direction of the food relative to the sun. The duration of the waggle indicates the distance: the longer the waggle, the further away the food is.\n\nRemarkably, bees can adjust their dance as the sun moves across the sky during the day. Recent research has also shown that younger bees improve their dancing accuracy with experience, suggesting that learning plays a role in what was once thought to be purely instinctive behaviour.", "code": null, "qs": [{"q": "Karl von Frisch received a Nobel Prize in:", "opts": ["1973", "1937", "1963", "1983"], "expl": "Nineteen seventy-three."}, {"q": "The round dance is used when food is:", "opts": ["within about 50 metres", "more than 500 metres away", "directly above the hive", "in the shade"], "expl": "Close to the hive — about fifty metres."}, {"q": "What does the round dance NOT show?", "opts": ["direction", "that food is nearby", "that food exists", "that food is close"], "expl": "«it does not indicate the direction»."}, {"q": "In the waggle dance, distance is shown by:", "opts": ["how long the waggle lasts", "the angle of the run", "the number of circles", "the speed of the wings"], "expl": "Duration of the waggle."}, {"q": "Recent research suggests that younger bees:", "opts": ["become more accurate with experience", "cannot dance at all", "dance only in the morning", "ignore the sun"], "expl": "Learning plays a role."}], "audio": true}, {"id": "l10", "topic": "e2", "title": "Hiring a Car", "kind": "Listening · Part 1", "text": "Agent: City Car Hire, how can I help?\nCustomer: Hi, I'd like to hire a car for a week, from the ninth of August.\nAgent: Certainly. What size of car are you looking for?\nCustomer: Something small and economical — it's just me and my sister.\nAgent: Our compact model is forty-two pounds a day. For seven days that would be two hundred and ninety-four pounds.\nCustomer: Does that include insurance?\nAgent: Basic insurance is included. Full insurance costs an extra eight pounds a day.\nCustomer: I'll take the basic. Can I pick the car up at the airport?\nAgent: Yes, our desk is in the arrivals hall of Terminal 2. Sorry — Terminal 3. We moved last month.\nCustomer: OK. And do you need my driving licence number now?\nAgent: No, just bring your licence and a credit card when you collect the car. Could I have a phone number?\nCustomer: Yes, it's oh-seven-seven, four-five-two, nine-one-three-eight.\nAgent: Thank you. One last thing — please return the car with a full tank, or we'll charge you for the fuel.", "code": null, "qs": [{"q": "When does the hire start?", "opts": ["9 August", "19 August", "9 April", "7 August"], "expl": "From the ninth of August."}, {"q": "What is the daily price of the compact car?", "opts": ["£42", "£294", "£8", "£50"], "expl": "Forty-two pounds a day."}, {"q": "Where is the desk?", "opts": ["Terminal 3 arrivals hall", "Terminal 2 arrivals hall", "Terminal 3 departures", "in the city centre"], "expl": "Исправление: Terminal 3."}, {"q": "What is the phone number?", "opts": ["077 452 9138", "077 452 9183", "077 542 9138", "070 452 9138"], "expl": "oh-seven-seven, four-five-two, nine-one-three-eight."}, {"q": "What must the customer do when returning the car?", "opts": ["fill the tank", "clean the car", "pay for full insurance", "return it to Terminal 2"], "expl": "Return with a full tank."}], "audio": true}];
